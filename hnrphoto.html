<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>해누리포토 · HAENURI PHOTO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
/* ============================================================
   해누리포토  ·  설정값 (QR 다운로드용 Supabase Storage)
   아래 3개 값만 채우면 학생 폰으로 QR 다운로드가 켜집니다.
   값이 비어 있으면 '같은 기기 다운로드'만 동작합니다.
   ============================================================ */
:root{
  --navy:#28346b;
  --navy-deep:#1d2752;
  --gold:#f4b223;
  --gold-soft:#ffd873;
  --cream:#fff8e9;
  --ink:#222;
  --pink:#ff9ec4;
  --shadow:0 14px 34px rgba(29,39,82,.28);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;}
body{
  font-family:'Jua','Gowun Dodum',sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 15% 12%, rgba(244,178,35,.22), transparent 42%),
    radial-gradient(circle at 85% 8%, rgba(255,158,196,.20), transparent 40%),
    radial-gradient(circle at 50% 120%, rgba(40,52,107,.28), transparent 55%),
    linear-gradient(160deg,#f5ecd6 0%, #efe3c4 100%);
  background-color:#f6edd6;
  min-height:100%;
  overflow-x:hidden;
}
/* dotted halftone texture */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(rgba(40,52,107,.06) 1px, transparent 1.4px);
  background-size:18px 18px;
}
.wrap{
  position:relative;z-index:1;
  max-width:480px;margin:0 auto;min-height:100dvh;
  display:flex;flex-direction:column;
  padding:18px 16px 30px;
}
.screen{display:none;flex:1;flex-direction:column;animation:pop .45s cubic-bezier(.2,1.3,.4,1);}
.screen.active{display:flex;}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98);}to{opacity:1;transform:none;}}

/* ---------- buttons ---------- */
.btn{
  font-family:'Jua',sans-serif;border:none;cursor:pointer;
  border-radius:18px;padding:15px 22px;font-size:19px;
  background:var(--gold);color:var(--navy-deep);
  box-shadow:0 6px 0 #c98e12, var(--shadow);
  transition:transform .08s, box-shadow .08s;letter-spacing:.5px;
}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #c98e12, var(--shadow);}
.btn.navy{background:var(--navy);color:#fff;box-shadow:0 6px 0 #141c3c, var(--shadow);}
.btn.ghost{background:#fff;color:var(--navy);box-shadow:0 5px 0 #d8cdb0;}
.btn.block{width:100%;}
.btn-row{display:flex;gap:10px;}
.btn-row .btn{flex:1;}

/* ---------- start screen ---------- */
.brandcard{
  margin:auto;text-align:center;padding:8px 6px 0;
}
.logo-badge{
  width:148px;height:148px;border-radius:50%;margin:0 auto 6px;
  display:grid;place-items:center;
  background:#fff;box-shadow:var(--shadow), 0 0 0 8px rgba(255,255,255,.5);
  animation:floaty 3.4s ease-in-out infinite;
}
.logo-badge img{width:128px;height:128px;border-radius:50%;object-fit:cover;}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-1deg);}50%{transform:translateY(-10px) rotate(1deg);}}
.title-en{font-family:'Black Han Sans';color:var(--navy);letter-spacing:6px;font-size:15px;margin:18px 0 0;}
.title-ko{
  font-family:'Black Han Sans';font-size:54px;line-height:1;margin:2px 0 4px;
  color:var(--navy-deep);
  text-shadow:4px 4px 0 var(--gold), 8px 8px 0 rgba(244,178,35,.35);
}
.tag{font-size:16px;color:#6a5f47;margin:8px 0 26px;}
.sticker-deco{position:absolute;font-size:30px;opacity:.85;pointer-events:none;animation:floaty 4s ease-in-out infinite;}

/* ---------- generic panel ---------- */
.panel{background:rgba(255,255,255,.82);backdrop-filter:blur(4px);border-radius:24px;padding:18px;box-shadow:var(--shadow);}
.heading{font-family:'Black Han Sans';color:var(--navy);font-size:22px;margin:4px 2px 14px;display:flex;align-items:center;gap:8px;}
.heading .pill{background:var(--gold);color:var(--navy-deep);font-size:13px;padding:3px 10px;border-radius:999px;font-family:'Jua';}
.sub{font-size:14px;color:#7a6e54;margin:-6px 2px 14px;}

/* ---------- frame select ---------- */
.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.opt{
  border:3px solid transparent;border-radius:18px;padding:12px;background:#fff;cursor:pointer;text-align:center;
  transition:transform .12s, border-color .12s;box-shadow:0 4px 0 #e6dcc1;
}
.opt:active{transform:scale(.97);}
.opt.sel{border-color:var(--navy);box-shadow:0 4px 0 var(--gold);}
.opt .mini{display:flex;justify-content:center;margin-bottom:8px;}
.opt .lbl{font-size:15px;color:var(--navy);}
.swatch{width:40px;height:40px;border-radius:10px;border:2px solid rgba(0,0,0,.08);}
.mini-strip{width:46px;border-radius:6px;padding:4px;display:flex;flex-direction:column;gap:3px;}
.mini-strip i{display:block;background:rgba(255,255,255,.85);border-radius:2px;flex:1;}
.mini-strip.s i{height:11px;}
.mini-strip.g{flex-direction:row;flex-wrap:wrap;width:50px;}
.mini-strip.g i{width:calc(50% - 2px);height:18px;}

/* ---------- capture ---------- */
.stage{
  position:relative;border-radius:24px;overflow:hidden;background:#000;
  aspect-ratio:3/4;box-shadow:var(--shadow);border:5px solid #fff;
}
#video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block;}
.countdown{
  position:absolute;inset:0;display:none;place-items:center;
  font-family:'Black Han Sans';font-size:130px;color:#fff;
  text-shadow:0 6px 20px rgba(0,0,0,.5);background:rgba(0,0,0,.18);
}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;}
.flash.go{animation:flash .5s ease;}
@keyframes flash{0%{opacity:.95;}100%{opacity:0;}}
.shot-dots{display:flex;gap:8px;justify-content:center;margin:14px 0;}
.shot-dots b{width:14px;height:14px;border-radius:50%;background:#d9cead;transition:.2s;}
.shot-dots b.on{background:var(--gold);transform:scale(1.25);}
.filmstrip-mini{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:5px;}
.filmstrip-mini img{width:44px;height:34px;object-fit:cover;border:2px solid #fff;border-radius:5px;box-shadow:0 3px 8px rgba(0,0,0,.4);}

/* filter chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 2px;scrollbar-width:none;}
.chips::-webkit-scrollbar{display:none;}
.chip{
  flex:0 0 auto;border:none;cursor:pointer;border-radius:14px;padding:9px 14px;font-family:'Jua';font-size:15px;
  background:#fff;color:var(--navy);box-shadow:0 3px 0 #e0d6ba;white-space:nowrap;
}
.chip.sel{background:var(--navy);color:#fff;box-shadow:0 3px 0 var(--gold);}
.cam-warn{font-size:13px;color:#a06b00;background:#fff5dc;border-radius:14px;padding:10px 12px;margin-top:10px;line-height:1.5;}

/* ---------- edit ---------- */
.editzone{position:relative;margin:0 auto;touch-action:none;}
#editCanvas{display:block;width:100%;border-radius:14px;box-shadow:var(--shadow);}
.stk{
  position:absolute;transform:translate(-50%,-50%) rotate(var(--r,0deg));
  cursor:grab;user-select:none;line-height:1;will-change:transform;
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.35));
}
.stk.sel{outline:2px dashed var(--navy);outline-offset:4px;border-radius:6px;}
.stk-tools{position:absolute;display:none;gap:6px;z-index:30;}
.stk-tools.show{display:flex;}
.stk-tools button{
  width:34px;height:34px;border:none;border-radius:50%;background:#fff;color:var(--navy);
  font-size:16px;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.25);
}
.stk-tools button.del{background:#ff5b6e;color:#fff;}
.tray{display:flex;gap:6px;overflow-x:auto;padding:8px 2px;scrollbar-width:none;}
.tray::-webkit-scrollbar{display:none;}
.tray button{flex:0 0 auto;font-size:26px;background:#fff;border:none;border-radius:14px;width:48px;height:48px;cursor:pointer;box-shadow:0 3px 0 #e0d6ba;}
.tray button:active{transform:translateY(2px);}
.tabbar{display:flex;gap:8px;margin:12px 0 8px;}
.tabbar button{flex:1;border:none;background:#fff;border-radius:14px;padding:10px;font-family:'Jua';font-size:15px;color:var(--navy);box-shadow:0 3px 0 #e0d6ba;cursor:pointer;}
.tabbar button.sel{background:var(--gold);box-shadow:0 3px 0 #c98e12;}
.toolpane{display:none;}
.toolpane.show{display:block;}

/* ---------- result ---------- */
.result-img{width:62%;max-width:240px;margin:6px auto 16px;display:block;border-radius:14px;box-shadow:var(--shadow);}
.qrcard{background:#fff;border-radius:20px;padding:18px;text-align:center;box-shadow:var(--shadow);margin-top:14px;}
#qrbox{display:flex;justify-content:center;margin:14px 0;min-height:10px;}
#qrbox img,#qrbox canvas{border-radius:10px;}
.qr-steps{text-align:left;font-size:13px;color:#6a5f47;line-height:1.7;background:#fff8e9;border-radius:14px;padding:12px 14px;margin-top:10px;}
.qr-steps code{background:#28346b;color:#ffd873;padding:1px 6px;border-radius:6px;font-size:12px;}
.spinner{width:26px;height:26px;border:4px solid #e7dcc0;border-top-color:var(--navy);border-radius:50%;animation:spin .8s linear infinite;margin:8px auto;}
@keyframes spin{to{transform:rotate(360deg);}}

.foot-logo{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:22px;opacity:.7;}
.foot-logo img{width:26px;height:26px;border-radius:50%;}
.foot-logo span{font-size:13px;color:var(--navy);}
.hidden{display:none!important;}
</style>
</head>
<body>
<div class="wrap">

  <!-- ============ START ============ -->
  <section class="screen active" id="s-start">
    <div class="brandcard">
      <span class="sticker-deco" style="left:6%;top:4%;">✨</span>
      <span class="sticker-deco" style="right:8%;top:10%;animation-delay:.6s;">📸</span>
      <span class="sticker-deco" style="left:12%;bottom:30%;animation-delay:1.1s;">💛</span>
      <span class="sticker-deco" style="right:10%;bottom:34%;animation-delay:.3s;">⭐</span>
      <div class="logo-badge"><img id="logoImg" alt="해누리 로고" /></div>
      <p class="title-en">HAENURI&nbsp;PHOTO</p>
      <h1 class="title-ko">해누리포토</h1>
      <p class="tag">우리 학교 인생네컷 부스 📷<br/>찰칵! 추억을 네 컷에 담아요</p>
      <button class="btn navy block" style="font-size:22px;padding:18px;" data-act="goFrame">촬영 시작하기 ▶</button>
    </div>
    <div class="foot-logo"><img id="logoFoot1"/><span>해누리중학교 · 2019</span></div>
  </section>

  <!-- ============ FRAME SELECT ============ -->
  <section class="screen" id="s-frame">
    <div class="panel">
      <div class="heading">① 프레임 고르기 <span class="pill">STEP 1</span></div>
      <p class="sub">사진 배치를 골라요</p>
      <div class="opt-grid" id="layoutOpts">
        <div class="opt sel" data-layout="strip" data-act="layout" data-arg="strip">
          <div class="mini"><div class="mini-strip s" style="background:#28346b"><i></i><i></i><i></i><i></i></div></div>
          <div class="lbl">세로 4컷</div>
        </div>
        <div class="opt" data-layout="grid" data-act="layout" data-arg="grid">
          <div class="mini"><div class="mini-strip g" style="background:#28346b;height:46px"><i></i><i></i><i></i><i></i></div></div>
          <div class="lbl">2 × 2 컷</div>
        </div>
      </div>

      <div class="heading" style="margin-top:20px;">프레임 색</div>
      <div class="opt-grid" id="colorOpts"></div>

      <div class="btn-row" style="margin-top:20px;">
        <button class="btn ghost" data-act="show" data-arg="s-start">◀ 뒤로</button>
        <button class="btn navy" data-act="goCapture">다음 ▶</button>
      </div>
    </div>
    <div class="foot-logo"><img id="logoFoot2"/><span>해누리포토</span></div>
  </section>

  <!-- ============ CAPTURE ============ -->
  <section class="screen" id="s-capture">
    <div class="heading">② 촬영하기 <span class="pill" id="shotLabel">0 / 4</span></div>
    <div class="stage">
      <video id="video" playsinline autoplay muted></video>
      <div class="filmstrip-mini" id="thumbs"></div>
      <div class="countdown" id="cd">3</div>
      <div class="flash" id="flash"></div>
    </div>
    <div class="shot-dots" id="dots"></div>
    <div class="chips" id="filterChips"></div>
    <div class="cam-warn hidden" id="camWarn"></div>
    <input type="file" id="filePick" accept="image/*" multiple class="hidden" />
    <div class="btn-row" style="margin-top:6px;">
      <button class="btn ghost" data-act="abortCapture">◀ 뒤로</button>
      <button class="btn navy" id="shootBtn" data-act="shoot">📸 촬영!</button>
    </div>
    <div style="text-align:center;margin-top:12px;">
      <button class="btn ghost" id="uploadModeBtn" style="font-size:15px;padding:10px 16px;" data-act="uploadMode">📁 카메라 대신 사진 불러오기</button>
    </div>
  </section>

  <!-- ============ EDIT ============ -->
  <section class="screen" id="s-edit">
    <div class="heading">③ 꾸미기 <span class="pill">STEP 3</span></div>
    <div class="editzone" id="editzone">
      <canvas id="editCanvas"></canvas>
      <div class="stk-tools" id="stkTools">
        <button data-act="stkScale" data-arg="1.15">＋</button>
        <button data-act="stkScale" data-arg="0.87">－</button>
        <button data-act="stkRotate" data-arg="15">↻</button>
        <button class="del" data-act="stkDelete">✕</button>
      </div>
    </div>

    <div class="tabbar">
      <button class="sel" id="tabSticker" data-act="tab" data-arg="sticker">💖 스티커</button>
      <button id="tabFilter" data-act="tab" data-arg="filter">🎨 필터</button>
    </div>
    <div class="toolpane show" id="paneSticker">
      <div class="tray" id="stickerTray"></div>
    </div>
    <div class="toolpane" id="paneFilter">
      <div class="chips" id="filterChips2"></div>
    </div>

    <div class="btn-row" style="margin-top:14px;">
      <button class="btn ghost" data-act="retake">↺ 다시 찍기</button>
      <button class="btn navy" data-act="result">완성 ▶</button>
    </div>
  </section>

  <!-- ============ RESULT ============ -->
  <section class="screen" id="s-result">
    <div class="panel" style="text-align:center;">
      <div class="heading" style="justify-content:center;">완성! 🎉</div>
      <img class="result-img" id="resultImg" alt="완성 사진" />
      <button class="btn navy block" data-act="download">💾 사진 저장하기</button>

      <div class="qrcard">
        <div style="font-family:'Black Han Sans';color:var(--navy);font-size:18px;">📱 폰으로 받기 (QR)</div>
        <div id="qrbox"></div>
        <div id="qrAction"></div>
        <div class="qr-steps" id="qrSteps"></div>
      </div>

      <div class="btn-row" style="margin-top:16px;">
        <button class="btn ghost" data-act="editAgain">◀ 더 꾸미기</button>
        <button class="btn" data-act="restart">🏠 처음으로</button>
      </div>
    </div>
    <div class="foot-logo"><img id="logoFoot3"/><span>해누리포토 · 해누리중학교</span></div>
  </section>

</div>

/* ---- 상태 ---- */
const state = { layout:'strip', frame:'navy', filter:'none', shots:[], stickers:[], mode:'camera' };
let stream=null, shotIndex=0, selStk=null, stkId=0, lastUrl=null, lastBlob=null;

/* ---- 화면 전환 ---- */
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);}
/* 이벤트 위임: 인라인 onclick 대신 사용 (샌드박스/배포 환경 모두에서 안전) */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act,g=t.dataset.arg;
  switch(a){
    case 'goFrame':goFrame();break;
    case 'show':show(g);break;
    case 'layout':pickLayout(g,t);break;
    case 'goCapture':goCapture();break;
    case 'abortCapture':abortCapture();break;
    case 'shoot':startShootSequence();break;
    case 'uploadMode':useUploadMode();break;
    case 'tab':editTab(g);break;
    case 'retake':retake();break;
    case 'result':goResult();break;
    case 'stkScale':stkScale(parseFloat(g));break;
    case 'stkRotate':stkRotate(parseFloat(g));break;
    case 'stkDelete':stkDelete();break;
    case 'download':downloadImg();break;
    case 'editAgain':editAgain();break;
    case 'restart':restartAll();break;
    case 'uploadQR':uploadAndQR();break;
  }
});

/* ===== 프레임 선택 ===== */
function buildColorOpts(){
  const c=document.getElementById('colorOpts');c.innerHTML='';
  FRAMES.forEach((f,i)=>{
    const d=document.createElement('div');
    d.className='opt'+(f.key===state.frame?' sel':'');
    d.innerHTML=`<div class="mini"><div class="swatch" style="background:${f.bg}"></div></div><div class="lbl">${f.name}</div>`;
    d.onclick=()=>{state.frame=f.key;[...c.children].forEach(x=>x.classList.remove('sel'));d.classList.add('sel');};
    c.appendChild(d);
  });
}
function pickLayout(l,el){state.layout=l;document.querySelectorAll('#layoutOpts .opt').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');}
function goFrame(){buildColorOpts();show('s-frame');}

/* ===== 필터 칩 ===== */
function buildChips(containerId){
  const c=document.getElementById(containerId);c.innerHTML='';
  FILTERS.forEach(f=>{
    const b=document.createElement('button');
    b.className='chip'+(f.key===state.filter?' sel':'');
    b.textContent=f.name;
    b.onclick=()=>{state.filter=f.key;applyFilterUI();if(document.getElementById('s-edit').classList.contains('active'))renderEdit();};
    c.appendChild(b);
  });
}
function applyFilterUI(){
  document.querySelectorAll('#filterChips .chip,#filterChips2 .chip').forEach(ch=>{
    ch.classList.toggle('sel', ch.textContent===FILTERS.find(f=>f.key===state.filter).name);
  });
  document.getElementById('video').style.filter=filterCss(state.filter);
}

/* ===== 촬영 ===== */
async function goCapture(){
  show('s-capture');
  state.shots=[];shotIndex=0;
  document.getElementById('thumbs').innerHTML='';
  buildChips('filterChips');applyFilterUI();buildDots();updateShotLabel();
  document.getElementById('camWarn').classList.add('hidden');
  state.mode='camera';
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:1280}},audio:false});
    const v=document.getElementById('video');v.srcObject=stream;v.classList.remove('hidden');
    document.getElementById('shootBtn').disabled=false;
  }catch(e){
    showCamWarn('카메라를 열 수 없어요 ('+e.name+'). 아래 <b>사진 불러오기</b>로 진행할 수 있어요. (학교에서 쓸 땐 HTTPS 주소 + 카메라 권한 허용이 필요해요)');
  }
}
function showCamWarn(msg){const w=document.getElementById('camWarn');w.innerHTML='⚠️ '+msg;w.classList.remove('hidden');}
function buildDots(){const d=document.getElementById('dots');d.innerHTML='';for(let i=0;i<4;i++){const b=document.createElement('b');d.appendChild(b);}}
function setDots(n){[...document.getElementById('dots').children].forEach((b,i)=>b.classList.toggle('on',i<n));}
function updateShotLabel(){document.getElementById('shotLabel').textContent=state.shots.length+' / 4';}

function cellAspect(){return state.layout==='strip'?(4/3):1;} // w/h
function captureFrame(){
  const v=document.getElementById('video');
  const vw=v.videoWidth, vh=v.videoHeight;
  const asp=cellAspect();
  // crop video (cover) to target aspect
  let cw=vw, ch=vw/asp;
  if(ch>vh){ch=vh;cw=vh*asp;}
  const sx=(vw-cw)/2, sy=(vh-ch)/2;
  const outW=900, outH=Math.round(900/asp);
  const cv=document.createElement('canvas');cv.width=outW;cv.height=outH;
  const ctx=cv.getContext('2d');
  ctx.save();ctx.translate(outW,0);ctx.scale(-1,1); // mirror to match preview
  ctx.drawImage(v,sx,sy,cw,ch,0,0,outW,outH);ctx.restore();
  return cv;
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function startShootSequence(){
  if(state.mode!=='camera'||!stream){return;}
  const btn=document.getElementById('shootBtn');btn.disabled=true;
  for(let i=state.shots.length;i<4;i++){
    await countdown(3);
    flash();
    const cv=captureFrame();state.shots.push(cv);
    addThumb(cv);setDots(state.shots.length);updateShotLabel();
    await sleep(700);
  }
  btn.disabled=false;
  stopStream();
  await sleep(250);
  enterEdit();
}
function countdown(n){
  return new Promise(res=>{
    const cd=document.getElementById('cd');cd.style.display='grid';
    let k=n;cd.textContent=k;
    const t=setInterval(()=>{k--;if(k<=0){clearInterval(t);cd.style.display='none';res();}else{cd.textContent=k;}},800);
  });
}
function flash(){const f=document.getElementById('flash');f.classList.remove('go');void f.offsetWidth;f.classList.add('go');}
function addThumb(cv){const img=document.createElement('img');img.src=cv.toDataURL();document.getElementById('thumbs').appendChild(img);}
function stopStream(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}}
function abortCapture(){stopStream();show('s-frame');}

/* ----- 업로드 대체 모드 ----- */
function useUploadMode(){
  state.mode='upload';stopStream();
  document.getElementById('filePick').click();
}
document.getElementById('filePick').addEventListener('change',async e=>{
  const files=[...e.target.files].slice(0,4);
  if(files.length<1)return;
  state.shots=[];document.getElementById('thumbs').innerHTML='';
  const asp=cellAspect();const outW=900,outH=Math.round(900/asp);
  for(const file of files){
    const img=await loadFile(file);
    let cw=img.width,ch=img.width/asp;
    if(ch>img.height){ch=img.height;cw=img.height*asp;}
    const sx=(img.width-cw)/2,sy=(img.height-ch)/2;
    const cv=document.createElement('canvas');cv.width=outW;cv.height=outH;
    cv.getContext('2d').drawImage(img,sx,sy,cw,ch,0,0,outW,outH);
    state.shots.push(cv);addThumb(cv);
  }
  // if fewer than 4, repeat last to fill
  while(state.shots.length<4){const c=state.shots[state.shots.length-1];state.shots.push(c);addThumb(c);}
  setDots(4);updateShotLabel();
  await sleep(200);enterEdit();
});
function loadFile(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=r.result;};r.onerror=rej;r.readAsDataURL(file);});}

/* ===== 합성 (base: 사진+프레임+로고, 스티커 제외) ===== */
function stripLayout(){
  // returns {W,H, cells:[{x,y,w,h}], footH}
  const M=70, GAP=34;             // margin / gap (export px)
  const f=FRAMES.find(x=>x.key===state.frame);
  if(state.layout==='strip'){
    const cw=900, ch=Math.round(900/(4/3));            // 900 x 675
    const W=cw+M*2, footH=240;
    const H=M + 4*ch + 3*GAP + footH;
    const cells=[];for(let i=0;i<4;i++)cells.push({x:M,y:M+i*(ch+GAP),w:cw,h:ch});
    return {W,H,cells,footH,f};
  }else{
    const cs=560;                                       // square cell
    const W=cs*2+GAP+M*2, footH=200;
    const H=M+cs*2+GAP+footH;
    const cells=[
      {x:M,y:M,w:cs,h:cs},{x:M+cs+GAP,y:M,w:cs,h:cs},
      {x:M,y:M+cs+GAP,w:cs,h:cs},{x:M+cs+GAP,y:M+cs+GAP,w:cs,h:cs}
    ];
    return {W,H,cells,footH,f};
  }
}
function drawBase(ctx,L){
  const {W,H,cells,footH,f}=L;
  ctx.fillStyle=f.bg;ctx.fillRect(0,0,W,H);
  // subtle inner accent border
  ctx.strokeStyle=f.accent;ctx.globalAlpha=.5;ctx.lineWidth=6;
  ctx.strokeRect(22,22,W-44,H-44);ctx.globalAlpha=1;
  // photos with filter
  ctx.filter=filterCss(state.filter);
  cells.forEach((c,i)=>{const src=state.shots[i];if(src)ctx.drawImage(src,c.x,c.y,c.w,c.h);});
  ctx.filter='none';
  // footer band
  const fy=H-footH;
  const ls=footH*0.42;
  if(logoImage.complete && logoImage.naturalWidth){
    ctx.save();ctx.beginPath();const lyy=fy+footH*0.08;
    ctx.arc(W/2,lyy+ls/2,ls/2,0,Math.PI*2);ctx.closePath();ctx.clip();
    ctx.drawImage(logoImage,W/2-ls/2,lyy,ls,ls);ctx.restore();
  }
  ctx.fillStyle=f.fg;ctx.textAlign='center';ctx.textBaseline='alphabetic';
  ctx.font="700 "+Math.round(footH*0.18)+"px 'Black Han Sans', sans-serif";
  ctx.fillText('해누리포토', W/2, fy+footH*0.66);
  ctx.font="600 "+Math.round(footH*0.12)+"px 'Jua', sans-serif";
  ctx.globalAlpha=.85;
  const d=new Date();const ds=`${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
  ctx.fillText('해누리중학교 · '+ds, W/2, fy+footH*0.88);
  ctx.globalAlpha=1;
}

/* ===== EDIT 화면 ===== */
function enterEdit(){
  state.stickers=[];selStk=null;
  buildStickerTray();buildChips('filterChips2');
  editTab('sticker');
  show('s-edit');
  renderEdit();
}
let editScale=1;
function renderEdit(){
  const L=stripLayout();
  const cv=document.getElementById('editCanvas');
  cv.width=L.W;cv.height=L.H;
  drawBase(cv.getContext('2d'),L);
  // size editzone to displayed canvas
  requestAnimationFrame(()=>{
    const zone=document.getElementById('editzone');
    zone.style.width=cv.clientWidth+'px';zone.style.height=cv.clientHeight+'px';
    editScale=cv.clientWidth/L.W;
    layoutStickers();
  });
}
function buildStickerTray(){
  const t=document.getElementById('stickerTray');t.innerHTML='';
  STICKERS.forEach(s=>{const b=document.createElement('button');b.textContent=s;b.onclick=()=>addSticker(s);t.appendChild(b);});
}
function editTab(which){
  document.getElementById('tabSticker').classList.toggle('sel',which==='sticker');
  document.getElementById('tabFilter').classList.toggle('sel',which==='filter');
  document.getElementById('paneSticker').classList.toggle('show',which==='sticker');
  document.getElementById('paneFilter').classList.toggle('show',which==='filter');
}
function addSticker(ch){
  const s={id:++stkId,ch,x:.5,y:.42,size:.16,rot:0};
  state.stickers.push(s);renderStickerEl(s);selectStk(s.id);
}
function renderStickerEl(s){
  const zone=document.getElementById('editzone');
  let el=document.getElementById('stk'+s.id);
  if(!el){el=document.createElement('div');el.className='stk';el.id='stk'+s.id;el.textContent=s.ch;zone.appendChild(el);attachDrag(el,s);}
  positionStk(el,s);
}
function positionStk(el,s){
  const zone=document.getElementById('editzone');
  const w=zone.clientWidth,h=zone.clientHeight;
  el.style.left=(s.x*w)+'px';el.style.top=(s.y*h)+'px';
  el.style.fontSize=(s.size*w)+'px';el.style.setProperty('--r',s.rot+'deg');
}
function layoutStickers(){state.stickers.forEach(s=>{const el=document.getElementById('stk'+s.id);if(el)positionStk(el,s);});if(selStk)placeTools();}
function selectStk(id){
  selStk=id;
  document.querySelectorAll('.stk').forEach(e=>e.classList.toggle('sel',e.id==='stk'+id));
  placeTools();
}
function placeTools(){
  const tools=document.getElementById('stkTools');
  if(!selStk){tools.classList.remove('show');return;}
  const s=state.stickers.find(x=>x.id===selStk);const el=document.getElementById('stk'+selStk);
  if(!s||!el){tools.classList.remove('show');return;}
  tools.classList.add('show');
  const zone=document.getElementById('editzone');
  const half=el.offsetWidth/2;
  let tx=el.offsetLeft, ty=el.offsetTop-half-26;
  if(ty<0)ty=el.offsetTop+half+8;
  tools.style.left=tx+'px';tools.style.top=ty+'px';tools.style.transform='translateX(-50%)';
}
function attachDrag(el,s){
  let dragging=false,ox=0,oy=0;
  const down=ev=>{ev.preventDefault();selectStk(s.id);dragging=true;const p=pt(ev);const zone=document.getElementById('editzone');
    ox=p.x-s.x*zone.clientWidth;oy=p.y-s.y*zone.clientHeight;el.style.cursor='grabbing';};
  const move=ev=>{if(!dragging)return;const zone=document.getElementById('editzone');const p=pt(ev);
    s.x=Math.min(1,Math.max(0,(p.x-ox)/zone.clientWidth));s.y=Math.min(1,Math.max(0,(p.y-oy)/zone.clientHeight));
    positionStk(el,s);placeTools();};
  const up=()=>{dragging=false;el.style.cursor='grab';};
  el.addEventListener('pointerdown',down);
  window.addEventListener('pointermove',move);
  window.addEventListener('pointerup',up);
}
function pt(ev){const zone=document.getElementById('editzone');const r=zone.getBoundingClientRect();return {x:ev.clientX-r.left,y:ev.clientY-r.top};}
function stkScale(f){const s=state.stickers.find(x=>x.id===selStk);if(!s)return;s.size=Math.min(.6,Math.max(.05,s.size*f));renderStickerEl(s);placeTools();}
function stkRotate(d){const s=state.stickers.find(x=>x.id===selStk);if(!s)return;s.rot=(s.rot+d)%360;renderStickerEl(s);}
function stkDelete(){const i=state.stickers.findIndex(x=>x.id===selStk);if(i<0)return;const el=document.getElementById('stk'+selStk);if(el)el.remove();state.stickers.splice(i,1);selStk=null;placeTools();}
// tap empty canvas to deselect
document.getElementById('editCanvas').addEventListener('pointerdown',()=>{selStk=null;document.querySelectorAll('.stk').forEach(e=>e.classList.remove('sel'));placeTools();});
window.addEventListener('resize',()=>{if(document.getElementById('s-edit').classList.contains('active'))renderEdit();});

/* ===== 최종 합성 (스티커 포함) ===== */
function composeFinal(){
  const L=stripLayout();
  const cv=document.createElement('canvas');cv.width=L.W;cv.height=L.H;
  const ctx=cv.getContext('2d');
  drawBase(ctx,L);
  ctx.textAlign='center';ctx.textBaseline='middle';
  state.stickers.forEach(s=>{
    ctx.save();
    ctx.translate(s.x*L.W,s.y*L.H);ctx.rotate(s.rot*Math.PI/180);
    ctx.font=(s.size*L.W*1.0)+"px serif";
    ctx.fillText(s.ch,0,0);
    ctx.restore();
  });
  return cv;
}
function retake(){state.shots=[];goCapture();}
function goResult(){
  const cv=composeFinal();
  cv.toBlob(b=>{lastBlob=b;if(lastUrl)URL.revokeObjectURL(lastUrl);lastUrl=URL.createObjectURL(b);
    document.getElementById('resultImg').src=lastUrl;},'image/png');
  setupQR();
  show('s-result');
}
function editAgain(){show('s-edit');renderEdit();}
function downloadImg(){
  const cv=composeFinal();
  const a=document.createElement('a');
  a.download='해누리포토_'+Date.now()+'.png';
  a.href=cv.toDataURL('image/png');a.click();
}
function restartAll(){state.shots=[];state.stickers=[];state.filter='none';show('s-start');}

/* ===== QR / Supabase ===== */
function setupQR(){
  const box=document.getElementById('qrbox');box.innerHTML='';
  const action=document.getElementById('qrAction');
  const steps=document.getElementById('qrSteps');
  if(SUPABASE_READY){
    steps.innerHTML='';
    action.innerHTML='<button class="btn" style="font-size:16px;padding:11px 18px;" data-act="uploadQR">🔗 QR 만들기</button>';
  }else{
    action.innerHTML='';
    steps.innerHTML=
      '<b>QR 다운로드를 켜려면?</b><br/>'+
      '폰으로 사진을 받으려면 이미지를 인터넷에 올려야 해요. 선생님은 이미 Supabase를 쓰시니 Storage가 딱이에요 👇<br/><br/>'+
      '1. Supabase → Storage → <code>public</code> 버킷 <code>'+SUPABASE_BUCKET+'</code> 생성<br/>'+
      '2. 이 파일 상단의 <code>SUPABASE_URL</code> / <code>SUPABASE_ANON_KEY</code> 채우기<br/>'+
      '3. 끝! (CLI·Edge Function 필요 없음. 클라이언트 업로드만)<br/><br/>'+
      '지금은 위 <b>💾 사진 저장하기</b>로 이 기기에 바로 받을 수 있어요.';
  }
}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});}
async function uploadAndQR(){
  const box=document.getElementById('qrbox');const action=document.getElementById('qrAction');
  action.innerHTML='';box.innerHTML='<div class="spinner"></div>';
  try{
    if(!window.supabase){await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2');}
    const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
    const path='photo_'+Date.now()+'.png';
    const {error}=await sb.storage.from(SUPABASE_BUCKET).upload(path,lastBlob,{contentType:'image/png',upsert:true});
    if(error)throw error;
    const {data}=sb.storage.from(SUPABASE_BUCKET).getPublicUrl(path);
    await makeQR(data.publicUrl);
    document.getElementById('qrSteps').innerHTML='✅ QR을 폰 카메라로 찍으면 사진이 열려요. 길게 눌러 저장!';
  }catch(e){
    box.innerHTML='';document.getElementById('qrSteps').innerHTML='⚠️ 업로드 실패: '+(e.message||e)+'<br/>버킷 공개 설정과 키를 확인해 주세요.';
    action.innerHTML='<button class="btn ghost" data-act="uploadQR">다시 시도</button>';
  }
}
function refreshIfEditing(){if(document.getElementById('s-edit').classList.contains('active'))renderEdit();}
if(document.fonts&&document.fonts.ready){document.fonts.ready.then(refreshIfEditing);}
logoImage.addEventListener('load',refreshIfEditing);

async function makeQR(url){
  const box=document.getElementById('qrbox');box.innerHTML='';
  if(!window.QRCode){await loadScript('https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js');}
  new QRCode(box,{text:url,width:172,height:172,colorDark:'#28346b',colorLight:'#ffffff'});
}
