<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>버거 타이쿤 — 나만의 햄버거 가게</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#fff7ea; --paper:#fffdf8; --ink:#3a2417;
  --red:#e84545; --red-d:#c5352f;
  --mustard:#f6a823; --mustard-d:#e08c0a;
  --green:#46b06a; --bun:#e9a64d; --bun-d:#cf8a32;
  --line:#ecd9bf; --shadow:rgba(120,70,20,.18);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:'Jua',sans-serif;color:var(--ink);
  background:
    radial-gradient(circle at 12% 8%, #ffe9c4 0, transparent 40%),
    radial-gradient(circle at 88% 92%, #ffd9d2 0, transparent 42%),
    var(--cream);
  min-height:100%;overflow-x:hidden;
}
.num{font-family:'Fredoka',sans-serif;font-weight:700;}
button{font-family:'Jua',sans-serif;cursor:pointer;border:none;}
.hidden{display:none !important;}

/* ---------------- Login ---------------- */
#login{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(ellipse at 50% 30%, #ffedcf, #ffe0b3 70%, #f7c98c);}
.login-card{background:var(--paper);border-radius:30px;padding:38px 30px 30px;max-width:430px;width:100%;
  box-shadow:0 18px 50px var(--shadow);text-align:center;border:3px solid #fff;}
.logo{font-size:64px;line-height:1;filter:drop-shadow(0 4px 0 rgba(0,0,0,.08));}
.login-card h1{font-size:38px;color:var(--red);margin-top:6px;letter-spacing:-1px;}
.login-card .tag{color:var(--mustard-d);font-size:17px;margin-top:2px;}
.field{text-align:left;margin-top:18px;}
.field label{font-size:15px;color:#8a6b4d;margin-left:6px;}
.field input{width:100%;margin-top:5px;padding:13px 16px;border-radius:14px;border:2px solid var(--line);
  background:#fffdf8;font-family:'Jua';font-size:18px;color:var(--ink);outline:none;}
.field input:focus{border-color:var(--mustard);}
.big-btn{width:100%;margin-top:22px;padding:15px;border-radius:16px;background:var(--red);color:#fff;
  font-size:22px;box-shadow:0 5px 0 var(--red-d);transition:transform .08s,box-shadow .08s;}
.big-btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--red-d);}
.saved-list{margin-top:22px;text-align:left;}
.saved-list .ttl{font-size:14px;color:#9a7c5d;margin:0 0 8px 4px;}
.saved-item{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff5e6;
  border:2px solid var(--line);border-radius:13px;padding:9px 12px;margin-bottom:8px;}
.saved-item .info{font-size:15px;}
.saved-item .info small{color:#a98a68;font-size:12px;}
.saved-item .load{background:var(--mustard);color:#fff;padding:6px 14px;border-radius:10px;font-size:14px;box-shadow:0 3px 0 var(--mustard-d);}
.saved-item .del{background:#f1e2cc;color:#b06a4a;padding:6px 10px;border-radius:10px;font-size:13px;}
.credit{margin-top:20px;font-size:13px;color:#b89a78;}
.warn-store{margin-top:12px;font-size:13px;color:var(--red);}

/* ---------------- Topbar ---------------- */
#app{max-width:1080px;margin:0 auto;padding:12px 14px 40px;}
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--red);color:#fff;
  border-radius:20px;padding:12px 16px;box-shadow:0 6px 0 var(--red-d);}
.topbar .shop-name{font-size:24px;display:flex;align-items:center;gap:8px;}
.topbar .spacer{flex:1;}
.stat-chip{background:rgba(255,255,255,.16);border-radius:13px;padding:7px 13px;display:flex;flex-direction:column;line-height:1.05;}
.stat-chip .k{font-size:11px;opacity:.85;}
.stat-chip .v{font-size:19px;}
.money-chip .v{color:#ffe98a;}
.icon-btn{background:rgba(255,255,255,.16);border-radius:12px;width:42px;height:42px;font-size:20px;color:#fff;}

.who{font-size:13px;color:#9a7c5d;text-align:right;margin:6px 4px 0;}

/* ---------------- Layout ---------------- */
.grid{display:grid;grid-template-columns:1fr 1.15fr;gap:14px;margin-top:14px;}
@media(max-width:860px){.grid{grid-template-columns:1fr;}}
.panel{background:var(--paper);border-radius:22px;padding:16px;box-shadow:0 8px 24px var(--shadow);border:2px solid #fff;}
.panel h2{font-size:20px;color:var(--red);margin-bottom:10px;display:flex;align-items:center;gap:7px;}
.panel h2 small{font-size:13px;color:#a98a68;font-family:'Fredoka';font-weight:600;}

/* Orders */
#orders{display:flex;flex-direction:column;gap:10px;min-height:120px;}
.order{background:#fff5e6;border:2px solid var(--line);border-radius:16px;padding:10px 12px;display:flex;gap:12px;align-items:center;
  transition:transform .15s,opacity .2s;}
.order.active{border-color:var(--mustard);box-shadow:0 0 0 3px #ffe6b0;}
.order.serve{transform:scale(1.04);opacity:0;background:#d6f5dd;}
.order .cust{font-size:30px;}
.order .recipe{flex:1;font-size:14px;line-height:1.4;color:#6b4d33;}
.order .recipe b{color:var(--ink);}
.order .pat-wrap{width:100%;height:8px;background:#eaddc6;border-radius:6px;overflow:hidden;margin-top:6px;}
.order .pat{height:100%;background:var(--green);border-radius:6px;transition:width .1s linear,background .2s;}
.order .reward{font-family:'Fredoka';font-weight:700;color:var(--green);font-size:14px;white-space:nowrap;}
.empty-q{color:#bba684;text-align:center;padding:24px 0;font-size:15px;}

/* Build */
.build-stage{background:linear-gradient(#fffaf0,#fbeccd);border:2px dashed var(--bun-d);border-radius:18px;
  min-height:190px;display:flex;flex-direction:column-reverse;align-items:center;justify-content:flex-start;
  padding:14px 10px;gap:3px;position:relative;}
.build-stage .ph{position:absolute;top:50%;left:0;right:0;transform:translateY(-50%);color:#c9b290;font-size:15px;text-align:center;}
.layer{border-radius:7px;box-shadow:0 2px 3px rgba(120,70,20,.18);position:relative;display:flex;align-items:center;justify-content:center;
  font-size:13px;color:rgba(0,0,0,.45);font-family:'Fredoka';font-weight:600;animation:drop .18s ease;}
@keyframes drop{from{transform:translateY(-14px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.layer.bottomBun{border-radius:7px 7px 12px 12px;}
.layer.topBun{border-radius:60% 60% 14px 14px / 80% 80% 14px 14px;
  background-image:radial-gradient(#fff7 1.6px,transparent 2px),radial-gradient(#fff7 1.6px,transparent 2px);
  background-size:14px 14px;background-position:4px 4px,11px 9px;}
.layer.cheese{clip-path:polygon(0 0,100% 0,100% 62%,88% 100%,72% 66%,56% 100%,40% 66%,24% 100%,12% 66%,0 80%);}
.layer.lettuce{border-radius:14px;}

.tools{display:flex;gap:8px;margin-top:10px;}
.tool{flex:1;padding:11px;border-radius:13px;font-size:16px;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.18);transition:transform .07s,box-shadow .07s;}
.tool:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18);}
.tool.serve{flex:1.6;background:var(--green);box-shadow:0 4px 0 #2f8a51;}
.tool.undo{background:#c8a06f;box-shadow:0 4px 0 #a07c4c;}
.tool.clear{background:#d98a72;box-shadow:0 4px 0 #b56b54;}
.tool:disabled{filter:grayscale(.5);opacity:.6;}

.palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:8px;margin-top:12px;}
.ing{background:#fff5e6;border:2px solid var(--line);border-radius:14px;padding:9px 6px 7px;text-align:center;
  transition:transform .07s;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;}
.ing .key{position:absolute;top:4px;right:4px;min-width:18px;height:18px;padding:0 4px;border-radius:6px;
  background:var(--ink);color:#fff;font-family:'Fredoka';font-weight:700;font-size:11px;
  display:flex;align-items:center;justify-content:center;opacity:.82;}
.ing:active{transform:scale(.93);}
.ing .em{font-size:24px;}
.ing .nm{font-size:13px;}
.ing .pr{font-size:11px;color:#a98a68;font-family:'Fredoka';font-weight:600;}

/* Shop */
.tabs{display:flex;gap:6px;margin-bottom:12px;}
.tab{flex:1;padding:9px;border-radius:12px;background:#f3e6d0;color:#8a6b4d;font-size:15px;}
.tab.on{background:var(--mustard);color:#fff;box-shadow:0 3px 0 var(--mustard-d);}
.shop-item{display:flex;align-items:center;gap:11px;background:#fff5e6;border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:9px;}
.shop-item .si-em{font-size:28px;}
.shop-item .si-body{flex:1;}
.shop-item .si-title{font-size:16px;}
.shop-item .si-title .lv{font-family:'Fredoka';font-weight:700;color:var(--mustard-d);font-size:13px;margin-left:5px;}
.shop-item .si-desc{font-size:12px;color:#8a6b4d;margin-top:1px;line-height:1.35;}
.buy{background:var(--green);color:#fff;border-radius:11px;padding:9px 13px;font-size:14px;white-space:nowrap;
  box-shadow:0 3px 0 #2f8a51;transition:transform .07s,box-shadow .07s;}
.buy:active{transform:translateY(2px);box-shadow:0 1px 0 #2f8a51;}
.buy:disabled{background:#cdb79c;box-shadow:0 3px 0 #b39e83;cursor:not-allowed;}
.buy .cprice{font-family:'Fredoka';font-weight:700;display:block;font-size:13px;}
.maxed{color:var(--mustard-d);font-size:14px;white-space:nowrap;}

/* toast */
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;}
.toast{background:var(--ink);color:#fff;padding:9px 16px;border-radius:20px;font-size:15px;box-shadow:0 6px 16px rgba(0,0,0,.25);
  animation:tIn .25s ease, tOut .35s ease 1.1s forwards;}
.toast.good{background:var(--green);} .toast.bad{background:var(--red);} .toast.gold{background:var(--mustard-d);}
@keyframes tIn{from{transform:translateY(-16px);opacity:0;}}
@keyframes tOut{to{transform:translateY(-12px);opacity:0;}}

.foot{text-align:center;color:#b89a78;font-size:13px;margin-top:22px;}

/* settings modal */
#settings{position:fixed;inset:0;z-index:55;background:rgba(40,20,5,.5);display:flex;align-items:center;justify-content:center;padding:20px;}
.set-card{background:var(--paper);border-radius:24px;padding:24px;max-width:340px;width:100%;text-align:center;box-shadow:0 18px 40px var(--shadow);}
.set-card h3{font-size:24px;color:var(--red);margin-bottom:6px;}
.set-card p{font-size:14px;color:#8a6b4d;margin-bottom:16px;}
.set-btn{width:100%;padding:13px;border-radius:14px;font-size:17px;margin-top:9px;color:#fff;}
.set-btn.save{background:var(--green);box-shadow:0 4px 0 #2f8a51;}
.set-btn.logout{background:var(--mustard);box-shadow:0 4px 0 var(--mustard-d);}
.set-btn.reset{background:var(--red);box-shadow:0 4px 0 var(--red-d);}
.set-btn.close{background:#cbb79b;box-shadow:0 4px 0 #ab9678;}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login">
  <div class="login-card">
    <div class="logo">🍔</div>
    <h1>버거 타이쿤</h1>
    <div class="tag">나만의 햄버거 제국을 키워라!</div>
    <div class="field">
      <label>🏫 학교 이름</label>
      <input id="inSchool" maxlength="20" placeholder="예) 해누리중학교" autocomplete="off">
    </div>
    <div class="field">
      <label>🙂 닉네임</label>
      <input id="inNick" maxlength="14" placeholder="예) 버거왕" autocomplete="off">
    </div>
    <button class="big-btn" id="startBtn">게임 시작 / 불러오기</button>
    <div class="saved-list hidden" id="savedList"></div>
    <div class="warn-store hidden" id="storeWarn">⚠ 이 환경에서는 저장 기능이 제한될 수 있어요.</div>
    <div class="credit">제작 · 과학이조선생</div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="hidden">
  <div class="topbar">
    <div class="shop-name">🍔 <span id="shopName">버거하우스</span></div>
    <div class="spacer"></div>
    <div class="stat-chip money-chip"><span class="k">보유 자금</span><span class="v num" id="money">0원</span></div>
    <div class="stat-chip"><span class="k">누적 판매</span><span class="v num" id="served">0</span></div>
    <div class="stat-chip"><span class="k">자동 수입</span><span class="v num" id="passive">0/초</span></div>
    <button class="icon-btn" id="muteBtn">🔊</button>
    <button class="icon-btn" id="setBtn">⚙</button>
  </div>
  <div class="who" id="whoLabel"></div>

  <div class="grid">
    <!-- LEFT: orders + shop -->
    <div>
      <div class="panel">
        <h2>📋 주문 대기 <small id="qInfo"></small></h2>
        <div id="orders"></div>
      </div>

      <div class="panel" style="margin-top:14px;">
        <h2>🏪 가게 키우기</h2>
        <div class="tabs">
          <button class="tab on" data-tab="upgrade">🔧 업그레이드</button>
          <button class="tab" data-tab="menu">🍳 메뉴개발</button>
          <button class="tab" data-tab="branch">🏬 지점</button>
        </div>
        <div id="shopBody"></div>
      </div>
    </div>

    <!-- RIGHT: build -->
    <div class="panel">
      <h2>👨‍🍳 조리대 <small id="buildHint"></small></h2>
      <div class="build-stage" id="stage">
        <div class="ph" id="stagePh">아래 재료를 눌러 주문대로 쌓으세요!</div>
      </div>
      <div class="tools">
        <button class="tool undo" id="undoBtn">↩ 되돌리기</button>
        <button class="tool clear" id="clearBtn">🗑 비우기</button>
        <button class="tool serve" id="serveBtn">✅ 완성! 판매</button>
      </div>
      <div class="palette" id="palette"></div>
    </div>
  </div>

  <div class="foot">제작 · 과학이조선생 — 버거 타이쿤 🍔</div>
</div>

<!-- settings -->
<div id="settings" class="hidden">
  <div class="set-card">
    <h3>⚙ 설정</h3>
    <p id="setWho"></p>
    <button class="set-btn save" id="sSave">💾 지금 저장</button>
    <button class="set-btn logout" id="sLogout">🚪 로그아웃 (계정 변경)</button>
    <button class="set-btn reset" id="sReset">🔄 이 계정 초기화</button>
    <button class="set-btn close" id="sClose">닫기</button>
  </div>
</div>

<div id="toast"></div>

<script>
'use strict';
/* ============================================================
   버거 타이쿤  ·  제작 과학이조선생
   단일 HTML · localStorage 저장
   ============================================================ */

/* ---------- 저장소 헬퍼 ---------- */
var STORE_OK = true;
try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); }catch(e){ STORE_OK=false; }
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
var REG_KEY='bt_profiles';
function saveKey(school,nick){ return 'bt_save::'+encodeURIComponent(school)+'::'+encodeURIComponent(nick); }
function getRegistry(){ try{ return JSON.parse(lsGet(REG_KEY)||'[]'); }catch(e){ return []; } }
function setRegistry(r){ lsSet(REG_KEY, JSON.stringify(r)); }

/* ---------- 사운드 (WebAudio 합성) ---------- */
var SND={ ctx:null, master:null, muted:false };
try{ SND.muted = lsGet('bt_muted')==='1'; }catch(e){}
function ensureAudio(){
  if(SND.ctx){ if(SND.ctx.state==='suspended'){ try{SND.ctx.resume();}catch(e){} } return; }
  try{
    SND.ctx=new (window.AudioContext||window.webkitAudioContext)();
    SND.master=SND.ctx.createGain();
    SND.master.gain.value=SND.muted?0:0.5;
    SND.master.connect(SND.ctx.destination);
  }catch(e){ SND.ctx=null; }
}
function tone(freq,start,dur,type,vol){
  if(!SND.ctx||SND.muted) return;
  var t0=SND.ctx.currentTime+(start||0);
  var o=SND.ctx.createOscillator(), g=SND.ctx.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(freq,t0);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(vol||0.3,t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g); g.connect(SND.master);
  o.start(t0); o.stop(t0+dur+0.03);
}
var SFX={
  place:function(n){ tone(230+(n||0)*20, 0, 0.10, 'triangle', 0.22); },
  sell:function(){ tone(523,0,0.12,'triangle',0.28); tone(659,0.10,0.12,'triangle',0.28);
                   tone(784,0.20,0.16,'triangle',0.30); tone(1047,0.30,0.22,'sine',0.24); },
  error:function(){ tone(190,0,0.15,'square',0.20); tone(120,0.12,0.18,'square',0.18); },
  leave:function(){ tone(392,0,0.16,'sine',0.20); tone(262,0.15,0.24,'sine',0.18); },
  buy:function(){ tone(988,0,0.07,'square',0.20); tone(1319,0.07,0.12,'square',0.20); },
  unlock:function(){ tone(659,0,0.10,'triangle',0.26); tone(880,0.10,0.10,'triangle',0.26); tone(1175,0.20,0.20,'triangle',0.28); },
  branch:function(){ [523,659,784,1047,1319].forEach(function(f,i){ tone(f,i*0.09,0.24,'triangle',0.26); }); },
  bell:function(){ tone(1319,0,0.11,'sine',0.10); tone(988,0.09,0.16,'sine',0.10); },
  auto:function(){ tone(740,0,0.10,'sine',0.14); }
};
function setMuted(m){
  SND.muted=m;
  if(SND.master) SND.master.gain.value=m?0:0.5;
  lsSet('bt_muted', m?'1':'0');
  var b=document.getElementById('muteBtn'); if(b) b.textContent=m?'🔇':'🔊';
}

/* ---------- 재료 정의 ---------- */
var ING = {
  bottomBun:{name:'아래빵', em:'🍞', color:'#e9b873', price:500,  h:16, w:150},
  patty:    {name:'패티',   em:'🥩', color:'#7b4a2b', price:2200, h:20, w:152},
  cheese:   {name:'치즈',   em:'🧀', color:'#f4c430', price:1300, h:16, w:158},
  lettuce:  {name:'양상추', em:'🥬', color:'#74c24a', price:800,  h:14, w:162},
  tomato:   {name:'토마토', em:'🍅', color:'#e44b4b', price:1000, h:11, w:150},
  onion:    {name:'양파',   em:'🧅', color:'#e0b6e6', price:700,  h:9,  w:146},
  bacon:    {name:'베이컨', em:'🥓', color:'#c25a3c', price:2000, h:10, w:154},
  egg:      {name:'계란',   em:'🍳', color:'#fde9a8', price:1700, h:13, w:150},
  sauce:    {name:'소스',   em:'🥫', color:'#f0902a', price:500,  h:7,  w:144},
  topBun:   {name:'윗빵',   em:'🍔', color:'#e8a44b', price:600,  h:26, w:150}
};
var BASE_UNLOCK=['bottomBun','patty','cheese','lettuce','topBun'];
var PALETTE_ORDER=['bottomBun','patty','cheese','egg','bacon','tomato','lettuce','onion','sauce','topBun'];

/* 메뉴개발(잠금 해제) */
var MENU_ITEMS=[
  {id:'tomato', em:'🍅', name:'토마토', cost:8000,  desc:'주문에 토마토 등장. 판매가 상승!'},
  {id:'onion',  em:'🧅', name:'양파',   cost:15000, desc:'아삭한 양파 추가.'},
  {id:'sauce',  em:'🥫', name:'특제 소스', cost:30000, desc:'풍미 업! 소스 메뉴 해금.'},
  {id:'bacon',  em:'🥓', name:'베이컨', cost:80000, desc:'고급 재료. 큰 매출!'},
  {id:'egg',    em:'🍳', name:'계란후라이', cost:150000, desc:'프리미엄 메뉴 해금.'}
];

/* 업그레이드 */
var UPGRADES=[
  {id:'price', em:'💰', name:'가격 인상', base:5000,  growth:1.7, desc:function(l){return '버거 판매가 +'+(l*12)+'%';}},
  {id:'speed', em:'⏱', name:'신속 조리', base:4000,  growth:1.6, desc:function(l){return '손님 인내심 +'+(l*3)+'초';}},
  {id:'marketing', em:'📣', name:'홍보 마케팅', base:6000, growth:1.65, desc:function(l){return '손님 더 빨리 도착 · 대기열 +'+l;}},
  {id:'auto', em:'🤖', name:'자동 직원', base:20000, growth:1.9, desc:function(l){return l>0?('직원이 '+autoInterval(l).toFixed(1)+'초마다 자동 판매'):'직원이 자동으로 버거를 만들어요';}}
];
function autoInterval(l){ return Math.max(2.2, 7 - l*0.7); }

/* 지점 */
var BRANCHES=[
  {em:'🏙', name:'강남 지점',  cost:60000,    income:400},
  {em:'🎨', name:'홍대 지점',  cost:250000,   income:1600},
  {em:'🌊', name:'부산 지점',  cost:1000000,  income:6500},
  {em:'🍊', name:'제주 지점',  cost:4000000,  income:25000},
  {em:'🗽', name:'뉴욕 지점',  cost:18000000, income:110000},
  {em:'🗼', name:'도쿄 지점',  cost:80000000, income:480000}
];

/* ---------- 상태 ---------- */
var S=null;            // 게임 상태
var build=[];          // 현재 조립중 재료 배열
var orders=[];         // 주문 큐
var orderSeq=1;
var activeId=-1;
var spawnTimer=2;
var autoTimer=0;
var saveTimer=0;
var lastT=performance.now();
var $=function(id){return document.getElementById(id);};

function newState(school,nick){
  return {
    school:school, nick:nick,
    shopName:(nick||'나')+'의 버거하우스',
    money:0, served:0, lost:0,
    upgrades:{price:0,speed:0,marketing:0,auto:0},
    unlocked:BASE_UNLOCK.slice(),
    branches:[],   // {idx, level}
    updated:Date.now()
  };
}

/* ---------- 저장/불러오기 ---------- */
function saveGame(){
  if(!S) return;
  S.updated=Date.now();
  lsSet(saveKey(S.school,S.nick), JSON.stringify(S));
  var reg=getRegistry();
  var k=saveKey(S.school,S.nick);
  var found=false;
  for(var i=0;i<reg.length;i++){ if(reg[i].key===k){ reg[i].money=S.money; reg[i].served=S.served; reg[i].updated=S.updated; found=true; break; } }
  if(!found) reg.push({key:k, school:S.school, nick:S.nick, money:S.money, served:S.served, updated:S.updated});
  setRegistry(reg);
}
function loadGame(school,nick){
  var raw=lsGet(saveKey(school,nick));
  if(raw){ try{ var s=JSON.parse(raw); s.school=school; s.nick=nick; if(!s.unlocked) s.unlocked=BASE_UNLOCK.slice(); if(!s.branches) s.branches=[]; return s; }catch(e){} }
  return null;
}

/* ---------- 로그인 화면 ---------- */
function renderSaved(){
  var reg=getRegistry().sort(function(a,b){return b.updated-a.updated;});
  var box=$('savedList');
  if(!reg.length){ box.classList.add('hidden'); box.innerHTML=''; return; }
  box.classList.remove('hidden');
  var html='<div class="ttl">이 기기에 저장된 게임</div>';
  reg.forEach(function(p){
    html+='<div class="saved-item">'+
      '<div class="info">'+esc(p.nick)+' <small>('+esc(p.school)+')</small><br><small>자금 '+won(p.money||0)+'원 · 판매 '+(p.served||0)+'개</small></div>'+
      '<div style="display:flex;gap:6px;">'+
      '<button class="load" data-k="'+p.key+'" data-s="'+esc(p.school)+'" data-n="'+esc(p.nick)+'">불러오기</button>'+
      '<button class="del" data-k="'+p.key+'">✕</button></div></div>';
  });
  box.innerHTML=html;
  box.querySelectorAll('.load').forEach(function(b){
    b.onclick=function(){ enterGame(b.getAttribute('data-s'), b.getAttribute('data-n')); };
  });
  box.querySelectorAll('.del').forEach(function(b){
    b.onclick=function(){
      var k=b.getAttribute('data-k');
      lsDel(k);
      setRegistry(getRegistry().filter(function(p){return p.key!==k;}));
      renderSaved();
    };
  });
}
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

$('startBtn').onclick=function(){
  var school=$('inSchool').value.trim();
  var nick=$('inNick').value.trim();
  if(!school||!nick){ toast('학교 이름과 닉네임을 입력하세요!','bad'); return; }
  enterGame(school,nick);
};

function enterGame(school,nick){
  ensureAudio();
  setMuted(SND.muted);
  S=loadGame(school,nick) || newState(school,nick);
  $('login').classList.add('hidden');
  $('app').classList.remove('hidden');
  $('whoLabel').textContent='🏫 '+S.school+'  ·  🙂 '+S.nick;
  $('shopName').textContent=S.shopName;
  build=[]; orders=[]; orderSeq=1; activeId=-1; spawnTimer=1; autoTimer=0;
  // 시작 주문 2개
  addOrder(true); addOrder(true);
  renderPalette(); renderShop(); renderOrders(); renderBuild(); updateTop();
  saveGame();
}

/* ---------- 숫자 포맷 ---------- */
function won(n){
  n=Math.floor(n);
  if(n>=100000000){ return trim(n/100000000)+'억'; }
  if(n>=10000){ return trim(n/10000)+'만'; }
  return n.toLocaleString('ko-KR');
}
function trim(x){ var r=Math.round(x*10)/10; return (r%1===0? r.toFixed(0): r.toFixed(1)); }

/* ---------- 토스트 ---------- */
function toast(msg,type){
  var t=document.createElement('div');
  t.className='toast '+(type||'');
  t.textContent=msg;
  $('toast').appendChild(t);
  setTimeout(function(){ t.remove(); },1600);
}

/* ---------- 주문 생성 ---------- */
function middlePool(){ return S.unlocked.filter(function(k){return k!=='bottomBun'&&k!=='topBun';}); }
function addOrder(silent){
  var pool=middlePool();
  var maxLen=Math.min(5, 2+Math.floor(S.served/12));
  var len=1+Math.floor(Math.random()*maxLen);
  var mid=[];
  for(var i=0;i<len;i++){ mid.push(pool[Math.floor(Math.random()*pool.length)]); }
  var recipe=['bottomBun'].concat(mid,['topBun']);
  var pat=16 + S.upgrades.speed*3;
  var base=0; recipe.forEach(function(k){ base+=ING[k].price; });
  var o={ id:orderSeq++, recipe:recipe, pat:pat, patMax:pat, base:base,
          cust:CUSTS[Math.floor(Math.random()*CUSTS.length)] };
  orders.push(o);
  if(!silent) SFX.bell();
}
var CUSTS=['🧑','👩','👴','👧','🧓','👨‍🦰','👩‍🦱','🧔','👱‍♀️','🤵','👮','👷','🧑‍🎓','👩‍🏫'];

function rewardFor(o,withTip){
  var mult=1+S.upgrades.price*0.12;
  var r=o.base*mult;
  if(withTip){ var f=Math.max(0,o.pat/o.patMax); r*=(1+f*0.6); }
  return Math.floor(r);
}

/* ---------- 렌더: 주문 ---------- */
function renderOrders(){
  var box=$('orders');
  if(!orders.length){ box.innerHTML='<div class="empty-q">손님을 기다리는 중… 🍟</div>'; activeId=-1; return; }
  if(orders[0].id!==activeId){ activeId=orders[0].id; build=[]; renderBuild(); }
  var html='';
  orders.forEach(function(o,idx){
    var names=o.recipe.map(function(k){return ING[k].name;});
    html+='<div class="order'+(idx===0?' active':'')+'" data-id="'+o.id+'">'+
      '<div class="cust">'+o.cust+'</div>'+
      '<div class="recipe">'+(idx===0?'<b>지금 만들 주문 ▾</b><br>':'')+
        names.map(function(n,i){return (i===0?'':'＋ ')+'<b>'+n+'</b>';}).join(' ')+
        '<div class="pat-wrap"><div class="pat" id="pat'+o.id+'"></div></div>'+
      '</div>'+
      '<div class="reward">+'+won(rewardFor(o,true))+'원</div>'+
    '</div>';
  });
  box.innerHTML=html;
  updatePatBars();
}
function updatePatBars(){
  orders.forEach(function(o){
    var el=$('pat'+o.id); if(!el) return;
    var f=Math.max(0,o.pat/o.patMax);
    el.style.width=(f*100)+'%';
    el.style.background = f>0.5?'#46b06a':(f>0.25?'#f6a823':'#e84545');
  });
}

/* ---------- 렌더: 조립대 ---------- */
function renderBuild(){
  var stage=$('stage');
  stage.querySelectorAll('.layer').forEach(function(n){n.remove();});
  var ph=$('stagePh');
  ph.style.display = build.length? 'none':'block';
  // column-reverse 라서 순서대로 append하면 아래부터 쌓임
  build.forEach(function(k){
    var ing=ING[k];
    var d=document.createElement('div');
    d.className='layer '+k;
    d.style.background=ing.color;
    d.style.width=ing.w+'px';
    d.style.height=ing.h+'px';
    d.style.maxWidth='86%';
    d.textContent = (k==='bottomBun'||k==='topBun')?'':ing.name;
    stage.appendChild(d);
  });
  var has=orders.length>0;
  $('serveBtn').disabled=!has || build.length===0;
  $('undoBtn').disabled=build.length===0;
  $('clearBtn').disabled=build.length===0;
  $('buildHint').textContent = has? '주문 #'+orders[0].id+' 제작 중' : '';
}

/* ---------- 렌더: 재료 팔레트 (+ 키보드 단축키) ---------- */
var KEYS=['q','w','e','r','t','a','s','d','f','g'];
var keyToIng={};
function addIngredient(k){
  if(!orders.length){ toast('아직 주문이 없어요!','bad'); return; }
  build.push(k); renderBuild();
  SFX.place(build.length);
  var btn=document.querySelector('.ing[data-k="'+k+'"]');
  if(btn){ btn.style.transform='scale(.9)'; setTimeout(function(){ btn.style.transform=''; },90); }
}
function renderPalette(){
  var box=$('palette');
  var html=''; keyToIng={}; var vi=0;
  PALETTE_ORDER.forEach(function(k){
    if(S.unlocked.indexOf(k)<0) return;
    var ing=ING[k];
    var key=KEYS[vi]; if(key) keyToIng[key]=k; vi++;
    html+='<button class="ing" data-k="'+k+'">'+
          (key?'<span class="key">'+key.toUpperCase()+'</span>':'')+
          '<span class="em">'+ing.em+'</span>'+
          '<span class="nm">'+ing.name+'</span><span class="pr">'+ing.price.toLocaleString()+'원</span></button>';
  });
  box.innerHTML=html;
  box.querySelectorAll('.ing').forEach(function(b){
    b.onclick=function(){ addIngredient(b.getAttribute('data-k')); };
  });
}

/* ---------- 판매 ---------- */
function arraysEqual(a,b){ if(a.length!==b.length) return false; for(var i=0;i<a.length;i++) if(a[i]!==b[i]) return false; return true; }
$('serveBtn').onclick=function(){
  if(!orders.length) return;
  var o=orders[0];
  if(arraysEqual(build,o.recipe)){
    var rw=rewardFor(o,true);
    S.money+=rw; S.served++;
    SFX.sell();
    toast('🍔 판매 성공!  +'+won(rw)+'원','good');
    // 애니메이션 후 제거
    var el=document.querySelector('.order[data-id="'+o.id+'"]');
    if(el) el.classList.add('serve');
    orders.shift(); build=[];
    setTimeout(function(){ renderOrders(); },120);
    renderBuild(); updateTop(); renderShop(); saveGame();
  }else{
    o.pat=Math.max(2,o.pat-4);
    SFX.error();
    toast('❌ 주문과 달라요! 다시 확인하세요','bad');
    var stage=$('stage'); stage.animate?stage.animate([{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(0)'}],{duration:220}):0;
  }
};
$('undoBtn').onclick=function(){ build.pop(); renderBuild(); };
$('clearBtn').onclick=function(){ build=[]; renderBuild(); };

/* ---------- 자동 직원 판매 ---------- */
function autoServe(){
  if(!orders.length) return;
  var o=orders.shift();
  var rw=rewardFor(o,false);
  S.money+=rw; S.served++;
  SFX.auto();
  toast('🤖 직원 자동 판매 +'+won(rw)+'원','gold');
  build=[]; renderOrders(); renderBuild(); updateTop(); renderShop();
}

/* ---------- 패시브 수입 ---------- */
function passivePerSec(){
  var sum=0;
  S.branches.forEach(function(b){ sum+=BRANCHES[b.idx].income*b.level; });
  return sum;
}

/* ---------- 상단바 ---------- */
function updateTop(){
  $('money').textContent=won(S.money)+'원';
  $('served').textContent=S.served;
  $('passive').textContent=won(passivePerSec())+'/초';
  var maxQ=3+S.upgrades.marketing;
  $('qInfo').textContent='('+orders.length+'/'+maxQ+' 손님)';
}

/* ---------- 상점 탭 ---------- */
var curTab='upgrade';
document.querySelectorAll('.tab').forEach(function(t){
  t.onclick=function(){
    document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on');});
    t.classList.add('on'); curTab=t.getAttribute('data-tab'); renderShop();
  };
});
function upgradeCost(u){ return Math.floor(u.base*Math.pow(u.growth, S.upgrades[u.id])); }
function renderShop(){
  var body=$('shopBody'); var html='';
  if(curTab==='upgrade'){
    UPGRADES.forEach(function(u){
      var lv=S.upgrades[u.id]; var cost=upgradeCost(u);
      var can=S.money>=cost;
      html+=shopRow(u.em, u.name+' <span class="lv">Lv.'+lv+'</span>', u.desc(lv),
        '<button class="buy" data-up="'+u.id+'" '+(can?'':'disabled')+'>업그레이드<span class="cprice">'+won(cost)+'원</span></button>');
    });
  }else if(curTab==='menu'){
    MENU_ITEMS.forEach(function(m){
      var owned=S.unlocked.indexOf(m.id)>=0;
      var can=S.money>=m.cost;
      var btn = owned? '<span class="maxed">✔ 보유</span>'
        : '<button class="buy" data-menu="'+m.id+'" '+(can?'':'disabled')+'>해금<span class="cprice">'+won(m.cost)+'원</span></button>';
      html+=shopRow(m.em, m.name, m.desc, btn);
    });
  }else{
    // 지점
    S.branches.forEach(function(b){
      var t=BRANCHES[b.idx];
      var upCost=Math.floor(t.cost*0.6*b.level);
      var can=S.money>=upCost;
      html+=shopRow(t.em, t.name+' <span class="lv">Lv.'+b.level+'</span>',
        '자동 수입 '+won(t.income*b.level)+'원/초',
        '<button class="buy" data-branchup="'+b.idx+'" '+(can?'':'disabled')+'>증축<span class="cprice">'+won(upCost)+'원</span></button>');
    });
    // 새 지점 오픈
    var nextIdx=S.branches.length;
    if(nextIdx<BRANCHES.length){
      var t=BRANCHES[nextIdx]; var can=S.money>=t.cost;
      html+=shopRow(t.em, '<b>'+t.name+' 오픈</b>', '신규 매장! 자동 수입 '+won(t.income)+'원/초 시작',
        '<button class="buy" data-newbranch="'+nextIdx+'" '+(can?'':'disabled')+'>오픈<span class="cprice">'+won(t.cost)+'원</span></button>');
    }else if(S.branches.length){
      html+='<div class="empty-q">모든 지점을 오픈했어요! 🎉</div>';
    }
    if(!S.branches.length && nextIdx<BRANCHES.length){
      // 안내문구 (이미 위에서 첫 지점 카드 표시됨)
    }
  }
  body.innerHTML=html;
  bindShop();
}
function shopRow(em,title,desc,btn){
  return '<div class="shop-item"><div class="si-em">'+em+'</div>'+
    '<div class="si-body"><div class="si-title">'+title+'</div><div class="si-desc">'+desc+'</div></div>'+btn+'</div>';
}
function bindShop(){
  var body=$('shopBody');
  body.querySelectorAll('[data-up]').forEach(function(b){ b.onclick=function(){ buyUpgrade(b.getAttribute('data-up')); }; });
  body.querySelectorAll('[data-menu]').forEach(function(b){ b.onclick=function(){ buyMenu(b.getAttribute('data-menu')); }; });
  body.querySelectorAll('[data-newbranch]').forEach(function(b){ b.onclick=function(){ buyBranch(+b.getAttribute('data-newbranch')); }; });
  body.querySelectorAll('[data-branchup]').forEach(function(b){ b.onclick=function(){ upBranch(+b.getAttribute('data-branchup')); }; });
}
function buyUpgrade(id){
  var u=null; UPGRADES.forEach(function(x){if(x.id===id)u=x;});
  var cost=upgradeCost(u);
  if(S.money<cost){ toast('자금이 부족해요!','bad'); return; }
  S.money-=cost; S.upgrades[id]++;
  SFX.buy();
  toast('🔧 '+u.name+' Lv.'+S.upgrades[id]+'!','good');
  updateTop(); renderShop(); saveGame();
}
function buyMenu(id){
  var m=null; MENU_ITEMS.forEach(function(x){if(x.id===id)m=x;});
  if(S.money<m.cost){ toast('자금이 부족해요!','bad'); return; }
  S.money-=m.cost; S.unlocked.push(id);
  SFX.unlock();
  toast('🍳 신메뉴 해금: '+m.name+'!','good');
  renderPalette(); updateTop(); renderShop(); saveGame();
}
function buyBranch(idx){
  var t=BRANCHES[idx];
  if(S.money<t.cost){ toast('자금이 부족해요!','bad'); return; }
  S.money-=t.cost; S.branches.push({idx:idx, level:1});
  SFX.branch();
  toast('🏬 '+t.name+' 오픈! 자동 수입 시작 🎉','gold');
  updateTop(); renderShop(); saveGame();
}
function upBranch(idx){
  var b=null; S.branches.forEach(function(x){if(x.idx===idx)b=x;});
  var t=BRANCHES[idx]; var upCost=Math.floor(t.cost*0.6*b.level);
  if(S.money<upCost){ toast('자금이 부족해요!','bad'); return; }
  S.money-=upCost; b.level++;
  SFX.buy();
  toast('🏬 '+t.name+' Lv.'+b.level+'!','good');
  updateTop(); renderShop(); saveGame();
}

/* ---------- 설정 ---------- */
$('muteBtn').onclick=function(){ ensureAudio(); setMuted(!SND.muted); };
$('setBtn').onclick=function(){ $('setWho').textContent=S.school+' · '+S.nick; $('settings').classList.remove('hidden'); };
$('sClose').onclick=function(){ $('settings').classList.add('hidden'); };
$('sSave').onclick=function(){ saveGame(); toast('💾 저장 완료!','good'); $('settings').classList.add('hidden'); };

  saveGame(); $('settings').classList.add('hidden'); $('app').classList.add('hidden');
  $('login').classList.remove('hidden'); S=null; renderSaved();
};
$('sReset').onclick=function(){
  if(!confirm('정말 이 계정의 진행상황을 초기화할까요?')) return;
  S=newState(S.school,S.nick); saveGame();
  build=[]; orders=[]; orderSeq=1; activeId=-1; addOrder(true); addOrder(true);
  renderPalette(); renderShop(); renderOrders(); renderBuild(); updateTop();
  $('settings').classList.add('hidden'); toast('🔄 초기화 완료','good');
};

/* ---------- 메인 루프 ---------- */
function loop(now){
  requestAnimationFrame(loop);
  if(!S) return;
  var dt=(now-lastT)/1000; lastT=now;
  if(dt>0.1) dt=0.1;

  // 패시브 수입
  var ps=passivePerSec();
  if(ps>0){ S.money+=ps*dt; }

  // 손님 인내심
  var maxQ=3+S.upgrades.marketing;
  var changed=false;
  for(var i=orders.length-1;i>=0;i--){
    orders[i].pat-=dt;
    if(orders[i].pat<=0){
      if(i===0){ build=[]; }
      orders.splice(i,1); S.lost++; changed=true;
      SFX.leave();
      toast('😡 손님이 떠났어요…','bad');
    }
  }

  // 손님 도착
  spawnTimer-=dt;
  var interval=Math.max(2.2, 6 - S.upgrades.marketing*0.5);
  if(spawnTimer<=0){
    if(orders.length<maxQ){ addOrder(); changed=true; }
    spawnTimer=interval;
  }

  // 자동 직원
  if(S.upgrades.auto>0){
    autoTimer-=dt;
    if(autoTimer<=0){ if(orders.length){ autoServe(); } autoTimer=autoInterval(S.upgrades.auto); }
  }

  if(changed){ renderOrders(); renderBuild(); }
  updatePatBars();

  // 상단 자금/패시브 표시(가볍게)
  $('money').textContent=won(S.money)+'원';
  if(ps>0 && Math.floor(now/700)%2===0){} // noop, 표시는 updateTop에서

  // 주기적 자동 저장
  saveTimer+=dt;
  if(saveTimer>5){ saveTimer=0; saveGame(); }
}
requestAnimationFrame(loop);

/* ---------- 키보드 조작 ---------- */
document.addEventListener('keydown', function(e){
  if($('app').classList.contains('hidden')) return;
  if(!$('settings').classList.contains('hidden')) return;
  var tag=(e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea') return;
  var k=(e.key||'').toLowerCase();
  if(keyToIng[k]){ e.preventDefault(); addIngredient(keyToIng[k]); return; }
  if(e.key==='Enter'){ e.preventDefault(); $('serveBtn').click(); return; }
  if(e.key==='Backspace'){ e.preventDefault(); if(build.length){ build.pop(); renderBuild(); } return; }
});
$('inNick').addEventListener('keydown', function(e){ if(e.key==='Enter') $('startBtn').click(); });
$('inSchool').addEventListener('keydown', function(e){ if(e.key==='Enter') $('inNick').focus(); });

// 자금 변동시 패시브 칩도 최신화
setInterval(function(){ if(S){ $('passive').textContent=won(passivePerSec())+'/초'; var mq=3+S.upgrades.marketing; $('qInfo').textContent='('+orders.length+'/'+mq+' 손님)'; } },800);

/* ---------- 초기 ---------- */
if(!STORE_OK){ $('storeWarn').classList.remove('hidden'); }
renderSaved();
$('inSchool').focus();
window.addEventListener('beforeunload', function(){ saveGame(); });
</script>
