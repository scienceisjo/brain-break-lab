    --citizen:#2ce8d6; --liar:#ff357f;
    --f-disp:'Black Han Sans',sans-serif;
    --f-body:'Pretendard','Pretendard Variable',system-ui,sans-serif;
    --f-pixel:'Galmuri11',monospace;
    --f-jua:'Jua',sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{color-scheme:dark}
  html,body{margin:0;padding:0;min-height:100%}
  button,input,textarea,select{font-family:inherit; color:var(--text)}
  body{
    background:
      radial-gradient(120% 80% at 50% -10%, #1b1140 0%, rgba(27,17,64,0) 55%),
      radial-gradient(100% 70% at 110% 10%, rgba(255,53,127,.10) 0%, rgba(255,53,127,0) 50%),
      radial-gradient(100% 70% at -10% 20%, rgba(44,232,214,.10) 0%, rgba(44,232,214,0) 50%),
      var(--bg);
    color:var(--text); font-family:var(--f-body); overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  /* 배경: 픽셀아트 우주 정거장이 기본 내장(아래 :root --bg-image 에 data URI로 인라인)되어 있습니다.
     다른 이미지로 바꾸려면 --bg-image 를 url('파일명.png') 로 교체하세요(HTML 파일과 같은 폴더에 두면 됨).
     배경 사진을 끄려면 --bg-image:none; 으로 바꾸면 됩니다(그러면 별 애니메이션이 자동으로 켜집니다).
     글자 가독성은 아래 #bgphoto::after 어두운 오버레이가 보장합니다. 더 어둡게 하려면 농도를 올리세요. */
  #bgphoto{position:fixed; inset:0; z-index:-2; background-image:var(--bg-image); background-size:cover; background-position:center; background-repeat:no-repeat; image-rendering:crisp-edges; image-rendering:-moz-crisp-edges; image-rendering:pixelated}
  #bgphoto::before{content:""; position:absolute; inset:0; background:repeating-linear-gradient(0deg, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.10) 2px 3px); pointer-events:none}
  #bgphoto::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(7,6,18,.56) 0%, rgba(7,6,18,.70) 55%, rgba(7,6,18,.84) 100%)}
  #stars{position:fixed; inset:0; width:100%; height:100%; z-index:-1; display:block}
  .wrap{max-width:560px; margin:0 auto; padding:22px 18px 40px; min-height:100vh; display:flex; flex-direction:column}

  /* ---------- top bar ---------- */
  .bar{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px}
  .brand{display:flex; align-items:center; gap:9px}
  .dot{width:10px; height:10px; border-radius:50%; background:var(--cyan); box-shadow:0 0 12px var(--cyan); animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .brand b{font-family:var(--f-pixel); font-size:12px; letter-spacing:1px; color:var(--muted); font-weight:400}
  .sound-btn{border:1px solid var(--line); background:rgba(255,255,255,.04); color:var(--muted); width:40px; height:34px; border-radius:10px; font-size:15px; cursor:pointer; transition:.15s}
  .sound-btn:active{transform:scale(.94)}

  .screen{flex:1; display:flex; flex-direction:column; animation:rise .42s cubic-bezier(.16,1,.3,1)}
  @keyframes rise{from{opacity:0; transform:translateY(16px)}to{opacity:1; transform:translateY(0)}}

  /* ---------- typography ---------- */
  .eyebrow{font-family:var(--f-pixel); font-size:11px; letter-spacing:2px; color:var(--cyan); text-transform:uppercase; opacity:.9}
  h1.title{font-family:var(--f-disp); font-size:clamp(46px,15vw,72px); line-height:.92; margin:6px 0 4px; letter-spacing:-1px; color:#dffcff}
  @supports ((-webkit-background-clip:text) or (background-clip:text)){
    h1.title{background:linear-gradient(120deg,#fff 0%, var(--cyan) 48%, var(--purple) 100%); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:transparent; text-shadow:0 0 38px rgba(44,232,214,.25)}
  }
  .tag{font-family:var(--f-jua); color:var(--muted); font-size:16px; margin:2px 0 0}
  .sect-h{font-family:var(--f-disp); font-size:26px; margin:2px 0 4px}
  .lead{color:var(--muted); font-size:14px; line-height:1.55}

  /* ---------- buttons ---------- */
  .btn{display:flex; align-items:center; justify-content:center; gap:8px; width:100%; border:none; border-radius:16px;
    padding:17px 18px; font-family:var(--f-disp); font-size:20px; letter-spacing:.5px; cursor:pointer; color:#06121a;
    transition:transform .12s, box-shadow .2s, filter .2s; text-align:center}
  .btn:active{transform:translateY(2px) scale(.99)}
  .btn-primary{background:linear-gradient(120deg,var(--cyan),#5ad7ff); box-shadow:0 8px 30px rgba(44,232,214,.32), inset 0 1px 0 rgba(255,255,255,.45)}
  .btn-primary:active{box-shadow:0 4px 14px rgba(44,232,214,.3)}
  .btn-danger{background:linear-gradient(120deg,var(--magenta),#ff6aa0); color:#fff; box-shadow:0 8px 30px rgba(255,53,127,.32)}
  .btn-gold{background:linear-gradient(120deg,var(--gold),#ffe48a); box-shadow:0 8px 30px rgba(255,210,63,.3)}
  .btn-ghost{background:rgba(255,255,255,.05); border:1px solid var(--line); color:var(--text); font-family:var(--f-jua); font-size:16px; letter-spacing:0; box-shadow:none}
  .btn-ghost:active{background:rgba(255,255,255,.09)}
  .btn-sm{padding:12px 14px; font-size:16px; border-radius:13px}
  .stack{display:flex; flex-direction:column; gap:11px}
  .row{display:flex; gap:11px}
  .row>*{flex:1}
  .spacer{flex:1}

  /* ---------- cards / panels ---------- */
  .panel{background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:18px; backdrop-filter:blur(8px); margin:10px 0}
  .hint-strip{display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-family:var(--f-pixel); font-size:12px; color:var(--muted); line-height:1.8}
  .chip-num{display:inline-flex; align-items:center; justify-content:center; min-width:26px; height:26px; padding:0 7px; border-radius:8px; background:rgba(124,92,255,.18); border:1px solid var(--line); color:var(--cyan); font-family:var(--f-pixel); font-size:13px}
  .chip-num.nm{font-family:var(--f-jua); font-size:12px; color:#dffcff}

  /* ---------- stepper ---------- */
  .stepper{display:flex; align-items:center; justify-content:space-between; gap:14px}
  .stepper .lbl{font-family:var(--f-jua); font-size:16px}
  .stepper .lbl span{display:block; font-size:11px; color:var(--muted); font-family:var(--f-body); margin-top:1px}
  .step-ctrl{display:flex; align-items:center; gap:12px}
  .step-btn{width:42px; height:42px; border-radius:12px; border:1px solid var(--line); background:rgba(255,255,255,.05); color:var(--text); font-size:24px; font-family:var(--f-disp); cursor:pointer; line-height:1; display:flex; align-items:center; justify-content:center}
  .step-btn:active{transform:scale(.9); background:rgba(44,232,214,.14)}
  .step-btn[disabled]{opacity:.3; pointer-events:none}
  .step-val{font-family:var(--f-pixel); font-size:24px; min-width:34px; text-align:center; color:var(--cyan)}
  .name-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:8px}
  .name-row{display:flex; align-items:center; gap:7px}
  .name-no{flex:none; width:24px; height:24px; border-radius:7px; background:rgba(124,92,255,.18); border:1px solid var(--line); color:var(--cyan); font-family:var(--f-pixel); font-size:12px; display:flex; align-items:center; justify-content:center}
  .pname-inp{padding:9px 10px; font-size:14px}

  /* ---------- topic chips ---------- */
  .grid-chips{display:grid; grid-template-columns:repeat(2,1fr); gap:9px; margin-top:6px}
  .topic-chip{display:flex; align-items:center; gap:9px; padding:13px; border-radius:13px; border:1px solid var(--line); background:rgba(255,255,255,.035); cursor:pointer; transition:.15s; text-align:left; color:var(--text)}
  .topic-chip .ico{font-size:20px; line-height:1}
  .topic-chip .nm{font-family:var(--f-jua); font-size:15px; color:var(--text)}
  .topic-chip .ct{font-size:10px; color:var(--muted); font-family:var(--f-pixel)}
  .topic-chip:active{transform:scale(.97)}
  .topic-chip.on{border-color:var(--cyan); background:linear-gradient(120deg,rgba(44,232,214,.16),rgba(123,92,255,.12)); box-shadow:0 0 0 1px var(--cyan) inset, 0 6px 20px rgba(44,232,214,.18)}
  .topic-chip.on .nm{color:var(--cyan)}
  .mode-seg{display:grid; gap:8px}
  .mode-opt{display:block; text-align:left; padding:12px 14px; border-radius:13px; border:1px solid var(--line); background:rgba(255,255,255,.035); cursor:pointer; color:var(--text); transition:.15s; width:100%}
  .mode-opt:active{transform:scale(.99)}
  .mode-opt.on{border-color:var(--cyan); background:linear-gradient(120deg,rgba(44,232,214,.14),rgba(123,92,255,.10)); box-shadow:0 0 0 1px var(--cyan) inset}
  .mode-opt .mo-t{display:block; font-family:var(--f-jua); font-size:15px}
  .mode-opt.on .mo-t{color:var(--cyan)}
  .mode-opt .mo-d{display:block; font-size:12px; color:var(--muted); margin-top:2px; line-height:1.4}
  .grp-label{font-family:var(--f-pixel); font-size:11px; letter-spacing:1.5px; color:var(--purple); margin:14px 0 2px; text-transform:uppercase}

  /* ---------- toggles ---------- */
  .opt-row{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:11px 0; border-top:1px solid rgba(124,92,255,.16)}
  .opt-row:first-child{border-top:none}
  .opt-row .nm{font-family:var(--f-jua); font-size:15px}
  .opt-row .nm small{display:block; color:var(--muted); font-size:11px; font-family:var(--f-body)}
  .seg{display:flex; gap:5px; flex-wrap:wrap}
  .seg button{border:1px solid var(--line); background:rgba(255,255,255,.04); color:var(--muted); padding:7px 11px; border-radius:9px; font-family:var(--f-pixel); font-size:12px; cursor:pointer}
  .seg button.on{background:var(--cyan); color:#06121a; border-color:var(--cyan)}
  .toggle{width:54px; height:30px; border-radius:30px; border:1px solid var(--line); background:rgba(255,255,255,.06); position:relative; cursor:pointer; transition:.2s; flex:none}
  .toggle::after{content:""; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:var(--muted); transition:.2s}
  .toggle.on{background:rgba(44,232,214,.25); border-color:var(--cyan)}
  .toggle.on::after{left:27px; background:var(--cyan); box-shadow:0 0 10px var(--cyan)}

  /* ---------- handoff / reveal ---------- */
  .center{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:14px}
  .agent-badge{font-family:var(--f-pixel); font-size:13px; letter-spacing:2px; color:var(--cyan); border:1px solid var(--line); padding:6px 14px; border-radius:30px; background:rgba(44,232,214,.08)}
  .big-num{font-family:var(--f-disp); font-size:clamp(80px,28vw,140px); line-height:.9; color:#eafffb}
  .big-name{font-family:var(--f-disp); font-size:clamp(40px,13vw,76px); line-height:1; color:#eafffb; word-break:keep-all; max-width:92%; text-align:center}
  @supports ((-webkit-background-clip:text) or (background-clip:text)){

  var actx=null;
  function ac(){ if(actx) return actx; try{ var C=window.AudioContext||window.webkitAudioContext; actx=C?new C():null; }catch(e){ actx=null; } return actx; }
  function tone(freq,dur,type,vol,when){
    if(!S.sound) return; var c=ac(); if(!c) return;
    try{
      var t=c.currentTime+(when||0);
      var o=c.createOscillator(), g=c.createGain();
      o.type=type||"sine"; o.frequency.setValueAtTime(freq,t);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(vol||0.15,t+0.012);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+0.02);
    }catch(e){}
  }

  function starfield(){
    var cv=document.getElementById("stars"); if(!cv) return;
    try{ var bgv=getComputedStyle(document.documentElement).getPropertyValue("--bg-image"); if(bgv && bgv.indexOf("url(")>=0){ cv.style.display="none"; return; } }catch(e){}
    var ctx=null; try{ ctx=cv.getContext("2d"); }catch(e){}
    if(!ctx) return;
    var stars=[], warp=[], W,H,DPR=Math.min(window.devicePixelRatio||1,2);
    function size(){ W=cv.width=innerWidth*DPR; H=cv.height=innerHeight*DPR; cv.style.width=innerWidth+"px"; cv.style.height=innerHeight+"px"; build(); }
    function build(){ stars=[]; var n=Math.round((innerWidth*innerHeight)/9000); for(var i=0;i<n;i++){ stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4*DPR+.3,a:Math.random(),s:Math.random()*.02+.004,t:Math.random()<.15}); } }
    function loop(){
      ctx.clearRect(0,0,W,H);
      for(var i=0;i<stars.length;i++){ var st=stars[i]; st.a+=st.s; var al=.4+Math.sin(st.a)*.4;
        ctx.beginPath(); ctx.fillStyle= st.t? "rgba(44,232,214,"+al+")":"rgba(255,255,255,"+al+")"; ctx.arc(st.x,st.y,st.r,0,6.283); ctx.fill(); }
      requestAnimationFrame(loop);
    }
    try{ size(); window.addEventListener("resize",size); requestAnimationFrame(loop); }catch(e){}
  }

  function assignRoles(players, liars){
    var idx=[]; for(var i=0;i<players;i++) idx.push(i);
    for(var j=idx.length-1;j>0;j--){ var k=Math.floor(Math.random()*(j+1)); var tmp=idx[j]; idx[j]=idx[k]; idx[k]=tmp; }
    var roles=[]; for(var p=0;p<players;p++) roles.push("citizen");
    for(var l=0;l<liars && l<players;l++) roles[idx[l]]="liar";
    return roles;
  }
  function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var k=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[k]; a[k]=t; } return a; }
  function pickKeyword(words){ return words[Math.floor(Math.random()*words.length)]; }

  function tally(votes, players){
    var counts=[]; for(var i=0;i<players;i++) counts.push(0);
    for(var v=0;v<votes.length;v++){ if(votes[v]!=null && votes[v]>=0 && votes[v]<players) counts[votes[v]]++; }
    var max=-1, tops=[];
    for(var c=0;c<players;c++){ if(counts[c]>max){ max=counts[c]; tops=[c]; } else if(counts[c]===max){ tops.push(c); } }
    return { counts:counts, max:max, tops:tops, tie:(tops.length>1), out:(tops.length===1?tops[0]:null) };
  }
  // winner: 'citizen' | 'liar'
  function decideWinner(roles, out, liarChanceOn, liarGuessCorrect){

    if(!caught) return "liar";              // 엉뚱한 사람 지목 or 동점 → 라이어 승
    if(liarChanceOn && liarGuessCorrect) return "liar"; // 걸렸어도 제시어 맞히면 라이어 승
    return "citizen";
  }

    },

    rules:function(){

          '<p style="margin:0 0 10px"><span class="chip-num">2</span> 정해진 순서대로 제시어를 <b>한 단어</b>로 설명합니다. 시민은 너무 쉽게 말하면 라이어에게 들키고, 너무 어렵게 말하면 의심받아요.</p>'+
          '<p style="margin:0 0 10px"><span class="chip-num">3</span> 라이어는 정체를 들키지 않게 아는 척 둘러댑니다.</p>'+
          '<p style="margin:0 0 10px"><span class="chip-num">4</span> 토론 후 <b>라이어로 의심되는 사람</b>에게 투표합니다.</p>'+
          '<p style="margin:0"><span class="chip-num">5</span> 라이어를 찾으면 <b style="color:var(--cyan)">시민 승리</b>! 단, 걸린 라이어가 제시어를 맞히면 <b style="color:var(--magenta)">라이어 역전승</b>이에요.</p>'+
          '<p style="margin:10px 0 0; padding-top:10px; border-top:1px solid rgba(124,92,255,.16)"><b style="color:var(--gold)">🤡 바보 라이어</b> — 설정에서 고를 수 있어요. 라이어는 <b>자기가 라이어인 줄 모른 채</b> 시민과 <b>다른 제시어</b>를 받아요. 자기 제시어를 진짜로 알고 설명하다 보면 미묘하게 어긋나죠!</p>'+
        '</div></div>'+
        '<div class="grp-label">예능으로 보기</div>'+
        '<div class="video-wrap"><iframe src="https://www.youtube-nocookie.com/embed/BN0TV5pCw9o" title="라이어 게임 예능 영상" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>'+
        '<p class="lead" style="margin-top:6px">실제로 라이어 게임을 어떻게 진행하는지 영상으로 확인해 보세요.</p>'+
        '<div class="spacer" style="min-height:14px"></div>'+
        '<button class="btn btn-primary" data-action="rules-back">알겠어요</button>'+
      '</div>';
    },

    setup:function(){
      var topics = allTopics();
      var chips = function(list){
        return list.map(function(t){
          return '<button class="topic-chip '+(S.topicId===t.id?'on':'')+'" data-action="pick-topic" data-topic="'+t.id+'">'+
            '<span class="ico">'+t.ico+'</span><span><span class="nm">'+esc(t.name)+'</span><br><span class="ct">'+t.words.length+'개</span></span></button>';
        }).join("");
      };
      var customList = topics.filter(function(t){ return t.custom; });
      var maxLiars = Math.max(1, Math.min(3, S.players-2));
      if(S.liars>maxLiars) S.liars=maxLiars;
      var segMin=[0,1,2,3,5].map(function(m){ return '<button class="'+(S.discussMin===m?'on':'')+'" data-action="set-min" data-min="'+m+'">'+(m===0?'없음':m+'분')+'</button>'; }).join("");
      var nameInputs=""; for(var ni=0; ni<S.players; ni++){ nameInputs+='<div class="name-row"><span class="name-no">'+(ni+1)+'</span><input class="inp pname-inp" data-idx="'+ni+'" maxlength="10" value="'+esc(S.names[ni]||"")+'" placeholder="'+(ni+1)+'번 (이름)"></div>'; }

      return '<div class="screen">'+
        '<div class="eyebrow">SQUAD SETUP</div>'+
        '<h2 class="sect-h">게임 설정</h2>'+
        '<div class="panel">'+
          '<div class="stepper">'+
            '<div class="lbl">요원 수<span>게임할 인원</span></div>'+
            '<div class="step-ctrl">'+
              '<button class="step-btn" data-action="pl-dec" '+(S.players<=3?'disabled':'')+'>–</button>'+
              '<div class="step-val">'+S.players+'</div>'+
              '<button class="step-btn" data-action="pl-inc" '+(S.players>=10?'disabled':'')+'>+</button>'+
            '</div>'+
          '</div>'+
          '<div class="opt-row" style="border-top:1px solid rgba(124,92,255,.16); margin-top:8px; padding-top:14px">'+
            '<div class="nm">라이어 수<small>보통 1명, 6명 이상이면 2명도 추천</small></div>'+
            '<div class="step-ctrl">'+
              '<button class="step-btn" data-action="liar-dec" '+(S.liars<=1?'disabled':'')+'>–</button>'+
              '<div class="step-val" style="color:var(--magenta)">'+S.liars+'</div>'+

            '</div>'+
          '</div>'+
        '</div>'+

        '<div class="panel">'+
          '<div class="ci-ct" style="font-family:var(--f-pixel); font-size:11px; color:var(--purple); margin-bottom:8px">게임 방식</div>'+
          '<div class="mode-seg">'+
            '<button class="mode-opt '+(S.mode!=="fool"?'on':'')+'" data-action="set-mode" data-mode="classic"><span class="mo-t">기본 라이어</span><span class="mo-d">라이어는 제시어를 모르고, 자기가 라이어인 건 알아요</span></button>'+
            '<button class="mode-opt '+(S.mode==="fool"?'on':'')+'" data-action="set-mode" data-mode="fool"><span class="mo-t">바보 라이어</span><span class="mo-d">라이어만 다른 제시어를 받고, 자기가 라이어인 줄 몰라요</span></button>'+
          '</div>'+
        '</div>'+

        '<button class="btn btn-ghost btn-sm" data-action="toggle-names" style="margin-top:12px">'+(S.useNames?'\u25b2 참가자 이름 접기':'\u25bc 참가자 이름 입력 (선택)')+'</button>'+
        (S.useNames? '<div class="panel"><div class="name-grid">'+nameInputs+'</div><button class="btn btn-ghost btn-sm" data-action="clear-names" style="margin-top:9px">이름 전체 지우기</button><p class="lead" style="margin-top:7px">비워 둔 자리는 자동으로 \u20181번, 2번\u2026\u2019으로 표시돼요.</p></div>' : '')+

        '<div class="grp-label">일반 주제</div>'+
        '<div class="grid-chips">'+chips(BANK_GENERAL)+'</div>'+
        '<div class="grp-label">과학 · 수업 연계</div>'+
        '<div class="grid-chips">'+chips(BANK_SCIENCE)+'</div>'+
        (customList.length? '<div class="grp-label">직접 만든 주제</div><div class="grid-chips">'+chips(customList)+'</div>' : '')+
        '<div class="grid-chips" style="grid-template-columns:1fr; margin-top:9px">'+
          '<button class="topic-chip '+(S.topicId==="__random"?'on':'')+'" data-action="pick-topic" data-topic="__random"><span class="ico">🎲</span><span><span class="nm">랜덤 (전체에서)</span><br><span class="ct">매 판 다른 주제</span></span></button>'+
        '</div>'+

        '<button class="btn btn-ghost btn-sm" data-action="toggle-adv" style="margin-top:14px">'+(S.showAdv?'▲ 세부 설정 닫기':'▼ 세부 설정 (토론 시간 · 라이어 찬스)')+'</button>'+
        (S.showAdv? '<div class="panel">'+
            '<div class="opt-row"><div class="nm">토론 시간<small>설명·토론용 타이머</small></div><div class="seg">'+segMin+'</div></div>'+
            '<div class="opt-row"><div class="nm">라이어 찬스<small>걸렸을 때 제시어 맞히기 1회</small></div><div class="toggle '+(S.liarChance?'on':'')+'" data-action="toggle-chance"></div></div>'+
          '</div>' : '')+

        '<div class="spacer" style="min-height:14px"></div>'+
        '<div class="row">'+
          '<button class="btn btn-ghost" data-action="to-home" style="flex:.5">홈</button>'+
          '<button class="btn btn-primary" data-action="begin" style="flex:1.5">시작하기</button>'+
        '</div>'+
      '</div>';
    },

    custom:function(){
      var list=loadCustom();
      var toast = S.toast? '<div class="toast">'+esc(S.toast)+'</div>' : '';
      var totalWords=0; list.forEach(function(c){ totalWords+=c.words.length; });
      var items = list.length? list.map(function(c,i){
        return '<div class="custom-item"><div><div class="ci-nm">✏️ '+esc(c.name)+'</div><div class="ci-ct">제시어 '+c.words.length+'개</div></div><button class="del-btn" data-action="custom-del" data-idx="'+i+'">삭제</button></div>';
      }).join("") : '<div class="empty">아직 추가한 제시어가 없어요.<br>옆 \u2018추가 · 업로드\u2019 탭에서 붙여넣기·파일·양식으로<br>한 번에 올릴 수 있어요.</div>';

      var listTab = '<div class="panel">'+items+'</div>'+
        (list.length? '<button class="btn btn-ghost btn-sm" data-action="export-csv">내 제시어 CSV로 내보내기 ('+totalWords+'개)</button>' : '');

      var u=S.upload, addTab;
      if(u.preview){
        addTab=previewPanel();
      } else {
        var rep=(u.mode==="replace");
        addTab='<div class="panel upload-methods">'+
            '<button class="btn btn-primary btn-sm" data-action="tpl-download">① 양식(CSV) 다운로드</button>'+
            '<p class="lead" style="margin:-2px 0 0">양식을 엑셀에서 채운 뒤 CSV 또는 XLSX로 저장해 올리세요. 칸은 <b>카테고리, 제시어</b> 두 개예요.</p>'+
            '<div class="dropzone" id="dropZone" data-action="file-pick"><div class="dz-ico">📂</div><div class="dz-t">② 파일 올리기</div><div class="dz-s">CSV · XLSX · 드래그앤드롭</div></div>'+
            '<input type="file" id="fileInput" accept=".csv,.xlsx,.xls,.txt" style="display:none">'+
            '<div class="or-divider">또는 직접 붙여넣기</div>'+
            '<textarea class="ta" id="pasteArea" placeholder="한 줄에 하나씩 — 카테고리, 제시어&#10;예)&#10;음식, 김치찌개&#10;동물, 사자&#10;직업, 소방관"></textarea>'+
            '<div class="upload-mode">'+
              '<button class="'+(!rep?'on':'')+'" data-action="upload-mode" data-mode="merge">내 제시어에 추가</button>'+
              '<button class="'+(rep?'on rep':'')+'" data-action="upload-mode" data-mode="replace">내 제시어 전체 교체</button>'+
            '</div>'+
            '<button class="btn btn-primary btn-sm" data-action="paste-preview">③ 미리보기</button>'+
            (u.error? '<div class="err-box">'+esc(u.error)+'</div>' : '')+
          '</div>'+
          '<p class="lead">올린 제시어는 기존 \u2018내 제시어\u2019와 같은 곳에 저장되고, 새 카테고리는 자동으로 선택 칩에 추가돼요.</p>';
      }

      return '<div class="screen">'+
        '<div class="eyebrow">CUSTOM SIGNALS</div>'+
        '<h2 class="sect-h">제시어 관리</h2>'+
        toast+
        '<div class="pill-tabs">'+
          '<button class="'+(S.customTab==="list"?'on':'')+'" data-action="custom-tab" data-tab="list">내 제시어</button>'+
          '<button class="'+(S.customTab==="add"?'on':'')+'" data-action="custom-tab" data-tab="add">추가 · 업로드</button>'+
        '</div>'+
        (S.customTab==="list"? listTab : addTab)+
        '<div class="spacer" style="min-height:12px"></div>'+
        '<button class="btn btn-ghost" data-action="to-home">홈으로</button>'+
      '</div>';
    },

    reveal:function(){
      var n=S.revealIdx+1, total=S.players;
      if(!S.revealShown){
        return '<div class="screen center">'+
          '<div class="agent-badge">'+n+' / '+total+'</div>'+
          '<div class="big-name">'+esc(pname(S.revealIdx))+'</div>'+
          '<div class="pass-msg">기기를 받으세요</div>'+
          '<div class="pass-sub">다른 사람이 화면을 보지 못하게 가린 뒤, 아래 버튼을 눌러 자기 역할만 확인하세요.</div>'+
          '<div class="stack" style="width:100%; max-width:320px; margin-top:18px">'+
            '<button class="btn btn-primary" data-action="reveal-show">내 역할 확인</button>'+
          '</div>'+
          '<div class="warn">⚠ 옆 사람에게 보여주지 마세요</div>'+
        '</div>';
      }
      var role=S.roles[S.revealIdx];
      var foolLiar = (role==="liar" && S.mode==="fool" && !!S.fakeKeyword);
      var citizenCard=function(word){ return '<div class="role-card citizen"><div class="rc-role">CITIZEN · 시민</div><div class="rc-topic">주제: '+esc(S.topicName)+'</div><div class="rc-word">'+esc(word)+'</div><div class="rc-note">이게 우리의 제시어예요.<br>라이어가 눈치채지 못하게 설명하세요.</div></div>'; };
      var card;
      if(role==="liar" && !foolLiar){
        card='<div class="role-card liar"><div class="rc-emoji">🤫</div><div class="rc-role">YOU ARE THE LIAR</div><div class="rc-word" style="color:#ffe1ec">당신은 라이어</div><div class="rc-topic" style="margin-top:12px">주제: <b style="color:#fff">'+esc(S.topicName)+'</b></div><div class="rc-note">제시어는 비밀이에요. 주제만 보고<br>아는 척 설명하며 정체를 숨기세요!</div></div>';
      } else {
        // 시민 + 바보 라이어 (시민 카드와 똑같이 보임, 가짜 제시어만 다름)
        card=citizenCard(foolLiar ? S.fakeKeyword : S.keyword);
      }
      var showLiarStyle = (role==="liar" && !foolLiar);
      var lastBtn = (S.revealIdx>=total-1)? '토론 시작하기' : '확인 완료 · 다음 사람에게';
      return '<div class="screen center">'+
        card+
        '<div class="stack" style="width:100%; max-width:320px; margin-top:8px">'+
          '<button class="btn '+(showLiarStyle?'btn-danger':'btn-primary')+'" data-action="reveal-hide">'+lastBtn+'</button>'+
        '</div>'+
      '</div>';
    },

    discuss:function(){
      var order=S.hintOrder.map(function(i){ return '<span class="chip-num'+(S.useNames?' nm':'')+'">'+esc(pname(i))+'</span>'; }).join('<span style="color:var(--muted)">→</span>');
      var mm=Math.floor(S.timerLeft/60), ss=S.timerLeft%60;
      var tstr=(mm<10?'0':'')+mm+':'+(ss<10?'0':'')+ss;
      var timerBlock = S.discussMin>0 ? (
        '<div class="panel center" style="margin:6px 0">'+
          '<div class="timer '+(S.timerLeft<=10&&S.timerOn?'low':'')+'" id="tdisp">'+tstr+'</div>'+
          '<div class="row" style="max-width:280px; margin-top:6px">'+
            (S.timerOn? '<button class="btn btn-ghost btn-sm" data-action="timer-pause">일시정지</button>'
                      : '<button class="btn btn-primary btn-sm" data-action="timer-start">'+(S.timerLeft<S.discussMin*60?'계속':'타이머 시작')+'</button>')+
            '<button class="btn btn-ghost btn-sm" data-action="timer-reset">초기화</button>'+
          '</div>'+
        '</div>' ) : '';
      return '<div class="screen">'+
        '<div class="eyebrow">DISCUSSION</div>'+
        '<h2 class="sect-h">토론 & 설명</h2>'+
        '<div class="panel">'+
          '<div class="ci-ct" style="font-family:var(--f-pixel); font-size:11px; letter-spacing:1px; color:var(--purple); margin-bottom:8px">설명 순서</div>'+
          '<div class="hint-strip">'+order+'</div>'+
          '<p class="lead" style="margin-top:10px">이 순서대로 제시어를 <b style="color:var(--cyan)">한 단어</b>씩 설명하세요. 한 바퀴 돈 뒤 자유롭게 토론!</p>'+
        '</div>'+
        timerBlock+
        '<div class="spacer" style="min-height:10px"></div>'+
        '<div class="stack">'+
          '<button class="btn btn-danger" data-action="to-vote">투표하기</button>'+
          '<button class="btn btn-ghost btn-sm" data-action="skip-result">손들기로 정했어요 · 정답만 공개</button>'+
        '</div>'+
      '</div>';
    },

    vote:function(){
      var n=S.voteIdx+1;
      var cells="";
      for(var i=0;i<S.players;i++){
        if(i===S.voteIdx) continue; // 자기 자신 제외
        cells+='<button class="pbtn" data-action="cast-vote" data-target="'+i+'">'+esc(pname(i))+'</button>';
      }
      return '<div class="screen">'+
        '<div class="eyebrow">VOTE · '+n+' / '+S.players+'</div>'+
        '<h2 class="sect-h">'+esc(pname(S.voteIdx))+' 투표</h2>'+
        '<p class="lead">라이어로 의심되는 사람을 누르세요. 다른 사람이 보지 못하게 하세요.</p>'+
        '<div class="pgrid'+(S.useNames?' named':'')+'">'+cells+'</div>'+
        '<div class="footer-note">투표 후 자동으로 다음 사람에게 넘어갑니다</div>'+
      '</div>';
    },

    result:function(){
      var r=S.result; var t=r.tallyData;
      var maxc=Math.max(1, t.max);
      var rows="";
      for(var i=0;i<S.players;i++){
        var isTop = (t.tops.indexOf(i)>=0 && t.max>0);
        var w=Math.round((t.counts[i]/maxc)*100);
        rows+='<div class="tally-row '+(isTop?'top':'')+'"><div class="tally-name">'+esc(pname(i))+'</div><div class="tally-bar"><div class="tally-fill" style="width:'+w+'%"></div></div><div class="tally-ct">'+t.counts[i]+'표</div></div>';
      }

      // 라이어 목록 (이름 또는 번호)
      var liarNames=[]; for(var L=0;L<S.roles.length;L++){ if(S.roles[L]==="liar") liarNames.push(pname(L)); }
      var liarStr=liarNames.join(", ");

      var head='<div class="eyebrow">RESULT</div><h2 class="sect-h">결과 발표</h2>';
      var tallyPanel = r.skipped? '' : '<div class="panel"><div class="ci-ct" style="font-family:var(--f-pixel); font-size:11px; color:var(--purple); margin-bottom:6px">득표 현황</div><div class="tally'+(S.useNames?' named':'')+'">'+rows+'</div></div>';

      // stage: 'guess' → 라이어 제시어 맞히기, else 'final'
      if(r.stage==="guess"){
        var opts=r.guessOptions.map(function(w){ return '<button class="btn btn-ghost btn-sm" data-action="liar-guess" data-word="'+esc(w)+'" style="text-align:center">'+esc(w)+'</button>'; }).join("");
        return '<div class="screen">'+head+
          tallyPanel+
          '<div class="panel center" style="border-color:var(--magenta)">'+
            '<div class="rc-role" style="color:var(--magenta)">LIAR CAUGHT!</div>'+
            '<p class="reveal-line">지목된 <b>'+esc(pname(r.out))+'</b>은(는) 진짜 <b class="liar-tag">라이어</b>였어요!<br>마지막 기회 — 제시어를 맞히면 <b class="liar-tag">역전승</b>!</p>'+
            '<div class="stack" style="width:100%; max-width:320px; margin-top:12px">'+opts+'</div>'+
          '</div>'+
        '</div>';
      }

      // final
      var v=r.winner; // 'citizen'|'liar'|'reveal'(skipped)
      var verdictClass, whoText;
      if(r.skipped){ verdictClass=""; whoText="정답 공개"; }
      else if(v==="citizen"){ verdictClass="win-citizen"; whoText="시민 승리!"; }
      else { verdictClass="win-liar"; whoText="라이어 승리!"; }
      var subText;
      if(r.skipped){
        subText = "라이어는 "+liarStr+", 제시어는 \u00ab"+S.keyword+"\u00bb 였어요.";
      } else if(t.tie && r.out===null){
        subText = "동점이라 아무도 지목하지 못했어요. 라이어의 승리!";
      } else if(v==="citizen"){
        subText = "라이어 "+liarStr+"을(를) 잡아냈어요! 제시어는 \u00ab"+S.keyword+"\u00bb.";
      } else if(r.caught && r.liarGuessCorrect){
        subText = "라이어가 제시어 \u00ab"+S.keyword+"\u00bb 를 맞혀 역전했어요!";
      } else {
        subText = "라이어 "+liarStr+"이(가) 끝까지 살아남았어요. 제시어는 \u00ab"+S.keyword+"\u00bb.";
      }

      var revealLine = r.skipped
        ? '<p class="reveal-line">라이어: <b class="liar-tag">'+esc(liarStr)+'</b><br>제시어: <b class="word-tag">'+esc(S.keyword)+'</b></p>'
        : '<p class="reveal-line">지목: <b>'+(r.out!=null?esc(pname(r.out)):'없음(동점)')+'</b> · 라이어: <b class="liar-tag">'+esc(liarStr)+'</b></p>';

      return '<div class="screen">'+head+
        tallyPanel+
        '<div class="panel verdict '+verdictClass+'">'+
          '<div class="who">'+whoText+'</div>'+
          '<div class="sub">'+esc(subText)+'</div>'+
          '<div style="margin-top:12px">'+revealLine+'</div>'+
          (S.mode==="fool" && S.fakeKeyword ? '<p class="reveal-line" style="margin-top:8px; color:var(--muted); font-size:13px">🤡 바보 라이어 — 라이어는 \u00ab'+esc(S.fakeKeyword)+'\u00bb 로 알고 있었어요 (진짜: \u00ab'+esc(S.keyword)+'\u00bb)</p>' : '')+
        '</div>'+
        '<div class="spacer" style="min-height:8px"></div>'+
        '<div class="stack">'+
          '<button class="btn btn-primary" data-action="play-again">다시 하기 (같은 설정)</button>'+
          '<div class="row">'+
            '<button class="btn btn-ghost btn-sm" data-action="to-setup">설정 바꾸기</button>'+
            '<button class="btn btn-ghost btn-sm" data-action="to-home">홈</button>'+
          '</div>'+
        '</div>'+
      '</div>';
    }
  };

  /* =========================================================
     ROUND FLOW
  ========================================================= */
  function startRound(){
    var topic;
    if(S.topicId==="__random"){ var all=allTopics().filter(function(x){return x.words.length>=4;}); topic=all[Math.floor(Math.random()*all.length)]; }
    else { topic=topicById(S.topicId); }
    if(!topic || topic.words.length<4){ topic=BANK_GENERAL[0]; S.topicId="animal"; }
    S.topicName=topic.name; S.topicWords=topic.words.slice();
    S.keyword=pickKeyword(S.topicWords);
    S.fakeKeyword="";
    if(S.mode==="fool" && S.topicWords.length>=2){
      var others=S.topicWords.filter(function(w){ return w!==S.keyword; });
      if(others.length) S.fakeKeyword=others[Math.floor(Math.random()*others.length)];
    }
    S.roles=assignRoles(S.players, S.liars);
    S.revealIdx=0; S.revealShown=false;
    var order=[]; for(var i=0;i<S.players;i++) order.push(i); S.hintOrder=shuffle(order);
    S.votes=[]; S.voteIdx=0; S.result=null;
    stopTimer(); S.timerLeft=S.discussMin*60; S.timerOn=false;
    go("reveal");
  }

  function nextReveal(){
    if(S.revealIdx>=S.players-1){ go("discuss"); }
    else { S.revealIdx++; S.revealShown=false; render(); }
  }

  function toVote(){ S.voteIdx=0; S.votes=[]; stopTimer(); go("vote"); }

  function castVote(target){
    S.votes[S.voteIdx]=target; SFX.vote();
    if(S.voteIdx>=S.players-1){ finishVote(false); }
    else { S.voteIdx++; render(); }
  }

  function finishVote(skipped){
    var t=tally(S.votes, S.players);
    var out=t.out;
    var caught=(out!=null && S.roles[out]==="liar");
    S.result={ tallyData:t, out:out, caught:caught, skipped:!!skipped, liarGuessCorrect:false, stage:"final", winner:null, guessOptions:[] };
    if(!skipped && caught && S.liarChance){
      // 라이어 찬스: 같은 주제 제시어 중 보기 6개 (정답 포함)
      var pool=S.topicWords.filter(function(w){ return w!==S.keyword; });
      pool=shuffle(pool).slice(0,5); pool.push(S.keyword); pool=shuffle(pool);
      S.result.guessOptions=pool; S.result.stage="guess";
      SFX.liar();
    } else {
      S.result.winner=decideWinner(S.roles, out, S.liarChance, false);
      (S.result.winner==="citizen"?SFX.win:SFX.lose)();
    }
    go("result");
  }

  function skipToResult(){
    // 손들기로 정함 → 투표 생략, 정답만 공개 (승패는 라이어 생존으로 간주하지 않고 단순 공개)
    var t=tally([], S.players);
    S.result={ tallyData:t, out:null, caught:false, skipped:true, liarGuessCorrect:false, stage:"final", winner:"citizen", guessOptions:[] };
    // skipped 모드에서는 승패 대신 정답만 보여주되, 배너는 중립적으로 '정답 공개' 느낌
    S.result.winner="reveal";
    SFX.reveal();
    go("result");
  }

  function liarGuess(word){
    S.result.liarGuessCorrect = (word===S.keyword);
    S.result.stage="final";
    S.result.winner=decideWinner(S.roles, S.result.out, S.liarChance, S.result.liarGuessCorrect);
    (S.result.winner==="citizen"?SFX.win:SFX.lose)();
    render();
  }

    if(S.timerLeft<=0) S.timerLeft=S.discussMin*60;
    S.timerOn=true; render();

      var d=document.getElementById("tdisp");
      if(d){ var mm=Math.floor(S.timerLeft/60), ss=S.timerLeft%60; d.textContent=(mm<10?'0':'')+mm+':'+(ss<10?'0':'')+ss; if(S.timerLeft<=10) d.classList.add("low"); }
      else { stopTimerInterval(); }
    },1000);
  }

  function stopTimer(){ stopTimerInterval(); S.timerOn=false; }

  /* ---------- CSV / 일괄 업로드 ---------- */
  function parseCSV(text){
    if(text && text.charCodeAt(0)===0xFEFF) text=text.slice(1);
    var rows=[], row=[], field="", i=0, n=text.length, inQ=false;
    while(i<n){
      var ch=text[i];
      if(inQ){
        if(ch==='"'){ if(text[i+1]==='"'){ field+='"'; i+=2; continue; } inQ=false; i++; continue; }
        field+=ch; i++; continue;
      }
      if(ch==='"'){ inQ=true; i++; continue; }
      if(ch===','){ row.push(field); field=""; i++; continue; }
      if(ch==='\r'){ i++; continue; }
      if(ch==='\n'){ row.push(field); rows.push(row); row=[]; field=""; i++; continue; }
      field+=ch; i++; continue;
    }
    if(field!=="" || row.length>0){ row.push(field); rows.push(row); }
    return rows;
  }
  function csvCell(s){ s=String(s==null?"":s); return /[",\n\r]/.test(s)? '"'+s.replace(/"/g,'""')+'"' : s; }
  function downloadCSV(filename, text){
    try{
      var blob=new Blob(["\uFEFF"+text], {type:"text/csv;charset=utf-8;"});
      var url=URL.createObjectURL(blob);
      var a=document.createElement("a"); a.href=url; a.download=filename;
      document.body.appendChild(a); a.click();
      setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 120);
    }catch(e){ alert("다운로드에 실패했어요: "+e.message); }
  }
  function templateCSV(){ return "카테고리,제시어\n음식,김치찌개\n동물,사자\n직업,소방관\n"; }
  function buildExportText(){
    var lines=["카테고리,제시어"];
    loadCustom().forEach(function(c){ c.words.forEach(function(w){ lines.push(csvCell(c.name)+","+csvCell(w)); }); });
    return lines.join("\n")+"\n";
  }
  function exportCSV(){
    if(loadCustom().length===0){ alert("내보낼 제시어가 없어요."); return; }
    downloadCSV("questions_template.csv", buildExportText()); SFX.tap();
  }

  function loadXLSX(cb){
    if(window.XLSX) return cb();
    var s=document.createElement("script");
    s.src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js";
    s.onload=function(){ cb(); };
    s.onerror=function(){ cb(new Error("엑셀(XLSX) 라이브러리를 불러오지 못했어요. 인터넷을 확인하거나 CSV로 올려주세요.")); };
    document.head.appendChild(s);
  }
  function rowsFromXLSX(buf){
    var wb=XLSX.read(buf,{type:"array"});
    var ws=wb.Sheets[wb.SheetNames[0]];
    return XLSX.utils.sheet_to_json(ws,{header:1, raw:false, defval:""});
  }

  function handleFile(file){
    S.upload.error="";
    var name=(file.name||"").toLowerCase();
    if(/\.(xlsx|xls)$/.test(name)){
      var ra=new FileReader();
      ra.onload=function(){ loadXLSX(function(err){ if(err){ S.upload.error=err.message; render(); return; } try{ S.upload.rawRows=rowsFromXLSX(ra.result); computePreview(); }catch(e){ S.upload.error="엑셀 파일을 읽지 못했어요: "+e.message; render(); } }); };
      ra.onerror=function(){ S.upload.error="파일을 읽지 못했어요."; render(); };
      ra.readAsArrayBuffer(file);
    } else if(/\.(csv|txt)$/.test(name) || name===""){
      var rt=new FileReader();
      rt.onload=function(){ try{ S.upload.rawRows=parseCSV(String(rt.result||"")); computePreview(); }catch(e){ S.upload.error="CSV를 읽지 못했어요: "+e.message; render(); } };
      rt.onerror=function(){ S.upload.error="파일을 읽지 못했어요."; render(); };
      rt.readAsText(file,"utf-8");
    } else {
      S.upload.error="지원하지 않는 형식이에요. CSV 또는 XLSX 파일을 올려주세요."; render();
    }
  }

  function computePreview(){
    var rows=S.upload.rawRows||[], mode=S.upload.mode;
    var builtinMap={}; BANK_GENERAL.concat(BANK_SCIENCE).forEach(function(t){ var m={}; t.words.forEach(function(w){ m[w]=1; }); builtinMap[t.name]=m; });
    var customMap={}; loadCustom().forEach(function(c){ var m={}; c.words.forEach(function(w){ m[w]=1; }); customMap[c.name]=m; });
    var add=[], skipped=[], seen={};
    for(var idx=0; idx<rows.length; idx++){
      var r=rows[idx]||[], line=idx+1;
      var any=false; for(var k=0;k<r.length;k++){ if(String(r[k]==null?"":r[k]).trim()!==""){ any=true; break; } }
      if(!any) continue; // 완전 빈 줄은 조용히 건너뜀
      var c0=(r[0]==null?"":String(r[0])).trim();
      var c1=(r[1]==null?"":String(r[1])).trim();
      if(idx===0 && (c0==="카테고리"||c0.toLowerCase()==="category") && (c1==="제시어"||c1==="주제"||c1.toLowerCase()==="keyword")) continue; // 헤더
      if(c0==="" || c1===""){ skipped.push({line:line, reason:"빈 칸(카테고리·제시어 모두 필요)"}); continue; }
      var extra=0; for(var j=2;j<r.length;j++){ if(String(r[j]==null?"":r[j]).trim()!==""){ extra++; } }
      if(extra>0){ skipped.push({line:line, reason:"칸이 2개를 초과했어요 (카테고리,제시어 형식)"}); continue; }
      var key=c0+"\u0000"+c1;
      if(seen[key]){ skipped.push({line:line, reason:"파일 안에서 중복"}); continue; }
      if(builtinMap[c0] && builtinMap[c0][c1]){ skipped.push({line:line, reason:"기본 주제에 이미 있음"}); continue; }
      if(mode!=="replace" && customMap[c0] && customMap[c0][c1]){ skipped.push({line:line, reason:"이미 추가된 제시어"}); continue; }
      seen[key]=1; add.push({category:c0, word:c1});
    }
    var grouped={}; add.forEach(function(a){ (grouped[a.category]=grouped[a.category]||[]).push(a.word); });
    S.upload.add=add; S.upload.skipped=skipped; S.upload.grouped=grouped; S.upload.preview=true; S.upload.error="";
    SFX.tap(); render();
  }

  function confirmUpload(){
    var grouped=S.upload.grouped, mode=S.upload.mode;
    var list=(mode==="replace")? [] : loadCustom();
    function findCat(name){ for(var i=0;i<list.length;i++){ if(list[i].name===name) return list[i]; } return null; }
    var added=0, newCats=0;
    Object.keys(grouped).forEach(function(cat){
      var t=findCat(cat);
      if(!t){ t={id:"c"+Date.now()+Math.floor(Math.random()*100000), name:cat, words:[]}; list.push(t); newCats++; }
      var have={}; t.words.forEach(function(w){ have[w]=1; });
      grouped[cat].forEach(function(w){ if(!have[w]){ t.words.push(w); have[w]=1; added++; } });
    });
    saveCustom(list);
    if(!topicById(S.topicId)) S.topicId="animal"; // 교체로 선택 주제가 사라졌으면 기본값
    S.toast=(mode==="replace"?"전체 교체 완료 — ":"")+"제시어 "+added+"개"+(newCats?" · 새 카테고리 "+newCats+"개":"")+" 반영했어요.";
    S.upload={ mode:mode, preview:false, rawRows:null, add:[], skipped:[], grouped:{}, error:"" };
    S.customTab="list"; SFX.win(); render();
    setTimeout(function(){ if(S.toast){ S.toast=""; if(S.screen==="custom") render(); } }, 6000);
  }

  function cancelUpload(){ S.upload.preview=false; S.upload.rawRows=null; S.upload.add=[]; S.upload.skipped=[]; S.upload.grouped={}; S.upload.error=""; SFX.tap(); render(); }

  function previewPanel(){
    var u=S.upload, grouped=u.grouped, cats=Object.keys(grouped);
    var addN=u.add.length, skipN=u.skipped.length;
    var bn={}; BANK_GENERAL.concat(BANK_SCIENCE).forEach(function(t){ bn[t.name]=1; });
    var cn={}; loadCustom().forEach(function(c){ cn[c.name]=1; });
    var catHtml = cats.length? cats.map(function(cat){
      var isNew=!bn[cat] && !cn[cat];
      var words=grouped[cat].map(function(w){ return '<span class="prev-word">'+esc(w)+'</span>'; }).join("");
      return '<div class="prev-cat">'+esc(cat)+(isNew?'<span class="new-badge">새 카테고리</span>':'')+'</div><div>'+words+'</div>';
    }).join("") : '<div class="empty" style="padding:10px">추가할 새 제시어가 없어요.</div>';
    var skipHtml = skipN? '<div class="grp-label">건너뛴 행 '+skipN+'개</div><div class="prev-list">'+u.skipped.map(function(s){ return '<div><b>'+s.line+'행</b> — '+esc(s.reason)+'</div>'; }).join("")+'</div>' : '';
    var warn = (u.mode==="replace")? '<div class="err-box">⚠ \u2018전체 교체\u2019 모드 — 기존 내 제시어가 모두 삭제되고 위 내용으로 바뀝니다.</div>' : '';
    var disable = (addN===0 && u.mode!=="replace");
    return '<div class="panel">'+
        '<div class="prev-stat">'+
          '<div class="prev-pill add"><span class="n">'+addN+'</span>추가될 제시어</div>'+
          '<div class="prev-pill skip"><span class="n">'+skipN+'</span>건너뛸 행</div>'+
        '</div>'+
        '<div class="prev-list" style="max-height:180px">'+catHtml+'</div>'+
        skipHtml + warn +
        '<div class="row" style="margin-top:12px">'+
          '<button class="btn btn-ghost btn-sm" data-action="upload-cancel" style="flex:.6">취소</button>'+
          '<button class="btn '+(u.mode==="replace"?"btn-danger":"btn-primary")+' btn-sm" data-action="upload-confirm" style="flex:1.4'+(disable?";opacity:.45;pointer-events:none":"")+'">확정해서 반영 ('+addN+'개)</button>'+
        '</div>'+
      '</div>';
  }

  function wireUpload(){
    var inp=document.getElementById("fileInput");
    if(inp){ inp.addEventListener("change", function(e){ var f=e.target.files&&e.target.files[0]; if(f){ handleFile(f); } e.target.value=""; }); }
    var dz=document.getElementById("dropZone");
    if(dz){
      ["dragenter","dragover"].forEach(function(ev){ dz.addEventListener(ev,function(e){ e.preventDefault(); e.stopPropagation(); dz.classList.add("drag"); }); });
      ["dragleave","dragend"].forEach(function(ev){ dz.addEventListener(ev,function(e){ e.preventDefault(); e.stopPropagation(); dz.classList.remove("drag"); }); });
      dz.addEventListener("drop", function(e){ e.preventDefault(); e.stopPropagation(); dz.classList.remove("drag"); var f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0]; if(f) handleFile(f); });
    }
  }

  function wireSetup(){
    var inputs=document.querySelectorAll(".pname-inp");
    for(var i=0;i<inputs.length;i++){
      (function(el){ el.addEventListener("input", function(){ var idx=parseInt(el.dataset.idx,10); S.names[idx]=el.value; saveCfg(); }); })(inputs[i]);
    }
  }

  function delCustom(idx){
    var list=loadCustom(); var removed=list[idx];
    if(removed && removed.id===S.topicId) S.topicId="animal";
    list.splice(idx,1); saveCustom(list); SFX.tap(); render();
  }

  /* =========================================================
     ACTION DISPATCH
  ========================================================= */
  function handle(action, el){
    switch(action){
      case "sound-toggle": S.sound=!S.sound; saveCfg(); render(); if(S.sound) SFX.tap(); break;
      case "start": SFX.tap(); go("setup"); break;
      case "rules": SFX.tap(); go("rules"); break;
      case "rules-back": SFX.tap(); go("home"); break;
      case "custom": SFX.tap(); S.customTab="list"; S.toast=""; S.upload.preview=false; S.upload.error=""; go("custom"); break;
      case "to-home": SFX.tap(); stopTimer(); go("home"); break;
      case "to-setup": SFX.tap(); go("setup"); break;

      case "pl-dec": if(S.players>3){ S.players--; SFX.tap(); saveCfg(); render(); } break;
      case "pl-inc": if(S.players<10){ S.players++; SFX.tap(); saveCfg(); render(); } break;
      case "liar-dec": if(S.liars>1){ S.liars--; SFX.tap(); saveCfg(); render(); } break;
      case "liar-inc": { var mx=Math.max(1,Math.min(3,S.players-2)); if(S.liars<mx){ S.liars++; SFX.tap(); saveCfg(); render(); } } break;
      case "pick-topic": S.topicId=el.dataset.topic; SFX.tap(); saveCfg(); render(); break;
      case "set-min": S.discussMin=parseInt(el.dataset.min,10); SFX.tap(); saveCfg(); render(); break;
      case "toggle-adv": S.showAdv=!S.showAdv; SFX.tap(); render(); break;
      case "toggle-names": S.useNames=!S.useNames; SFX.tap(); saveCfg(); render(); break;
      case "set-mode": S.mode=(el.dataset.mode==="fool")?"fool":"classic"; SFX.tap(); saveCfg(); render(); break;
      case "clear-names": S.names=[]; SFX.tap(); saveCfg(); render(); break;
      case "toggle-chance": S.liarChance=!S.liarChance; SFX.tap(); saveCfg(); render(); break;
      case "begin": SFX.reveal(); saveCfg(); startRound(); break;

      case "reveal-show": S.revealShown=true; ((S.roles[S.revealIdx]==="liar" && !(S.mode==="fool" && S.fakeKeyword))?SFX.liar:SFX.reveal)(); render(); break;
      case "reveal-hide": SFX.pass(); nextReveal(); break;

      case "timer-start": SFX.tap(); startTimer(); break;
      case "timer-pause": SFX.tap(); stopTimer(); render(); break;
      case "timer-reset": SFX.tap(); stopTimer(); S.timerLeft=S.discussMin*60; render(); break;
      case "to-vote": SFX.tap(); toVote(); break;
      case "skip-result": SFX.tap(); skipToResult(); break;

      case "cast-vote": castVote(parseInt(el.dataset.target,10)); break;
      case "liar-guess": liarGuess(el.dataset.word); break;

      case "play-again": SFX.reveal(); startRound(); break;

      case "custom-tab": S.customTab=el.dataset.tab; S.upload.preview=false; S.upload.error=""; SFX.tap(); render(); break;
      case "custom-del": delCustom(parseInt(el.dataset.idx,10)); break;
      case "tpl-download": SFX.tap(); downloadCSV("questions_template.csv", templateCSV()); break;
      case "export-csv": exportCSV(); break;
      case "file-pick": { var fi=document.getElementById("fileInput"); if(fi) fi.click(); } break;
      case "upload-mode": S.upload.mode=el.dataset.mode; SFX.tap(); render(); break;
      case "paste-preview": { var ta=document.getElementById("pasteArea"); var txt=ta? ta.value:""; if(!txt || !txt.trim()){ S.upload.error="붙여넣은 내용이 없어요. 카테고리, 제시어 형식으로 입력해 주세요."; render(); break; } S.upload.rawRows=parseCSV(txt); computePreview(); } break;
      case "upload-confirm": confirmUpload(); break;
      case "upload-cancel": cancelUpload(); break;
    }
  }

  app.addEventListener("click", function(e){
    var el=e.target.closest("[data-action]");
    if(!el) return;
    handle(el.dataset.action, el);
  });

  /* =========================================================
     EXPOSE FOR TESTS
  ========================================================= */
  window.App={
    S:S, go:go, handle:handle, render:render,
    assignRoles:assignRoles, tally:tally, decideWinner:decideWinner, pickKeyword:pickKeyword,
    allTopics:allTopics, startRound:startRound, finishVote:finishVote, liarGuess:liarGuess,
    parseCSV:parseCSV, csvCell:csvCell, templateCSV:templateCSV, buildExportText:buildExportText,
    computePreview:computePreview, confirmUpload:confirmUpload, loadCustom:loadCustom, pname:pname
  };

  /* =========================================================
     INIT
  ========================================================= */
  starfield();
  render();
})();
</script>
<!-- ⏱ CGW 선생님 타이머 위젯 (자유 카운트다운) -->
<div id="cgwt" data-open="0">
  <button id="cgwt-fab" title="타이머">⏱<span id="cgwt-mini"></span></button>
  <div id="cgwt-panel">
    <div id="cgwt-time">01:00</div>
    <div class="cgwt-row cgwt-presets">
      <button data-s="30">30초</button><button data-s="60">1분</button><button data-s="120">2분</button><button data-s="180">3분</button><button data-s="300">5분</button>
    </div>
    <div class="cgwt-row">
      <button data-a="-10">−10초</button><button data-a="10">+10초</button><button data-a="60">+1분</button>
    </div>
    <div class="cgwt-row cgwt-ctrl">
      <button id="cgwt-go">▶ 시작</button><button id="cgwt-reset" title="리셋">↺</button><button id="cgwt-x" title="닫기">✕</button>
    </div>
  </div>
</div>
<style>
#cgwt{position:fixed;right:14px;bottom:14px;z-index:2147483000;font-family:system-ui,'Do Hyeon','Jua',sans-serif}
#cgwt-fab{width:56px;height:56px;border-radius:50%;border:none;cursor:pointer;font-size:24px;color:#fff;
  background:linear-gradient(135deg,#7c5cff,#ff5ea8);box-shadow:0 6px 20px rgba(0,0,0,.45);position:relative;line-height:1}
#cgwt-mini{position:absolute;left:0;right:0;bottom:6px;font-size:10px;font-weight:700;letter-spacing:.5px}
#cgwt-panel{position:absolute;right:0;bottom:66px;width:236px;background:#1c1630;color:#fff;border:1px solid #443a6e;
  border-radius:16px;padding:14px;box-shadow:0 16px 40px rgba(0,0,0,.55);display:none}
#cgwt[data-open="1"] #cgwt-panel{display:block}
#cgwt-time{font-family:ui-monospace,'Courier New',monospace;font-size:46px;text-align:center;font-weight:700;letter-spacing:2px;margin-bottom:12px}
#cgwt.alarm #cgwt-time{color:#ff5e6c;animation:cgwtBlink .5s steps(1) infinite}
@keyframes cgwtBlink{50%{opacity:.2}}
.cgwt-row{display:flex;gap:6px;justify-content:center;margin-bottom:8px;flex-wrap:wrap}
.cgwt-row button{flex:1;min-width:0;padding:9px 4px;border-radius:10px;border:1px solid #443a6e;background:#2a2145;color:#dcd4ff;font-size:13px;cursor:pointer}
.cgwt-row button:active{transform:scale(.95)}
.cgwt-ctrl #cgwt-go{flex:2.4;background:linear-gradient(135deg,#3ddc84,#1fb866);color:#052a1c;font-weight:700;border:none}
.cgwt-ctrl #cgwt-go.pause{background:linear-gradient(135deg,#ffb23f,#ff8a3d);color:#2a1500}
</style>
<script>
(function(){
  var root=document.getElementById('cgwt'), timeEl=document.getElementById('cgwt-time'),
      mini=document.getElementById('cgwt-mini'), go=document.getElementById('cgwt-go');
  var total=60, left=60, running=false, tid=null, ac=null;
  function fmt(s){s=Math.max(0,s|0);var m=(s/60)|0,x=s%60;return (m<10?'0':'')+m+':'+(x<10?'0':'')+x;}
  function paint(){timeEl.textContent=fmt(left);mini.textContent=running?fmt(left):'';}
  function beep(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();var o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=880;g.gain.value=.16;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.4);}catch(e){}}
  function alarm(){root.classList.add('alarm');var n=0,iv=setInterval(function(){beep();if(++n>=5)clearInterval(iv);},560);setTimeout(function(){root.classList.remove('alarm');},4200);}
  function tick(){left--;paint();if(left<=0){stopTimer();alarm();}}
  function start(){if(running){pause();return;}if(left<=0)left=total;running=true;go.textContent='⏸ 정지';go.classList.add('pause');try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();}catch(e){}tid=setInterval(tick,1000);paint();}
  function pause(){running=false;go.textContent='▶ 시작';go.classList.remove('pause');clearInterval(tid);paint();}
  function stopTimer(){running=false;go.textContent='▶ 시작';go.classList.remove('pause');clearInterval(tid);mini.textContent='';}
  function setT(s){total=left=s;pause();root.classList.remove('alarm');paint();}
  document.getElementById('cgwt-fab').onclick=function(){root.dataset.open=root.dataset.open==='1'?'0':'1';};
  document.getElementById('cgwt-x').onclick=function(){root.dataset.open='0';};
  document.getElementById('cgwt-reset').onclick=function(){setT(total);};
  go.onclick=start;
  root.querySelectorAll('[data-s]').forEach(function(b){b.onclick=function(){setT(+b.dataset.s);};});
  root.querySelectorAll('[data-a]').forEach(function(b){b.onclick=function(){setT(Math.max(0,left+(+b.dataset.a)));};});
  setT(60);
})();
</script>
