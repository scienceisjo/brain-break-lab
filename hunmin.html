    --f-disp:'Song Myung',serif;
    --f-body:'Pretendard','Pretendard Variable',system-ui,sans-serif;
    --f-batang:'Gowun Batang',serif;
    --f-jua:'Jua',sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{color-scheme:dark}
  html,body{margin:0;padding:0;min-height:100%}
  button,input,textarea,select{font-family:inherit; color:var(--text)}
  body{
    background:
      radial-gradient(120% 80% at 50% -10%, #2a2018 0%, rgba(42,32,24,0) 55%),
      radial-gradient(100% 70% at 110% 8%, rgba(217,164,65,.10) 0%, rgba(217,164,65,0) 50%),
      var(--bg);
    color:var(--text); font-family:var(--f-body); overflow-x:hidden; -webkit-font-smoothing:antialiased;
  }
  /* 배경: 조선풍 픽셀 야경이 --bg-image 에 인라인. 끄려면 --bg-image:none; */
  #bgphoto{position:fixed; inset:0; z-index:-2; background-image:var(--bg-image); background-size:cover; background-position:center; background-repeat:no-repeat; image-rendering:crisp-edges; image-rendering:-moz-crisp-edges; image-rendering:pixelated}
  #bgphoto::before{content:""; position:absolute; inset:0; background:repeating-linear-gradient(0deg, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.08) 2px 3px); pointer-events:none}
  #bgphoto::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(18,13,10,.50) 0%, rgba(18,13,10,.64) 55%, rgba(18,13,10,.82) 100%)}
  .wrap{max-width:560px; margin:0 auto; padding:22px 18px 40px; min-height:100vh; display:flex; flex-direction:column}

  .bar{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px}
  .brand{display:flex; align-items:center; gap:9px}
  .dot{width:10px; height:10px; border-radius:50%; background:var(--gold); box-shadow:0 0 12px var(--gold); animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .brand b{font-family:var(--f-batang); font-size:12px; letter-spacing:2px; color:var(--muted); font-weight:700}
  .sound-btn{border:1px solid var(--line); background:rgba(255,255,255,.04); color:var(--muted); width:40px; height:34px; border-radius:10px; font-size:15px; cursor:pointer; transition:.15s}
  .sound-btn:active{transform:scale(.94)}

  .screen{flex:1; display:flex; flex-direction:column; animation:rise .42s cubic-bezier(.16,1,.3,1)}
  @keyframes rise{from{opacity:0; transform:translateY(16px)}to{opacity:1; transform:translateY(0)}}
  .center{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:14px}
  .spacer{flex:1}

  .eyebrow{font-family:var(--f-batang); font-size:12px; letter-spacing:4px; color:var(--gold); font-weight:700}
  h1.title{font-family:var(--f-disp); font-size:clamp(46px,15vw,72px); line-height:1.12; margin:6px 0 4px; letter-spacing:2px; color:var(--paper); text-shadow:0 2px 0 rgba(0,0,0,.4), 0 0 34px rgba(217,164,65,.22)}
  .hanja{font-family:var(--f-disp); font-size:14px; letter-spacing:8px; color:var(--gold); opacity:.85}
  .tag{font-family:var(--f-batang); color:var(--muted); font-size:15.5px; margin:2px 0 0; font-weight:700}
  .sect-h{font-family:var(--f-disp); font-size:25px; margin:2px 0 4px; letter-spacing:1px}
  .lead{color:var(--muted); font-size:13.5px; line-height:1.6}
  .grp-label{font-family:var(--f-batang); font-size:12px; letter-spacing:3px; color:var(--gold); margin:14px 0 6px; font-weight:700}

  .btn{display:flex; align-items:center; justify-content:center; gap:8px; width:100%; border:none; border-radius:14px; padding:16px 18px; font-family:var(--f-disp); font-size:19px; letter-spacing:2px; cursor:pointer; color:#1d1408; transition:transform .12s, box-shadow .2s; text-align:center}
  .btn:active{transform:translateY(2px) scale(.99)}
  .btn-primary{background:linear-gradient(120deg,var(--gold),var(--gold-l)); box-shadow:0 8px 28px rgba(217,164,65,.30), inset 0 1px 0 rgba(255,255,255,.4)}
  .btn-red{background:linear-gradient(120deg,var(--red),var(--red-l)); color:#ffefe8; box-shadow:0 8px 24px rgba(176,58,46,.3)}
  .btn-ghost{background:rgba(255,255,255,.045); border:1px solid var(--line); color:var(--text); font-family:var(--f-batang); font-weight:700; font-size:15px; letter-spacing:1px; box-shadow:none}
  .btn-ghost:active{background:rgba(255,255,255,.09)}
  .btn-sm{padding:12px 14px; font-size:15px; border-radius:12px}
  .stack{display:flex; flex-direction:column; gap:11px}
  .row{display:flex; gap:11px}
  .row>*{flex:1}

  .panel{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:18px; backdrop-filter:blur(8px); margin:10px 0}
  .chip-num{display:inline-flex; align-items:center; justify-content:center; min-width:24px; height:24px; padding:0 7px; border-radius:7px; background:rgba(217,164,65,.16); border:1px solid var(--line); color:var(--gold); font-family:var(--f-batang); font-weight:700; font-size:12px}

  .seg{display:flex; gap:6px; background:rgba(255,255,255,.04); border:1px solid var(--line); border-radius:12px; padding:4px}
  .seg button{flex:1; border:none; background:transparent; color:var(--muted); padding:10px 6px; border-radius:9px; font-family:var(--f-batang); font-weight:700; font-size:14px; cursor:pointer; transition:.15s}
  .seg button.on{background:var(--gold); color:#1d1408; box-shadow:0 3px 12px rgba(217,164,65,.3)}
  .opt-row{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 0 2px}
  .opt-row .nm{font-family:var(--f-batang); font-weight:700; font-size:15px}
  .opt-row .nm small{display:block; color:var(--muted); font-size:11px; font-family:var(--f-body); font-weight:400}
  .toggle{width:54px; height:30px; border-radius:30px; border:1px solid var(--line); background:rgba(255,255,255,.06); position:relative; cursor:pointer; transition:.2s; flex:none}
  .toggle::after{content:""; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:var(--muted); transition:.2s}
  .toggle.on{background:rgba(217,164,65,.25); border-color:var(--gold)}
  .toggle.on::after{left:27px; background:var(--gold); box-shadow:0 0 10px var(--gold)}

  /* ---- play ---- */
  .round-tag{font-family:var(--f-batang); font-weight:700; font-size:13px; letter-spacing:3px; color:var(--gold); text-align:center; margin-bottom:4px}
  .chant{font-family:var(--f-disp); font-size:clamp(38px,12vw,58px); color:var(--paper); text-align:center; letter-spacing:3px; line-height:1.2; animation:chantPop .5s cubic-bezier(.16,1,.3,1); text-shadow:0 0 34px rgba(217,164,65,.3)}
  @keyframes chantPop{from{transform:scale(.8); opacity:.2}to{transform:scale(1); opacity:1}}
  .chant small{display:block; font-size:15px; font-family:var(--f-batang); color:var(--muted); letter-spacing:2px; margin-top:14px}
  .cho-disp{display:flex; justify-content:center; gap:14px; margin:14px 0 8px}
  .cho-box{position:relative; width:clamp(84px,26vw,120px); height:clamp(96px,30vw,138px); border-radius:10px; background:linear-gradient(165deg,#f5ebd4,#e4d3ab); border:1px solid #c9ae78; display:flex; align-items:center; justify-content:center; font-family:var(--f-disp); font-size:clamp(52px,17vw,80px); color:#241c14; box-shadow:0 10px 30px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.7); animation:cardIn .45s cubic-bezier(.16,1,.3,1)}
  .cho-box::after{content:"訓"; position:absolute; right:6px; bottom:5px; width:18px; height:18px; border:1.5px solid var(--red); color:var(--red); font-size:11px; font-family:var(--f-disp); display:flex; align-items:center; justify-content:center; border-radius:3px; opacity:.8}
  @keyframes cardIn{from{opacity:0; transform:translateY(-14px) rotate(-2deg)}to{opacity:1; transform:translateY(0) rotate(0)}}
  .shout-label{font-family:var(--f-disp); font-size:21px; text-align:center; color:var(--paper); letter-spacing:2px; margin:6px 0 2px}
  .shout-label.over{color:var(--red-l)}
  .time-row{display:flex; align-items:center; gap:10px; margin:8px 0 4px}
  .time-bar-wrap{flex:1; height:12px; border-radius:8px; background:rgba(255,255,255,.06); overflow:hidden; border:1px solid rgba(217,164,65,.2)}
  .time-bar{height:100%; width:100%; border-radius:8px; background:linear-gradient(90deg,var(--gold),var(--gold-l)); transition:width .12s linear}
  .time-num{font-family:var(--f-batang); font-weight:700; font-size:13px; color:var(--muted); min-width:40px; text-align:right}

  .judge-h{display:flex; justify-content:space-between; align-items:center; margin:12px 0 6px}
  .judge-h .t{font-family:var(--f-batang); font-weight:700; font-size:12px; color:var(--gold); letter-spacing:2px}
  .word-input{width:100%; border-radius:12px; border:1.5px solid var(--line); background:rgba(255,255,255,.05); color:var(--text); font-family:var(--f-batang); font-weight:700; font-size:22px; padding:13px 14px; text-align:center; letter-spacing:3px}
  .word-input:focus{border-color:var(--gold); outline:none; box-shadow:0 0 0 3px rgba(217,164,65,.15)}
  .word-input::placeholder{color:rgba(201,181,142,.5); letter-spacing:0; font-size:16px}
  .feedback{text-align:center; font-family:var(--f-batang); font-weight:700; font-size:15px; min-height:22px; margin:8px 0 2px}
  .feedback.good{color:var(--gold-l)} .feedback.bad{color:var(--red-l)}
  .used-wrap{display:flex; flex-wrap:wrap; gap:6px; max-height:110px; overflow:auto; padding:2px; align-content:flex-start}
  .used-chip{background:rgba(217,164,65,.13); border:1px solid var(--line); border-radius:7px; padding:4px 11px; font-family:var(--f-batang); font-weight:700; font-size:14px; color:var(--text); animation:pop .25s}
  @keyframes pop{from{transform:scale(.6); opacity:.3}to{transform:scale(1); opacity:1}}
  .used-empty{color:var(--muted); font-family:var(--f-batang); font-size:12px; padding:4px 2px}
  .mini-btn{border:1px solid var(--line); background:rgba(255,255,255,.05); color:var(--muted); border-radius:9px; padding:6px 11px; font-size:12px; font-family:var(--f-batang); font-weight:700; cursor:pointer}
  .mini-btn:active{transform:scale(.95)}

  .seal{display:inline-block; border:2px solid var(--red); color:var(--red-l); border-radius:6px; padding:6px 12px; font-family:var(--f-disp); font-size:12px; letter-spacing:2px; transform:rotate(-2.5deg); background:rgba(176,58,46,.07); margin-top:14px}
  .footer-note{font-family:var(--f-batang); font-size:11px; color:rgba(201,181,142,.6); text-align:center; margin-top:12px; letter-spacing:1px; line-height:1.7}

  @media (max-width:360px){ .wrap{padding:16px 13px 34px} }
  @media (prefers-reduced-motion:reduce){ *{animation-duration:.001s !important; transition-duration:.05s !important} }
</style>
</head>
<body>
<div id="bgphoto"></div>
<div class="wrap">
  <div class="bar">
    <div class="brand"><span class="dot"></span><b>CLASS GAME WORLD</b></div>
    <button class="sound-btn" data-action="sound-toggle" id="soundBtn" title="소리">🔊</button>
  </div>
  <div id="app"></div>
</div>

<script>
(function(){
  "use strict";

  /* =========================================================
     한글 초성 분해 · 출제 · 판정
  ========================================================= */
  var CHO=["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
  var BASIC=["ㄱ","ㄴ","ㄷ","ㄹ","ㅁ","ㅂ","ㅅ","ㅇ","ㅈ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
  var SSANG=["ㄲ","ㄸ","ㅃ","ㅆ","ㅉ"];
  function choOf(ch){ var c=ch.charCodeAt(0); if(c<0xAC00||c>0xD7A3) return null; return CHO[Math.floor((c-0xAC00)/588)]; }
  function drawTargets(n, ssang){ var pool=ssang?BASIC.concat(SSANG):BASIC; var r=[]; for(var i=0;i<n;i++){ r.push(pool[Math.floor(Math.random()*pool.length)]); } return r; }
  function validateWord(raw, targets, usedSet){
    var w=String(raw==null?"":raw).replace(/\s+/g,"");
    if(w==="") return {ok:false, reason:"단어를 입력하시오"};
    for(var i=0;i<w.length;i++){ var c=w.charCodeAt(i); if(c<0xAC00||c>0xD7A3) return {ok:false, reason:"완성된 한글만 인정하오"}; }
    if(w.length!==targets.length) return {ok:false, reason:targets.length+"글자여야 하오"};
    for(var j=0;j<w.length;j++){ if(choOf(w[j])!==targets[j]) return {ok:false, reason:"초성이 맞지 않소 ("+targets.join("")+")"}; }
    if(usedSet && usedSet[w]) return {ok:false, reason:"이미 나온 단어요 — 벌칙!"};
    return {ok:true, word:w};
  }

  /* =========================================================
     STORAGE
  ========================================================= */
  var LS_CFG="hmj_cfg_v2";
  function loadCfg(){ try{ return JSON.parse(localStorage.getItem(LS_CFG))||{}; }catch(e){ return {}; } }
  function saveCfg(){ try{ localStorage.setItem(LS_CFG, JSON.stringify({ len:S.len, cd:S.cd, ssang:S.ssang, sound:S.sound })); }catch(e){} }

  /* =========================================================
     SOUND (북 · 징 · 딱따기)
  ========================================================= */
  var actx=null;
  function ac(){ if(actx) return actx; try{ var C=window.AudioContext||window.webkitAudioContext; actx=C?new C():null; }catch(e){ actx=null; } return actx; }
  function tone(freq,dur,type,vol,when){
    if(!S.sound) return; var c=ac(); if(!c) return;
    try{ var t=c.currentTime+(when||0); var o=c.createOscillator(), g=c.createGain();
      o.type=type||"sine"; o.frequency.setValueAtTime(freq,t);
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.15,t+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+0.02);
    }catch(e){}
  }
  var SFX={
    tap:function(){ tone(500,.06,"triangle",.09); },
    drum:function(){ tone(140,.22,"sine",.2); tone(90,.3,"sine",.16,.02); },          // 북
    gong:function(){ tone(196,.9,"sine",.18); tone(392,.7,"sine",.08,.02); tone(588,.5,"sine",.04,.03); }, // 징
    tick:function(){ tone(1100,.04,"square",.08); },                                    // 딱따기
    ding:function(){ tone(740,.09,"triangle",.13); tone(1110,.11,"triangle",.11,.06); },
    buzz:function(){ tone(180,.18,"sawtooth",.13); tone(130,.2,"sawtooth",.1,.07); },
    win:function(){ [523,659,784].forEach(function(f,i){ tone(f,.15,"triangle",.13,i*0.09); }); }
  };

  /* =========================================================
     외침 음성 파일 (선택 사항)
     ─ hunmin.html 과 "같은 폴더"(GitHub Pages 등)에 chant.mp3 를 올리면
       합성 북소리 대신 그 녹음이 재생됩니다. 파일명/경로는 아래 CHANT_SRC 로 변경.
     ─ 완전 단일 파일로 넣으려면 CHANT_SRC 에 base64 data URI 를 넣어도 됩니다.
       예) var CHANT_SRC = "data:audio/mp3;base64,AAAA...";
     ─ 파일이 없거나 못 읽으면 자동으로 합성 북소리로 폴백됩니다.
     ─ 초성은 음성이 "끝나는 순간"에 공개됩니다(자동 싱크).
  ========================================================= */
  var CHANT_SRC = "chant.mp3";
  var chantAudio=null, chantState="none";   // none | loading | ready | failed
  function initChantAudio(){
    if(!CHANT_SRC){ chantState="failed"; return; }
    try{
      chantAudio=new Audio(CHANT_SRC); chantAudio.preload="auto"; chantState="loading";
      chantAudio.addEventListener("canplaythrough", function(){ chantState="ready"; }, {once:true});
      chantAudio.addEventListener("error", function(){ chantState="failed"; }, {once:true});
    }catch(e){ chantState="failed"; }
  }

  /* =========================================================
     STATE
  ========================================================= */
  var saved=loadCfg();
  var S={
    screen:"home",
    len: saved.len||2,
    cd: 0,     // 외침 시간 제한 없음 (시간이 아니라 '못 외친 마지막 팀'을 찾는 게임)
    ssang: (saved.ssang!=null)? saved.ssang : false,
    sound: (saved.sound!=null)? saved.sound : true,
    game:null   // {targets, used[], usedSet, round, stage:ready|chant|reveal, cdLeft, timeUp}
  };

  /* =========================================================
     RENDER
  ========================================================= */
  var app=document.getElementById("app");
  var chantInt=null, cdInt=null, chantTimeout=null;
  function esc(s){ return String(s).replace(/[&<>"]/g,function(m){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m]; }); }
  function stopChantAudio(){ if(chantTimeout){ clearTimeout(chantTimeout); chantTimeout=null; } if(chantAudio){ try{ chantAudio.pause(); chantAudio.onended=null; }catch(e){} } }
  function stopTimers(){ if(chantInt){clearInterval(chantInt); chantInt=null;} if(cdInt){clearInterval(cdInt); cdInt=null;} stopChantAudio(); }
  function go(scr){ S.screen=scr; render(); }
  function render(){
    app.innerHTML = SCREENS[S.screen]? SCREENS[S.screen]() : "<div>오류</div>";
    document.getElementById("soundBtn").textContent = S.sound?"🔊":"🔇";
    window.scrollTo(0,0);
    if(S.screen==="play" && S.game && S.game.stage==="reveal") wireJudge();
  }

  /* =========================================================
     SCREENS
  ========================================================= */
  var SCREENS={
    home:function(){
      return '<div class="screen center" style="gap:8px">'+
        '<div class="hanja">訓 民 正 音</div>'+
        '<h1 class="title">훈민정음</h1>'+
        '<p class="tag">"훈민정~음!" 다 같이 외치는 초성 대결</p>'+
        '<div class="stack" style="width:100%; max-width:320px; margin-top:20px">'+
          '<button class="btn btn-primary" data-action="start">개시 開始</button>'+
          '<div class="row">'+
            '<button class="btn btn-ghost btn-sm" data-action="rules">놀이법</button>'+
            '<a href="https://scienceisjo.github.io/brain-break-lab/sonic" class="btn btn-ghost btn-sm" style="text-decoration:none">🏮 GAME WORLD</a>'+
          '</div>'+
        '</div>'+
        '<div class="seal">製作 · 해누리중학교 조승재</div>'+
        '<div class="footer-note">이 앱은 출제와 판정을 맡소 — 외치는 건 그대들의 몫!</div>'+
      '</div>';
    },

    rules:function(){
      return '<div class="screen">'+
        '<div class="eyebrow">놀 이 법</div>'+
        '<h2 class="sect-h">이렇게 노는 것이오</h2>'+
        '<div class="panel"><div style="font-size:14px; color:var(--text); line-height:1.75">'+
          '<p style="margin:0 0 10px"><span class="chip-num">1</span> 모두 둘러앉아 <b style="color:var(--gold)">엄지를 내밀고</b>, 화면을 다 같이 보이는 곳에 두시오.</p>'+
          '<p style="margin:0 0 10px"><span class="chip-num">2</span> 북소리에 맞춰 <b style="color:var(--gold)">"훈민정~음, 훈민정~음!"</b> 구호를 외치면 초성이 나타나오.</p>'+
          '<p style="margin:0 0 10px"><span class="chip-num">3</span> 초성이 보이는 순간, <b style="color:var(--gold)">순서 없이 동시에!</b> 그 초성에 맞는 단어를 외치며 재빨리 엄지를 잡으시오. (예: ㄱㅇ → 게임! 고요! 기억!)</p>'+
          '<p style="margin:0"><span class="chip-num">4</span> <b style="color:var(--red-l)">맨 마지막</b>이거나, <b style="color:var(--red-l)">남과 같은 단어</b>거나, <b style="color:var(--red-l)">틀린 단어</b>면 벌칙! 다툼이 나면 아래 <b>판정 도우미</b>에 단어를 넣어 확인하시오.</p>'+
        '</div></div>'+
        '<div class="lead" style="text-align:center">앱은 순서를 정하지 않소. 오직 출제·판정만 도울 뿐!</div>'+
        '<div class="spacer"></div>'+
        '<button class="btn btn-primary" data-action="rules-back">알겠소</button>'+
      '</div>';
    },

    setup:function(){
      var seg=function(action, opts){ return '<div class="seg">'+opts.map(function(o){ return '<button class="'+(o.on?'on':'')+'" data-action="'+action+'" data-v="'+o.v+'">'+o.t+'</button>'; }).join("")+'</div>'; };
      return '<div class="screen">'+
        '<div class="eyebrow">채 비</div>'+
        '<h2 class="sect-h">판을 차리시오</h2>'+
        '<div class="panel">'+
          '<div class="grp-label" style="margin-top:0">글자 수 (초성 개수)</div>'+
          seg("set-len",[{v:"2",t:"두 글자",on:S.len===2},{v:"3",t:"세 글자",on:S.len===3}])+
          '<div class="opt-row"><div class="nm">쌍자음도 출제<small>ㄲ ㄸ ㅃ ㅆ ㅉ 포함</small></div><div class="toggle '+(S.ssang?'on':'')+'" data-action="toggle-ssang"></div></div>'+
        '</div>'+
        '<div class="lead" style="text-align:center">동시에 단어를 외치며 엄지를 잡으시오! 끝내 못 외친 마지막 팀이 지는 것이오.</div>'+
        '<div class="spacer" style="min-height:12px"></div>'+
        '<div class="row">'+
          '<button class="btn btn-ghost" data-action="to-home" style="flex:.5">돌아가기</button>'+
          '<button class="btn btn-primary" data-action="begin" style="flex:1.6">개시!</button>'+
        '</div>'+
      '</div>';
    },

    play:function(){
      var g=S.game;
      var roundTag='<div class="round-tag">제 '+g.round+' 판</div>';

      if(g.stage==="ready"){
        return '<div class="screen">'+roundTag+
          '<div class="center" style="gap:16px">'+
            '<div style="font-size:52px">🥁</div>'+
            '<div class="chant" style="font-size:clamp(26px,8vw,38px)">모두 엄지를 내미시오</div>'+
            '<div class="lead">준비되었으면 북을 울리시오.<br>구호가 끝나면 초성이 나타나오!</div>'+
            '<div class="stack" style="width:100%; max-width:320px">'+
              '<button class="btn btn-primary" data-action="chant">북을 울려라 🥁</button>'+
            '</div>'+
          '</div>'+
          '<button class="btn btn-ghost btn-sm" data-action="to-home" style="margin-top:8px">그만하기</button>'+
        '</div>';
      }
      if(g.stage==="chant"){
        return '<div class="screen">'+roundTag+
          '<div class="center" data-action="skip-chant" style="cursor:pointer">'+
            '<div class="chant" id="chantTxt">훈민정~음</div>'+
            '<div class="lead" style="margin-top:10px">(다 같이 외치시오!)</div>'+
          '</div>'+
        '</div>';
      }
      // reveal + 판정 도우미
      var choBoxes='<div class="cho-disp">'+g.targets.map(function(t){ return '<div class="cho-box">'+t+'</div>'; }).join("")+'</div>';
      var shout = '<div class="shout-label">동시에 단어를 외치며 엄지를 잡으시오!</div>';
      var timeRow = '';
      var chips = g.used.length? g.used.map(function(w){ return '<span class="used-chip">'+esc(w)+'</span>'; }).join("") : '<span class="used-empty">확인한 단어가 아직 없소</span>';
      return '<div class="screen">'+roundTag+
        choBoxes+
        shout+
        timeRow+
        '<div class="panel" style="margin-top:8px">'+
          '<div class="judge-h" style="margin-top:0"><span class="t">⚖️ 판정 도우미 — 외친 단어를 확인</span></div>'+
          '<input class="word-input" id="wordInput" type="text" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="다툼이 난 단어 입력">'+
          '<button class="btn btn-primary btn-sm" data-action="check" style="margin-top:9px">판정!</button>'+
          '<div class="feedback" id="feedback"></div>'+
          '<div class="judge-h"><span class="t">이번 판에 인정된 단어</span></div>'+
          '<div class="used-wrap" id="usedChips">'+chips+'</div>'+
        '</div>'+
        '<div class="row" style="margin-top:4px">'+
          '<button class="btn btn-ghost btn-sm" data-action="to-home" style="flex:.6">그만</button>'+
          '<button class="btn btn-red btn-sm" data-action="next-round" style="flex:1.4">다음 판 — 새 초성 🥁</button>'+
        '</div>'+
      '</div>';
    }
  };

  /* =========================================================
     GAME FLOW (동시 대결: 앱 = 출제 + 판정)
  ========================================================= */
  function begin(){
    S.game={ targets:drawTargets(S.len,S.ssang), used:[], usedSet:{}, round:1, stage:"ready", cdLeft:S.cd, timeUp:false };
    saveCfg(); SFX.tap(); go("play");
  }
  function chant(){
    var g=S.game; g.stage="chant"; render();
    if(chantInt) clearInterval(chantInt);
    stopChantAudio();
    if(S.sound && chantAudio && chantState!=="failed"){
      try{
        try{ chantAudio.currentTime=0; }catch(e){}
        var done=false;
        var finish=function(){ if(done) return; done=true; if(chantTimeout){clearTimeout(chantTimeout); chantTimeout=null;} try{ chantAudio.onended=null; }catch(e){} reveal(); };
        chantAudio.onended=finish;
        var dur=chantAudio.duration;
        var wait=(isFinite(dur)&&dur>0)? (dur*1000+500) : 5000;   // onended 안전장치
        chantTimeout=setTimeout(finish, wait);
        var p=chantAudio.play();
        if(p && p.catch){ p.catch(function(){ if(chantTimeout){clearTimeout(chantTimeout); chantTimeout=null;} try{ chantAudio.onended=null; }catch(e){} synthChant(); }); }
        return;
      }catch(e){ /* 합성음으로 폴백 */ }
    }
    synthChant();
  }
  function synthChant(){
    SFX.drum();
    var beats=["훈민정~음","훈민정~음!"], i=0;
    if(chantInt) clearInterval(chantInt);
    chantInt=setInterval(function(){
      i++;
      if(i>=beats.length){ clearInterval(chantInt); chantInt=null; reveal(); return; }
      var el=document.getElementById("chantTxt"); if(el) el.textContent=beats[i];
      SFX.drum();
    },820);
  }
  function reveal(){
    stopTimers();
    var g=S.game; g.stage="reveal"; g.timeUp=false; g.cdLeft=S.cd;
    SFX.gong(); render();
    if(S.cd>0) startCountdown();
  }
  function startCountdown(){
    var g=S.game;
    if(cdInt) clearInterval(cdInt);
    paintTimer();
    var lastSec=Math.ceil(g.cdLeft);
    cdInt=setInterval(function(){
      g.cdLeft-=0.1;
      if(g.cdLeft<=0){ g.cdLeft=0; clearInterval(cdInt); cdInt=null; g.timeUp=true; SFX.buzz(); render(); return; }
      var s=Math.ceil(g.cdLeft); if(s!==lastSec){ lastSec=s; if(s<=3) SFX.tick(); }
      paintTimer();
    },100);
  }
  function paintTimer(){
    var g=S.game; var bar=document.getElementById("timeBar"), num=document.getElementById("timeNum"); if(!bar||!num) return;
    var pct = S.cd>0 ? Math.max(0,(g.cdLeft/S.cd)*100) : 100;
    bar.style.width=pct+"%";
    num.textContent=Math.ceil(g.cdLeft)+"초";
    bar.style.background = pct<25 ? "linear-gradient(90deg,#b03a2e,#d0574a)" : "linear-gradient(90deg,var(--gold),var(--gold-l))";
  }
  function checkWord(raw){
    var g=S.game; if(!g || g.stage!=="reveal") return {ok:false};
    var res=validateWord(raw, g.targets, g.usedSet);
    var fb=document.getElementById("feedback"), inp=document.getElementById("wordInput");
    if(!res.ok){
      SFX.buzz();
      if(fb){ fb.textContent="✗ "+res.reason; fb.className="feedback bad"; }
    } else {
      g.used.push(res.word); g.usedSet[res.word]=1;
      SFX.ding();
      if(fb){ fb.textContent="✓ 인정! 올바른 단어요"; fb.className="feedback good"; }
      var uw=document.getElementById("usedChips");
      if(uw){ if(g.used.length===1) uw.innerHTML=""; var sp=document.createElement("span"); sp.className="used-chip"; sp.textContent=res.word; uw.appendChild(sp); uw.scrollTop=uw.scrollHeight; }
    }
    if(inp){ inp.value=""; inp.focus(); }
    return res;
  }
  function nextRound(){
    stopTimers();
    var g=S.game;
    g.targets=drawTargets(S.len,S.ssang); g.used=[]; g.usedSet={}; g.round++; g.timeUp=false; g.cdLeft=S.cd;
    chant();
  }
  function wireJudge(){
    var inp=document.getElementById("wordInput");
    if(inp){ inp.addEventListener("keydown", function(e){ if(e.key==="Enter"){ e.preventDefault(); doCheck(); } }); }
  }
  function doCheck(){ var inp=document.getElementById("wordInput"); if(!inp || !inp.value.trim()) return; checkWord(inp.value); }

  /* =========================================================
     ACTIONS
  ========================================================= */
  function handle(action, el){
    switch(action){
      case "sound-toggle": S.sound=!S.sound; saveCfg(); render(); if(S.sound) SFX.tap(); break;
      case "start": SFX.tap(); go("setup"); break;
      case "rules": SFX.tap(); go("rules"); break;
      case "rules-back": SFX.tap(); go("home"); break;
      case "to-home": stopTimers(); SFX.tap(); go("home"); break;

      case "set-len": S.len=parseInt(el.dataset.v,10); SFX.tap(); saveCfg(); render(); break;
      case "toggle-ssang": S.ssang=!S.ssang; SFX.tap(); saveCfg(); render(); break;
      case "begin": begin(); break;

      case "chant": chant(); break;
      case "skip-chant": stopTimers(); reveal(); break;
      case "check": doCheck(); break;
      case "next-round": nextRound(); break;
    }
  }
  app.addEventListener("click", function(e){ var el=e.target.closest("[data-action]"); if(!el) return; handle(el.dataset.action, el); });

  /* =========================================================
     EXPOSE FOR TESTS
  ========================================================= */
  window.App={
    S:S, go:go, handle:handle, render:render, begin:begin, chant:chant, reveal:reveal,
    checkWord:checkWord, nextRound:nextRound, stopTimers:stopTimers,
    validateWord:validateWord, choOf:choOf, drawTargets:drawTargets
  };

  initChantAudio();
  render();
})();
</script>
</body>
</html>
