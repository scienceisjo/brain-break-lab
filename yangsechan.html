    --f-disp:'Black Han Sans',sans-serif;
    --f-body:'Pretendard','Pretendard Variable',system-ui,sans-serif;
    --f-pixel:'Galmuri11',monospace;
    --f-jua:'Jua',sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{color-scheme:dark}
  html,body{margin:0;padding:0;min-height:100%}
  button,input,textarea,select{font-family:inherit; color:var(--text)}
  body{
    background:
      radial-gradient(120% 80% at 50% -10%, #241548 0%, rgba(36,21,72,0) 55%),
      radial-gradient(100% 70% at 110% 8%, rgba(255,180,63,.10) 0%, rgba(255,180,63,0) 50%),
      radial-gradient(100% 70% at -10% 22%, rgba(138,107,255,.12) 0%, rgba(138,107,255,0) 50%),
      var(--bg);
    color:var(--text); font-family:var(--f-body); overflow-x:hidden; -webkit-font-smoothing:antialiased;
  }
  /* 배경: 픽셀아트 우주 배경이 --bg-image 에 인라인. 끄려면 --bg-image:none; */
  #bgphoto{position:fixed; inset:0; z-index:-2; background-image:var(--bg-image); background-size:cover; background-position:center; background-repeat:no-repeat; image-rendering:crisp-edges; image-rendering:-moz-crisp-edges; image-rendering:pixelated}
  #bgphoto::before{content:""; position:absolute; inset:0; background:repeating-linear-gradient(0deg, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.10) 2px 3px); pointer-events:none}
  #bgphoto::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(7,6,18,.58) 0%, rgba(7,6,18,.70) 55%, rgba(7,6,18,.84) 100%)}
  #stars{position:fixed; inset:0; width:100%; height:100%; z-index:-1; display:block}
  .wrap{max-width:560px; margin:0 auto; padding:22px 18px 40px; min-height:100vh; display:flex; flex-direction:column}

  .bar{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px}
  .brand{display:flex; align-items:center; gap:9px}
  .dot{width:10px; height:10px; border-radius:50%; background:var(--amber); box-shadow:0 0 12px var(--amber); animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .brand b{font-family:var(--f-pixel); font-size:12px; letter-spacing:1px; color:var(--muted); font-weight:400}
  .sound-btn{border:1px solid var(--line); background:rgba(255,255,255,.04); color:var(--muted); width:40px; height:34px; border-radius:10px; font-size:15px; cursor:pointer; transition:.15s}
  .sound-btn:active{transform:scale(.94)}

  .screen{flex:1; display:flex; flex-direction:column; animation:rise .42s cubic-bezier(.16,1,.3,1)}
  @keyframes rise{from{opacity:0; transform:translateY(16px)}to{opacity:1; transform:translateY(0)}}
  .center{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:14px}
  .spacer{flex:1}

  .eyebrow{font-family:var(--f-pixel); font-size:11px; letter-spacing:2px; color:var(--amber); text-transform:uppercase; opacity:.9}
  h1.title{font-family:var(--f-disp); font-size:clamp(30px,9.5vw,48px); line-height:1.15; margin:6px 0 4px; letter-spacing:-.5px; color:#ffe7bd}
  @supports ((-webkit-background-clip:text) or (background-clip:text)){
    h1.title{background:linear-gradient(120deg,#fff 0%, var(--amber) 46%, var(--purple) 100%); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:transparent; text-shadow:0 0 38px rgba(255,180,63,.25)}
  }
  .tag{font-family:var(--f-jua); color:var(--muted); font-size:16px; margin:2px 0 0}
  .sect-h{font-family:var(--f-disp); font-size:26px; margin:2px 0 4px}
  .lead{color:var(--muted); font-size:14px; line-height:1.55}
  .grp-label{font-family:var(--f-pixel); font-size:11px; letter-spacing:1.5px; color:var(--purple); margin:14px 0 2px; text-transform:uppercase}

  .btn{display:flex; align-items:center; justify-content:center; gap:8px; width:100%; border:none; border-radius:16px; padding:17px 18px; font-family:var(--f-disp); font-size:20px; letter-spacing:.5px; cursor:pointer; color:#241100; transition:transform .12s, box-shadow .2s, filter .2s; text-align:center}
  .btn:active{transform:translateY(2px) scale(.99)}
  .btn-primary{background:linear-gradient(120deg,var(--amber),var(--gold)); box-shadow:0 8px 30px rgba(255,180,63,.32), inset 0 1px 0 rgba(255,255,255,.4)}
  .btn-purple{background:linear-gradient(120deg,var(--purple),#a98bff); color:#fff; box-shadow:0 8px 30px rgba(138,107,255,.32)}
  .btn-correct{background:linear-gradient(120deg,var(--cyan),#5ad7ff); color:#06121a; box-shadow:0 8px 24px rgba(44,232,214,.3)}
  .btn-wrong{background:rgba(255,255,255,.06); border:1px solid var(--line); color:var(--text); box-shadow:none}
  .btn-ghost{background:rgba(255,255,255,.05); border:1px solid var(--line); color:var(--text); font-family:var(--f-jua); font-size:16px; letter-spacing:0; box-shadow:none}
  .btn-ghost:active{background:rgba(255,255,255,.09)}
  .btn-sm{padding:12px 14px; font-size:16px; border-radius:13px}
  .stack{display:flex; flex-direction:column; gap:11px}
  .row{display:flex; gap:11px}
  .row>*{flex:1}

  .panel{background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:18px; backdrop-filter:blur(8px); margin:10px 0}
  .chip-num{display:inline-flex; align-items:center; justify-content:center; min-width:24px; height:24px; padding:0 7px; border-radius:8px; background:rgba(138,107,255,.20); border:1px solid var(--line); color:var(--amber); font-family:var(--f-pixel); font-size:12px}

  .pack-list{display:flex; flex-direction:column; gap:9px}
  .pack-card{display:flex; align-items:center; gap:12px; padding:14px; border-radius:14px; border:1px solid var(--line); background:rgba(255,255,255,.035); cursor:pointer; transition:.15s; text-align:left; color:var(--text); width:100%}
  .pack-card:active{transform:scale(.99)}
  .pack-card.on{border-color:var(--amber); background:linear-gradient(120deg,rgba(255,180,63,.14),rgba(138,107,255,.10)); box-shadow:0 0 0 1px var(--amber) inset}
  .pack-ico{font-size:24px; flex:none}
  .pack-meta{flex:1; min-width:0}
  .pack-nm{font-family:var(--f-jua); font-size:16px}
  .pack-card.on .pack-nm{color:var(--amber)}
  .pack-ct{font-size:11px; color:var(--muted); font-family:var(--f-pixel); margin-top:1px}
  .pack-sample{font-size:11px; color:var(--muted); margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-family:var(--f-body)}

  .opt-row{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 0; border-top:1px solid rgba(138,107,255,.16)}
  .opt-row:first-child{border-top:none}
  .opt-row .nm{font-family:var(--f-jua); font-size:15px}
  .opt-row .nm small{display:block; color:var(--muted); font-size:11px; font-family:var(--f-body)}
  .toggle{width:54px; height:30px; border-radius:30px; border:1px solid var(--line); background:rgba(255,255,255,.06); position:relative; cursor:pointer; transition:.2s; flex:none}
  .toggle::after{content:""; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:var(--muted); transition:.2s}
  .toggle.on{background:rgba(255,180,63,.25); border-color:var(--amber)}
  .toggle.on::after{left:27px; background:var(--amber); box-shadow:0 0 10px var(--amber)}

  /* play */
  .prog-wrap{display:flex; align-items:center; gap:10px; margin-bottom:4px}
  .prog-bar{flex:1; height:8px; border-radius:6px; background:rgba(255,255,255,.06); overflow:hidden}
  .prog-fill{height:100%; border-radius:6px; background:linear-gradient(90deg,var(--purple),var(--amber)); transition:width .4s cubic-bezier(.16,1,.3,1)}
  .prog-txt{font-family:var(--f-pixel); font-size:12px; color:var(--muted); flex:none}
  .fore-emoji{font-size:54px}
  .fore-t{font-family:var(--f-disp); font-size:clamp(30px,9vw,44px); color:#fff2d8; line-height:1}
  .fore-d{font-family:var(--f-jua); font-size:15px; color:var(--muted); line-height:1.6; max-width:330px}
  .fore-d b{color:var(--amber)}
  .cd{font-family:var(--f-disp); font-size:clamp(96px,32vw,160px); line-height:1; color:var(--amber); text-shadow:0 0 40px rgba(255,180,63,.35); animation:pop .3s}
  @keyframes pop{from{transform:scale(.6); opacity:.4}to{transform:scale(1); opacity:1}}
  .name-show{background:linear-gradient(160deg,rgba(255,180,63,.17),rgba(24,18,42,.92)); border:1px solid var(--amber); border-radius:22px; padding:36px 22px; text-align:center; box-shadow:0 0 50px rgba(255,180,63,.22); margin:6px 0; min-height:170px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; animation:cardIn .4s cubic-bezier(.16,1,.3,1)}
  @keyframes cardIn{from{opacity:0; transform:scale(.94)}to{opacity:1; transform:scale(1)}}
  .ns-label{font-family:var(--f-pixel); font-size:12px; letter-spacing:2px; color:var(--amber)}
  .ns-name{font-family:var(--f-disp); font-size:clamp(38px,11.5vw,66px); line-height:1.08; color:#fff2d8; word-break:keep-all}
  .remind{background:rgba(138,107,255,.14); border:1px solid var(--line); border-radius:13px; padding:12px 14px; text-align:center; font-family:var(--f-jua); font-size:15px; color:#e9e4ff; line-height:1.5}
  .remind b{color:var(--amber)}
  .score-mini{font-family:var(--f-pixel); font-size:12px; color:var(--muted); text-align:center; margin-top:8px}
  .score-mini b{color:var(--cyan)}

  .verdict{text-align:center; padding:6px 0}
  .verdict .big{font-family:var(--f-disp); font-size:clamp(46px,15vw,72px); line-height:1; color:var(--amber); text-shadow:0 0 36px rgba(255,180,63,.3)}
  .verdict .sub{font-family:var(--f-jua); color:var(--muted); font-size:15px; margin-top:4px}
  .recap{max-height:230px; overflow:auto; margin-top:4px}
  .recap-row{display:flex; gap:9px; align-items:center; padding:8px 0; border-top:1px solid rgba(138,107,255,.14); font-size:14px; line-height:1.3}
  .recap-row:first-child{border-top:none}
  .recap-n{flex:none; font-family:var(--f-pixel); color:var(--purple); font-size:12px; min-width:22px}
  .recap-q{flex:1; color:var(--text); font-family:var(--f-jua)}
  .recap-s{flex:none; font-size:15px}

  .pill-tabs{display:flex; gap:6px; margin:10px 0 2px}
  .pill-tabs button{flex:1; border:1px solid var(--line); background:rgba(255,255,255,.04); color:var(--muted); padding:8px; border-radius:10px; font-family:var(--f-jua); font-size:13px; cursor:pointer}
  .pill-tabs button.on{background:var(--purple); color:#fff; border-color:var(--purple)}
  .custom-item{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:11px 13px; border-radius:12px; border:1px solid var(--line); background:rgba(255,255,255,.03); margin-bottom:8px}
  .ci-nm{font-family:var(--f-jua); font-size:15px}
  .ci-ct{font-size:11px; color:var(--muted); font-family:var(--f-pixel)}
  .ci-actions{display:flex; gap:6px}
  .mini-btn{border:1px solid var(--line); background:rgba(255,255,255,.05); color:var(--muted); border-radius:9px; padding:6px 10px; font-size:12px; font-family:var(--f-pixel); cursor:pointer}
  .del-btn{border:1px solid rgba(255,53,127,.4); background:rgba(255,53,127,.08); color:var(--magenta); border-radius:9px; padding:6px 10px; font-size:12px; font-family:var(--f-pixel); cursor:pointer}
  .empty{text-align:center; color:var(--muted); font-family:var(--f-jua); padding:20px; font-size:14px}
  .inp{width:100%; border-radius:12px; border:1px solid var(--line); background:rgba(255,255,255,.04); color:var(--text); font-family:var(--f-jua); font-size:16px; padding:12px}
  .ta{width:100%; min-height:110px; border-radius:13px; border:1px solid var(--line); background:rgba(255,255,255,.04); color:var(--text); font-family:var(--f-body); font-size:14px; padding:11px; resize:vertical}
  .inp::placeholder,.ta::placeholder{color:rgba(195,191,228,.55)}
  .dropzone{border:1.5px dashed var(--line); border-radius:14px; padding:18px 14px; text-align:center; background:rgba(255,255,255,.03); cursor:pointer; transition:.15s}
  .dropzone.drag{border-color:var(--amber); background:rgba(255,180,63,.10)}
  .dz-ico{font-size:24px} .dz-t{font-family:var(--f-jua); font-size:15px; margin-top:3px} .dz-s{font-size:11px; color:var(--muted); font-family:var(--f-pixel); margin-top:2px}
  .or-divider{display:flex; align-items:center; gap:10px; color:var(--muted); font-family:var(--f-pixel); font-size:11px; margin:2px 0}
  .or-divider::before,.or-divider::after{content:""; flex:1; height:1px; background:var(--line)}
  .prev-stat{display:flex; gap:8px; margin-bottom:10px}
  .prev-pill{flex:1; text-align:center; border-radius:12px; padding:9px; border:1px solid var(--line); font-family:var(--f-jua); font-size:12px; color:var(--muted)}
  .prev-pill .n{font-family:var(--f-disp); font-size:24px; display:block; line-height:1}
  .prev-pill.add{background:rgba(44,232,214,.10); border-color:var(--cyan)} .prev-pill.add .n{color:var(--cyan)}
  .prev-pill.skip{background:rgba(255,53,127,.08)} .prev-pill.skip .n{color:var(--magenta)}
  .prev-list{max-height:150px; overflow:auto; font-size:12px; font-family:var(--f-pixel); color:var(--muted); line-height:1.8; margin-top:2px}
  .name-tag{display:inline-block; background:rgba(138,107,255,.16); border:1px solid var(--line); border-radius:6px; padding:1px 8px; margin:3px 3px 0 0; color:var(--text); font-family:var(--f-body); font-size:11px}
  .skip-row b{color:var(--magenta)}
  .toast{background:rgba(255,180,63,.14); border:1px solid var(--amber); color:#ffe7bd; border-radius:12px; padding:11px 13px; font-family:var(--f-jua); font-size:14px; margin-bottom:10px; animation:rise .3s}
  .err-box{background:rgba(255,53,127,.10); border:1px solid var(--magenta); color:#ffe1ec; border-radius:12px; padding:11px 13px; font-family:var(--f-jua); font-size:13px; margin-top:8px}
  .footer-note{font-family:var(--f-pixel); font-size:10px; color:rgba(195,191,228,.5); text-align:center; margin-top:16px; letter-spacing:1px}

  @media (max-width:360px){ .wrap{padding:16px 13px 34px} }
  @media (prefers-reduced-motion:reduce){ *{animation-duration:.001s !important; transition-duration:.05s !important} }
</style>
</head>
<body>
<div id="bgphoto"></div>
<canvas id="stars"></canvas>
<div class="wrap">
  <div class="bar">
    <div class="brand"><span class="dot"></span><b>CLASS GAME WORLD</b></div>
    <button class="sound-btn" data-action="sound-toggle" id="soundBtn" title="소리">🔊</button>
  </div>
  <div id="app"></div>
</div>

<script>
(function(){
  "use strict";

  /* =========================================================
     DATA — 인물 카테고리 (이마에 붙일 이름 풀)
  ========================================================= */
  var PACKS=[
    {id:"hero", name:"위인·인물", ico:"👑", items:["세종대왕","이순신","신사임당","에디슨","아인슈타인","링컨","나폴레옹","뉴턴","콜럼버스","헬렌 켈러","유관순","장영실","안중근","마리 퀴리","간디","베토벤"]},
    {id:"char", name:"캐릭터", ico:"🦸", items:["뽀로로","피카츄","도라에몽","짱구","스폰지밥","미키마우스","헬로키티","곰돌이 푸","슈퍼마리오","엘사","아이언맨","스파이더맨","배트맨","미니언","라이언","뿌까"]},
    {id:"star", name:"유명인", ico:"🎤", items:["유재석","강호동","아이유","손흥민","김연아","페이커","박명수","백종원","펭수","침착맨","카리나","장원영","뷔","제니","이강인","안유진"]},
    {id:"job", name:"직업", ico:"👮", items:["의사","소방관","경찰관","요리사","가수","축구선수","유튜버","선생님","개그맨","화가","우주비행사","마술사","배우","과학자","운동선수","아이돌"]},
    {id:"animal", name:"동물", ico:"🦁", items:["사자","호랑이","기린","코끼리","펭귄","판다","토끼","고양이","강아지","원숭이","코알라","악어","상어","돌고래","부엉이","캥거루"]}
  ];

  /* =========================================================
     STORAGE
  ========================================================= */
  var LS_POOLS="cmn_pools_v1", LS_CFG="cmn_cfg_v1";
  function loadPools(){ try{ return JSON.parse(localStorage.getItem(LS_POOLS))||[]; }catch(e){ return []; } }
  function savePools(a){ try{ localStorage.setItem(LS_POOLS, JSON.stringify(a)); }catch(e){} }
  function loadCfg(){ try{ return JSON.parse(localStorage.getItem(LS_CFG))||{}; }catch(e){ return {}; } }
  function saveCfg(){ try{ localStorage.setItem(LS_CFG, JSON.stringify({ poolId:S.poolId, shuffle:S.shuffle, sound:S.sound })); }catch(e){} }
  function allPools(){ return PACKS.concat(loadPools().map(function(p){ return {id:p.id, name:p.name, ico:"✏️", items:p.items, custom:true}; })); }
  function poolById(id){ var a=allPools(); for(var i=0;i<a.length;i++){ if(a[i].id===id) return a[i]; } return null; }

  /* =========================================================
     SOUND
  ========================================================= */
  var actx=null;
  function ac(){ if(actx) return actx; try{ var C=window.AudioContext||window.webkitAudioContext; actx=C?new C():null; }catch(e){ actx=null; } return actx; }
  function tone(freq,dur,type,vol,when){
    if(!S.sound) return; var c=ac(); if(!c) return;
    try{ var t=c.currentTime+(when||0); var o=c.createOscillator(), g=c.createGain();
      o.type=type||"sine"; o.frequency.setValueAtTime(freq,t);
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.15,t+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+0.02);
    }catch(e){}
  }
  var SFX={
    tap:function(){ tone(520,.07,"triangle",.1); },
    next:function(){ tone(440,.09,"square",.1); tone(620,.09,"square",.09,.05); },
    beep:function(){ tone(820,.08,"square",.11); },
    reveal:function(){ tone(660,.1,"triangle",.14); tone(990,.12,"triangle",.12,.08); },
    correct:function(){ [660,880,1170].forEach(function(f,i){ tone(f,.12,"triangle",.13,i*0.07); }); },
    pass:function(){ tone(300,.14,"sine",.11); tone(220,.16,"sine",.09,.07); },
    win:function(){ [523,659,784,1047].forEach(function(f,i){ tone(f,.16,"triangle",.14,i*0.1); }); },
    lose:function(){ [392,330,262].forEach(function(f,i){ tone(f,.2,"sawtooth",.12,i*0.12); }); }
  };

  /* =========================================================
     STARFIELD (auto-off when bg image is set)
  ========================================================= */
  function starfield(){
    var cv=document.getElementById("stars"); if(!cv) return;
    try{ var v=getComputedStyle(document.documentElement).getPropertyValue("--bg-image"); if(v && v.indexOf("url(")>=0){ cv.style.display="none"; return; } }catch(e){}
    var ctx=null; try{ ctx=cv.getContext("2d"); }catch(e){} if(!ctx) return;
    var stars=[], W,H,DPR=Math.min(window.devicePixelRatio||1,2);
    function size(){ W=cv.width=innerWidth*DPR; H=cv.height=innerHeight*DPR; cv.style.width=innerWidth+"px"; cv.style.height=innerHeight+"px"; build(); }
    function build(){ stars=[]; var n=Math.round((innerWidth*innerHeight)/9000); for(var i=0;i<n;i++){ stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4*DPR+.3,a:Math.random(),s:Math.random()*.02+.004,t:Math.random()<.15}); } }
    function loop(){ ctx.clearRect(0,0,W,H); for(var i=0;i<stars.length;i++){ var st=stars[i]; st.a+=st.s; var al=.4+Math.sin(st.a)*.4; ctx.beginPath(); ctx.fillStyle= st.t?"rgba(255,180,63,"+al+")":"rgba(255,255,255,"+al+")"; ctx.arc(st.x,st.y,st.r,0,6.283); ctx.fill(); } requestAnimationFrame(loop); }
    try{ size(); window.addEventListener("resize",size); requestAnimationFrame(loop); }catch(e){}
  }

  /* =========================================================
     STATE
  ========================================================= */
  var saved=loadCfg();
  var S={
    screen:"home",
    poolId: saved.poolId||"hero",
    shuffle: (saved.shuffle!=null)? saved.shuffle : true,
    sound: (saved.sound!=null)? saved.sound : true,
    poolName:"",
    play:{ names:[], idx:0, ok:0, pass:0, stage:"ready", cd:3, results:[] },
    tab:"list", up:{ preview:false, add:[], skipped:[], error:"", name:"" }, toast:""
  };

  /* =========================================================
     HELPERS / RENDER
  ========================================================= */
  var app=document.getElementById("app");
  var turnInt=null;
  function esc(s){ return String(s).replace(/[&<>"]/g,function(m){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m]; }); }
  function go(scr){ S.screen=scr; render(); }
  function render(){ app.innerHTML = SCREENS[S.screen]? SCREENS[S.screen]() : "<div class='empty'>오류</div>"; document.getElementById("soundBtn").textContent = S.sound?"🔊":"🔇"; window.scrollTo(0,0); if(S.screen==="packs") wireUpload(); }
  function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var k=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[k]; a[k]=t; } return a; }

  /* =========================================================
     SCREENS
  ========================================================= */
  var SCREENS={
    home:function(){
      return '<div class="screen center" style="gap:10px">'+
        '<div class="eyebrow">양세찬 게임 · 이마에 대고 맞히기</div>'+
        '<h1 class="title">콜 마이<br>네임</h1>'+
        '<p class="tag">폰을 이마에 대고, 내가 누군지 맞혀라!</p>'+
        '<div class="stack" style="width:100%; max-width:320px; margin-top:22px">'+
          '<button class="btn btn-primary" data-action="start">게임 시작</button>'+
          '<div class="row">'+
            '<button class="btn btn-ghost btn-sm" data-action="rules">게임 방법</button>'+
            '<button class="btn btn-ghost btn-sm" data-action="packs">인물 관리</button>'+
          '</div>'+
          '<a href="https://scienceisjo.github.io/brain-break-lab/sonic" class="btn btn-ghost btn-sm" style="text-decoration:none; background:rgba(138,107,255,.14); border-color:var(--purple); color:#fff">🕹️ CLASS GAME WORLD</a>'+
        '</div>'+
        '<div class="footer-note">폰 1대를 돌려가며 · 화면이 친구들을 향하게!<br>제작 · 해누리중학교 조승재</div>'+
      '</div>';
    },

    rules:function(){
      return '<div class="screen">'+
        '<div class="eyebrow">HOW TO PLAY</div>'+
        '<h2 class="sect-h">게임 방법</h2>'+
        '<div class="panel"><div style="font-size:14px; color:var(--text); line-height:1.7">'+
          '<p style="margin:0 0 10px"><span class="chip-num">1</span> 차례가 된 사람은 폰을 <b style="color:var(--amber)">이마에 대요</b>. 화면이 <b style="color:var(--amber)">친구들 쪽</b>을 향하게! (본인은 못 봐요)</p>'+
          '<p style="margin:0 0 10px"><span class="chip-num">2</span> 3초 뒤 인물이 나타나요. 친구들에게 <b>예/아니오 질문</b>을 던져서 내가 누군지 알아냅니다.</p>'+
          '<p style="margin:0 0 10px"><span class="chip-num">3</span> 친구들은 <b>거짓말은 안 되지만 애매하게</b> 답할 수 있어요. (예: 세종대왕 → \u201c남자야?\u201d → \u201c음… 남자인 것 같긴 한데 애매해\u201d 😆)</p>'+
          '<p style="margin:0"><span class="chip-num">4</span> 맞히면 <b style="color:var(--cyan)">⭕</b>, 모르겠으면 <b>⏭ 패스</b>. 다음 사람에게 폰을 넘겨요!</p>'+
        '</div></div>'+
        '<div class="spacer"></div>'+
        '<button class="btn btn-primary" data-action="rules-back">알겠어요</button>'+
      '</div>';
    },

    setup:function(){
      var pools=allPools();
      var cards=pools.map(function(p){
        var sample=p.items.slice(0,3).join(", ");
        return '<button class="pack-card '+(S.poolId===p.id?'on':'')+'" data-action="pick-pool" data-pool="'+p.id+'">'+
          '<span class="pack-ico">'+p.ico+'</span>'+
          '<span class="pack-meta"><span class="pack-nm">'+esc(p.name)+'</span><span class="pack-ct">'+p.items.length+'명</span><span class="pack-sample">'+esc(sample)+'</span></span>'+
        '</button>';
      }).join("");
      var sel=poolById(S.poolId);
      var canStart = sel && sel.items.length>=1;
      return '<div class="screen">'+
        '<div class="eyebrow">SETUP</div>'+
        '<h2 class="sect-h">인물 카테고리</h2>'+
        '<div class="pack-list">'+cards+'</div>'+
        '<div class="panel">'+
          '<div class="opt-row"><div class="nm">순서 섞기<small>인물 순서를 매번 랜덤으로</small></div><div class="toggle '+(S.shuffle?'on':'')+'" data-action="toggle-shuffle"></div></div>'+
        '</div>'+
        (canStart? '' : '<div class="err-box">인물이 1명 이상 있어야 시작할 수 있어요.</div>')+
        '<div class="spacer" style="min-height:12px"></div>'+
        '<div class="row">'+
          '<button class="btn btn-ghost" data-action="to-home" style="flex:.5">홈</button>'+
          '<button class="btn btn-primary" data-action="begin" style="flex:1.6'+(canStart?'':';opacity:.45;pointer-events:none')+'">시작하기</button>'+
        '</div>'+
      '</div>';
    },

    play:function(){
      var pl=S.play, total=pl.names.length, i=pl.idx;
      var prog=Math.round((i/Math.max(1,total))*100);
      var progTxt=(i+1)+' / '+total;
      var progBar='<div class="prog-wrap"><div class="prog-txt">'+progTxt+'</div><div class="prog-bar"><div class="prog-fill" style="width:'+prog+'%"></div></div></div>';
      var quitRow='<div class="spacer"></div><div class="row" style="margin-top:8px"><button class="btn btn-ghost btn-sm" data-action="quit">그만하고 결과 보기</button></div>';

      if(pl.stage==="ready"){
        return '<div class="screen">'+progBar+
          '<div class="center" style="gap:16px">'+
            '<div class="fore-emoji">🙆</div>'+
            '<div class="fore-t">'+(i+1)+'번째 차례</div>'+
            '<div class="fore-d">폰을 <b>이마에 대세요</b>! 화면이 <b>친구들 쪽</b>을 향하게.<br>준비되면 아래를 누르면 3초 뒤 인물이 나와요.</div>'+
            '<div class="stack" style="width:100%; max-width:320px">'+
              '<button class="btn btn-primary" data-action="start-turn">시작 (3초 뒤 공개)</button>'+
            '</div>'+
          '</div>'+
          quitRow+
        '</div>';
      }
      if(pl.stage==="count"){
        return '<div class="screen">'+progBar+
          '<div class="center" style="gap:10px"><div class="cd">'+pl.cd+'</div><div class="fore-d">이마에 대고 있어요!</div></div>'+
        '</div>';
      }
      // show
      return '<div class="screen">'+progBar+
        '<div class="name-show"><div class="ns-label">내 인물은?</div><div class="ns-name">'+esc(pl.names[i])+'</div></div>'+
        '<div class="remind">친구들이 <b>예 / 아니오</b>로 답해줘요.<br>질문해서 내가 누군지 맞혀보세요!</div>'+
        '<div class="row" style="margin-top:12px">'+
          '<button class="btn btn-wrong btn-sm" data-action="mark" data-ok="0">⏭ 패스</button>'+
          '<button class="btn btn-correct btn-sm" data-action="mark" data-ok="1">⭕ 맞혔어요</button>'+
        '</div>'+
        '<div class="score-mini">맞힘 <b>'+pl.ok+'</b> · 패스 '+pl.pass+'</div>'+
        quitRow+
      '</div>';
    },

    result:function(){
      var pl=S.play; var tried=pl.results.length; var tot=tried||pl.names.length; var ok=pl.ok;
      var pct = tried? Math.round((ok/tried)*100) : 0;
      var msg = tried===0? "아직 아무도 안 했어요!" : pct>=90? "천재적인 눈치! 🥇" : pct>=60? "제법인데요! 👏" : pct>=30? "조금 아쉬워요 😅" : "다음엔 더 잘할 거예요 🙂";
      var recap=pl.results.map(function(r,i){ return '<div class="recap-row"><span class="recap-n">'+(i+1)+'</span><span class="recap-q">'+esc(r.name)+'</span><span class="recap-s">'+(r.ok?'⭕':'⏭')+'</span></div>'; }).join("");
      return '<div class="screen">'+
        '<div class="eyebrow">RESULT</div>'+
        '<h2 class="sect-h">결과</h2>'+
        '<div class="panel verdict"><div class="big">'+ok+' / '+tot+'</div><div class="sub">'+msg+'</div></div>'+
        (tried? '<div class="panel"><div class="ci-ct" style="color:var(--purple); margin-bottom:4px">누가 뭐였나 (복습)</div><div class="recap">'+recap+'</div></div>' : '')+
        '<div class="spacer" style="min-height:8px"></div>'+
        '<div class="stack">'+
          '<button class="btn btn-primary" data-action="again">다시 하기 (같은 카테고리)</button>'+
          '<div class="row">'+
            '<button class="btn btn-ghost btn-sm" data-action="to-setup">다른 카테고리</button>'+
            '<button class="btn btn-ghost btn-sm" data-action="to-home">홈</button>'+
          '</div>'+
        '</div>'+
      '</div>';
    },

    packs:function(){
      var list=loadPools();
      var toast = S.toast? '<div class="toast">'+esc(S.toast)+'</div>' : '';
      var items = list.length? list.map(function(p,i){
        return '<div class="custom-item"><div><div class="ci-nm">✏️ '+esc(p.name)+'</div><div class="ci-ct">'+p.items.length+'명</div></div>'+
          '<div class="ci-actions"><button class="mini-btn" data-action="export-pool" data-idx="'+i+'">CSV</button><button class="del-btn" data-action="del-pool" data-idx="'+i+'">삭제</button></div></div>';
      }).join("") : '<div class="empty">아직 만든 카테고리가 없어요.<br>옆 \u2018새 카테고리\u2019에서 인물 이름을 올려보세요.</div>';

      var listTab='<div class="grp-label">기본 제공</div>'+
        PACKS.map(function(p){ return '<div class="custom-item"><div><div class="ci-nm">'+p.ico+' '+esc(p.name)+'</div><div class="ci-ct">'+p.items.length+'명 · 기본</div></div><button class="mini-btn" data-action="export-builtin" data-id="'+p.id+'">CSV</button></div>'; }).join("")+
        '<div class="grp-label">내 카테고리</div><div class="panel" style="margin-top:4px">'+items+'</div>';

      var u=S.up, addTab;
      if(u.preview){
        addTab=previewPanel();
      } else {
        addTab='<div class="panel">'+
            '<input class="inp" id="poolName" placeholder="카테고리 이름 (예: 우리 반 친구들)" maxlength="24" value="'+esc(u.name||"")+'">'+
            '<button class="btn btn-primary btn-sm" data-action="tpl-download" style="margin-top:10px">① 양식(CSV) 다운로드</button>'+
            '<p class="lead" style="margin:-2px 0 0">인물 이름을 <b>한 줄에 하나씩</b> (또는 쉼표로 구분).</p>'+
            '<div class="dropzone" id="dropZone" data-action="file-pick" style="margin-top:8px"><div class="dz-ico">📂</div><div class="dz-t">② 파일 올리기</div><div class="dz-s">CSV · XLSX · 드래그앤드롭</div></div>'+
            '<input type="file" id="fileInput" accept=".csv,.xlsx,.xls,.txt" style="display:none">'+
            '<div class="or-divider">또는 직접 붙여넣기</div>'+
            '<textarea class="ta" id="pasteArea" placeholder="한 줄에 하나씩 인물 이름&#10;예)&#10;세종대왕&#10;피카츄&#10;유재석&#10;손흥민"></textarea>'+
            '<button class="btn btn-primary btn-sm" data-action="paste-preview" style="margin-top:10px">③ 미리보기</button>'+
            (u.error? '<div class="err-box">'+esc(u.error)+'</div>' : '')+
          '</div>';
      }

      return '<div class="screen">'+
        '<div class="eyebrow">NAME POOLS</div>'+
        '<h2 class="sect-h">인물 관리</h2>'+
        toast+
        '<div class="pill-tabs">'+
          '<button class="'+(S.tab==="list"?'on':'')+'" data-action="tab" data-t="list">카테고리</button>'+
          '<button class="'+(S.tab==="add"?'on':'')+'" data-action="tab" data-t="add">새 카테고리</button>'+
        '</div>'+
        (S.tab==="list"? listTab : addTab)+
        '<div class="spacer" style="min-height:12px"></div>'+
        '<button class="btn btn-ghost" data-action="to-home">홈으로</button>'+
      '</div>';
    }
  };

  /* =========================================================
     PLAY FLOW
  ========================================================= */
  function begin(){
    var p=poolById(S.poolId);
    if(!p || p.items.length<1){ p=PACKS[0]; S.poolId=PACKS[0].id; }
    S.poolName=p.name;
    var names=S.shuffle? shuffle(p.items) : p.items.slice();
    S.play={ names:names, idx:0, ok:0, pass:0, stage:"ready", cd:3, results:[] };
    saveCfg(); SFX.next(); go("play");
  }
  function startCountdown(){
    S.play.stage="count"; S.play.cd=3; SFX.beep(); render();
    if(turnInt) clearInterval(turnInt);
    turnInt=setInterval(function(){
      S.play.cd--;
      if(S.play.cd<=0){ clearInterval(turnInt); turnInt=null; S.play.stage="show"; SFX.reveal(); render(); }
      else { SFX.beep(); render(); }
    },1000);
  }
  function doMark(ok){
    if(turnInt){ clearInterval(turnInt); turnInt=null; }
    var pl=S.play; pl.results.push({name:pl.names[pl.idx], ok:ok});
    if(ok) pl.ok++; else pl.pass++;
    (ok?SFX.correct:SFX.pass)();
    pl.idx++; pl.stage="ready";
    if(pl.idx>=pl.names.length){ finish(); return; }
    render();
  }
  function finish(){ if(turnInt){ clearInterval(turnInt); turnInt=null; } var pl=S.play; (pl.results.length && pl.ok/pl.results.length>=0.6?SFX.win:SFX.lose)(); go("result"); }

  /* =========================================================
     CSV / UPLOAD (인물 이름 목록)
  ========================================================= */
  function parseCSV(text){
    if(text && text.charCodeAt(0)===0xFEFF) text=text.slice(1);
    var rows=[], row=[], field="", i=0, n=text.length, inQ=false;
    while(i<n){ var ch=text[i];
      if(inQ){ if(ch==='"'){ if(text[i+1]==='"'){ field+='"'; i+=2; continue; } inQ=false; i++; continue; } field+=ch; i++; continue; }
      if(ch==='"'){ inQ=true; i++; continue; }
      if(ch===','){ row.push(field); field=""; i++; continue; }
      if(ch==='\r'){ i++; continue; }
      if(ch==='\n'){ row.push(field); rows.push(row); row=[]; field=""; i++; continue; }
      field+=ch; i++; continue;
    }
    if(field!=="" || row.length>0){ row.push(field); rows.push(row); }
    return rows;
  }
  function csvCell(s){ s=String(s==null?"":s); return /[",\n\r]/.test(s)? '"'+s.replace(/"/g,'""')+'"' : s; }
  function downloadCSV(filename, text){
    try{ var blob=new Blob(["\uFEFF"+text],{type:"text/csv;charset=utf-8;"}); var url=URL.createObjectURL(blob);
      var a=document.createElement("a"); a.href=url; a.download=filename; document.body.appendChild(a); a.click();
      setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); },120);
    }catch(e){ alert("다운로드에 실패했어요: "+e.message); }
  }
  function templateCSV(){ return "이름\n세종대왕\n피카츄\n유재석\n손흥민\n"; }
  function itemsToText(items){ var lines=["이름"]; items.forEach(function(nm){ lines.push(csvCell(nm)); }); return lines.join("\n")+"\n"; }
  function namesFromRows(rows){ return rows.map(function(r){ return (r&&r[0]!=null)? String(r[0]) : ""; }); }
  function namesFromText(txt){ return txt.split(/[\n,，、]/); }

  function loadXLSX(cb){
    if(window.XLSX) return cb();
    var s=document.createElement("script"); s.src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js";
    s.onload=function(){ cb(); }; s.onerror=function(){ cb(new Error("엑셀(XLSX) 라이브러리를 불러오지 못했어요. 인터넷을 확인하거나 CSV로 올려주세요.")); };
    document.head.appendChild(s);
  }
  function rowsFromXLSX(buf){ var wb=XLSX.read(buf,{type:"array"}); var ws=wb.Sheets[wb.SheetNames[0]]; return XLSX.utils.sheet_to_json(ws,{header:1, raw:false, defval:""}); }

  function handleFile(file){
    S.up.error="";
    var name=(file.name||"").toLowerCase();
    if(/\.(xlsx|xls)$/.test(name)){
      var ra=new FileReader();
      ra.onload=function(){ loadXLSX(function(err){ if(err){ S.up.error=err.message; render(); return; } try{ computePreview(namesFromRows(rowsFromXLSX(ra.result))); }catch(e){ S.up.error="엑셀 파일을 읽지 못했어요: "+e.message; render(); } }); };
      ra.onerror=function(){ S.up.error="파일을 읽지 못했어요."; render(); };
      ra.readAsArrayBuffer(file);
    } else if(/\.(csv|txt)$/.test(name) || name===""){
      var rt=new FileReader();
      rt.onload=function(){ try{ computePreview(namesFromRows(parseCSV(String(rt.result||"")))); }catch(e){ S.up.error="CSV를 읽지 못했어요: "+e.message; render(); } };
      rt.onerror=function(){ S.up.error="파일을 읽지 못했어요."; render(); };
      rt.readAsText(file,"utf-8");
    } else { S.up.error="지원하지 않는 형식이에요. CSV 또는 XLSX 파일을 올려주세요."; render(); }
  }

  function computePreview(names){
    var catName=(S.up.name||"").trim();
    var builtinSet={}, customSet={};
    PACKS.forEach(function(p){ if(p.name===catName){ p.items.forEach(function(nm){ builtinSet[nm]=1; }); } });
    loadPools().forEach(function(p){ if(p.name===catName){ p.items.forEach(function(nm){ customSet[nm]=1; }); } });
    var add=[], skipped=[], seen={};
    for(var idx=0; idx<names.length; idx++){
      var line=idx+1, nm=String(names[idx]==null?"":names[idx]).trim();
      if(nm===""){ continue; }
      if(idx===0 && (nm==="이름"||nm.toLowerCase()==="name")) continue; // 헤더
      if(seen[nm]){ skipped.push({line:line, reason:"목록 안에서 중복"}); continue; }
      if(builtinSet[nm]){ skipped.push({line:line, reason:"기본 카테고리에 이미 있음"}); continue; }
      if(customSet[nm]){ skipped.push({line:line, reason:"이미 추가된 이름"}); continue; }
      seen[nm]=1; add.push(nm);
    }
    S.up.add=add; S.up.skipped=skipped; S.up.preview=true; S.up.error="";
    SFX.tap(); render();
  }

  function previewPanel(){
    var u=S.up, addN=u.add.length, skipN=u.skipped.length;
    var tags = addN? u.add.map(function(nm){ return '<span class="name-tag">'+esc(nm)+'</span>'; }).join("") : '<div class="empty" style="padding:8px">추가할 이름이 없어요.</div>';
    var skipHtml = skipN? '<div class="grp-label">건너뛴 행 '+skipN+'개</div><div class="prev-list">'+u.skipped.map(function(s){ return '<div class="skip-row"><b>'+s.line+'행</b> — '+esc(s.reason)+'</div>'; }).join("")+'</div>' : '';
    var nm=(u.name||"").trim();
    return '<div class="panel">'+
        '<div class="prev-stat">'+
          '<div class="prev-pill add"><span class="n">'+addN+'</span>추가될 인물</div>'+
          '<div class="prev-pill skip"><span class="n">'+skipN+'</span>건너뛸 행</div>'+
        '</div>'+
        '<div class="ci-ct" style="color:var(--purple); margin:2px 0 6px">카테고리: <b style="color:var(--text)">'+(nm?esc(nm):'(이름 없는 카테고리)')+'</b></div>'+
        '<div>'+tags+'</div>'+
        skipHtml+
        '<div class="row" style="margin-top:12px">'+
          '<button class="btn btn-ghost btn-sm" data-action="up-cancel" style="flex:.6">취소</button>'+
          '<button class="btn btn-primary btn-sm" data-action="up-confirm" style="flex:1.4'+(addN===0?';opacity:.45;pointer-events:none':'')+'">저장 ('+addN+'명)</button>'+
        '</div>'+
      '</div>';
  }

  function confirmSave(){
    var catName=(S.up.name||"").trim() || ("카테고리 "+(loadPools().length+1));
    var list=loadPools();
    var pool=null; for(var i=0;i<list.length;i++){ if(list[i].name===catName) pool=list[i]; }
    var newCat=false;
    if(!pool){ pool={id:"p"+Date.now()+Math.floor(Math.random()*100000), name:catName, items:[]}; list.push(pool); newCat=true; }
    var have={}; pool.items.forEach(function(n){ have[n]=1; });
    var added=0; S.up.add.forEach(function(n){ if(!have[n]){ pool.items.push(n); have[n]=1; added++; } });
    savePools(list); S.poolId=pool.id;
    S.toast="\u2018"+catName+"\u2019에 인물 "+added+"명"+(newCat?" (새 카테고리)":"")+" 저장했어요.";
    S.up={ preview:false, add:[], skipped:[], error:"", name:"" };
    S.tab="list"; SFX.win(); saveCfg(); render();
    setTimeout(function(){ if(S.toast){ S.toast=""; if(S.screen==="packs") render(); } }, 6000);
  }
  function cancelUp(){ S.up.preview=false; S.up.add=[]; S.up.skipped=[]; S.up.error=""; SFX.tap(); render(); }
  function delPool(idx){ var list=loadPools(); var rm=list[idx]; if(rm && rm.id===S.poolId) S.poolId="hero"; list.splice(idx,1); savePools(list); saveCfg(); SFX.tap(); render(); }

  function wireUpload(){
    var pn=document.getElementById("poolName");
    if(pn){ pn.addEventListener("input", function(){ S.up.name=pn.value; }); }
    var inp=document.getElementById("fileInput");
    if(inp){ inp.addEventListener("change", function(e){ var f=e.target.files&&e.target.files[0]; if(f){ handleFile(f); } e.target.value=""; }); }
    var dz=document.getElementById("dropZone");
    if(dz){
      ["dragenter","dragover"].forEach(function(ev){ dz.addEventListener(ev,function(e){ e.preventDefault(); e.stopPropagation(); dz.classList.add("drag"); }); });
      ["dragleave","dragend"].forEach(function(ev){ dz.addEventListener(ev,function(e){ e.preventDefault(); e.stopPropagation(); dz.classList.remove("drag"); }); });
      dz.addEventListener("drop", function(e){ e.preventDefault(); e.stopPropagation(); dz.classList.remove("drag"); var f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0]; if(f) handleFile(f); });
    }
  }

  /* =========================================================
     ACTIONS
  ========================================================= */
  function handle(action, el){
    switch(action){
      case "sound-toggle": S.sound=!S.sound; saveCfg(); render(); if(S.sound) SFX.tap(); break;
      case "start": SFX.tap(); go("setup"); break;
      case "rules": SFX.tap(); go("rules"); break;
      case "rules-back": SFX.tap(); go("home"); break;
      case "packs": SFX.tap(); S.tab="list"; S.toast=""; S.up.preview=false; S.up.error=""; go("packs"); break;
      case "to-home": if(turnInt){clearInterval(turnInt);turnInt=null;} SFX.tap(); go("home"); break;
      case "to-setup": SFX.tap(); go("setup"); break;

      case "pick-pool": S.poolId=el.dataset.pool; SFX.tap(); saveCfg(); render(); break;
      case "toggle-shuffle": S.shuffle=!S.shuffle; SFX.tap(); saveCfg(); render(); break;
      case "begin": begin(); break;

      case "start-turn": startCountdown(); break;
      case "mark": doMark(el.dataset.ok==="1"); break;
      case "quit": SFX.tap(); finish(); break;
      case "again": S.play={ names: S.shuffle? shuffle(S.play.names): S.play.names.slice(), idx:0, ok:0, pass:0, stage:"ready", cd:3, results:[] }; SFX.next(); go("play"); break;

      case "tab": S.tab=el.dataset.t; S.up.preview=false; S.up.error=""; SFX.tap(); render(); break;
      case "tpl-download": SFX.tap(); downloadCSV("callmyname_template.csv", templateCSV()); break;
      case "file-pick": { var fi=document.getElementById("fileInput"); if(fi) fi.click(); } break;
      case "paste-preview": { var ta=document.getElementById("pasteArea"); var pn=document.getElementById("poolName"); if(pn) S.up.name=pn.value; var txt=ta?ta.value:""; if(!txt||!txt.trim()){ S.up.error="붙여넣은 내용이 없어요. 인물 이름을 한 줄에 하나씩 입력해 주세요."; render(); break; } computePreview(namesFromText(txt)); } break;
      case "up-confirm": confirmSave(); break;
      case "up-cancel": cancelUp(); break;
      case "del-pool": delPool(parseInt(el.dataset.idx,10)); break;
      case "export-pool": { var lp=loadPools(); var p=lp[parseInt(el.dataset.idx,10)]; if(p){ downloadCSV("callmyname_"+p.name+".csv", itemsToText(p.items)); SFX.tap(); } } break;
      case "export-builtin": { var bp=null; for(var i=0;i<PACKS.length;i++){ if(PACKS[i].id===el.dataset.id) bp=PACKS[i]; } if(bp){ downloadCSV("callmyname_"+bp.name+".csv", itemsToText(bp.items)); SFX.tap(); } } break;
    }
  }
  app.addEventListener("click", function(e){ var el=e.target.closest("[data-action]"); if(!el) return; handle(el.dataset.action, el); });

  /* =========================================================
     EXPOSE FOR TESTS
  ========================================================= */
  window.App={
    S:S, go:go, handle:handle, render:render, begin:begin,
    parseCSV:parseCSV, csvCell:csvCell, templateCSV:templateCSV, itemsToText:itemsToText, namesFromText:namesFromText,
    computePreview:computePreview, confirmSave:confirmSave, loadPools:loadPools, allPools:allPools
  };

  starfield();
  render();
})();
</script>
