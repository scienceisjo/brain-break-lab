<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>그림 이어그리기 · CLASS GAME WORLD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --paper:#faf6ea; --card:#fffdf5; --card2:#fbf5e2;
    --ink:#3a3550; --ink-soft:#837c96; --rule:rgba(120,145,190,.24);
    --coral:#ef5d60; --teal:#1fa79a; --mustard:#e9a63c; --purple:#7a6ad4;
    --line:#3a3550;
    --text:#3a3550; --muted:#837c96;
    --f-hand:'Gaegu',cursive;
    --f-body:'Pretendard','Pretendard Variable',system-ui,sans-serif;
    --f-jua:'Jua',sans-serif;
    /* 손그림 테두리 반경 */
    --sk1:16px 22px 18px 20px/20px 16px 22px 18px;
    --sk2:22px 16px 20px 18px/16px 22px 18px 20px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{color-scheme:light}
  html,body{margin:0;padding:0;min-height:100%}
  button,input,textarea,select{font-family:inherit; color:var(--ink)}
  body{
    background-color:var(--paper);
    background-image:repeating-linear-gradient(180deg, transparent 0 32px, var(--rule) 32px 33px);
    color:var(--text); font-family:var(--f-body); overflow-x:hidden; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:560px; margin:0 auto; padding:20px 18px 40px; min-height:100vh; display:flex; flex-direction:column; position:relative}

  .bar{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px}
  .brand{display:flex; align-items:center; gap:9px}
  .dot{width:11px; height:11px; border-radius:50%; background:var(--coral); border:1.5px solid var(--ink)}
  .brand b{font-family:var(--f-hand); font-weight:700; font-size:14px; letter-spacing:.5px; color:var(--ink-soft)}
  .sound-btn{border:2px solid var(--ink); background:var(--card); color:var(--ink); width:40px; height:34px; border-radius:12px 9px 11px 8px/8px 11px 9px 12px; font-size:15px; cursor:pointer}
  .sound-btn:active{transform:translateY(1px)}

  .screen{flex:1; display:flex; flex-direction:column; animation:rise .4s cubic-bezier(.16,1,.3,1)}
  @keyframes rise{from{opacity:0; transform:translateY(12px)}to{opacity:1; transform:translateY(0)}}
  .center{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:12px}
  .spacer{flex:1}

  .eyebrow{font-family:var(--f-hand); font-weight:700; font-size:15px; letter-spacing:1px; color:var(--coral)}
  h1.title{font-family:var(--f-hand); font-weight:700; font-size:clamp(38px,12.5vw,62px); line-height:1.06; margin:2px 0 0; letter-spacing:1px; color:var(--ink)}
  .title-wrap{position:relative; display:inline-block; padding-bottom:14px}
  .title-underline{position:absolute; left:-2%; bottom:2px; width:104%; height:14px}
  .doodles{position:relative; height:0}
  .dood{position:absolute; font-size:20px; opacity:.9}
  .tag{font-family:var(--f-hand); font-weight:700; color:var(--ink-soft); font-size:19px; margin:8px 0 0}
  .sect-h{font-family:var(--f-hand); font-weight:700; font-size:34px; margin:2px 0 6px; color:var(--ink)}
  .hl{background:linear-gradient(180deg, transparent 55%, rgba(233,166,60,.5) 55% 92%, transparent 92%); padding:0 .12em; border-radius:2px}
  .lead{color:var(--ink-soft); font-family:var(--f-hand); font-weight:400; font-size:17px; line-height:1.5}
  .grp-label{font-family:var(--f-hand); font-weight:700; font-size:16px; color:var(--teal); margin:14px 0 6px}

  .btn{display:flex; align-items:center; justify-content:center; gap:8px; width:100%; border:2.5px solid var(--ink); border-radius:var(--sk1); padding:14px 18px; font-family:var(--f-hand); font-weight:700; font-size:23px; letter-spacing:.5px; cursor:pointer; color:var(--ink); background:var(--card); transition:transform .1s, box-shadow .12s; text-align:center; box-shadow:2px 3px 0 rgba(58,53,80,.18)}
  .btn:active{transform:translate(1px,2px); box-shadow:1px 1px 0 rgba(58,53,80,.18)}
  .btn-primary{background:var(--coral); color:#fff8f3; border-radius:var(--sk2)}
  .btn-teal{background:var(--teal); color:#f2fffb}
  .btn-ghost{background:var(--card); color:var(--ink)}
  .btn-sm{padding:10px 14px; font-size:19px}
  .stack{display:flex; flex-direction:column; gap:11px}
  .row{display:flex; gap:11px}
  .row>*{flex:1}

  .panel{background:var(--card); border:2.5px solid var(--ink); border-radius:var(--sk1); padding:17px; box-shadow:3px 4px 0 rgba(58,53,80,.14); margin:10px 0}
  .chip-num{display:inline-flex; align-items:center; justify-content:center; min-width:26px; height:26px; padding:0 7px; border-radius:9px 6px 8px 7px/7px 8px 6px 9px; background:var(--coral); border:2px solid var(--ink); color:#fff; font-family:var(--f-hand); font-weight:700; font-size:15px; margin-right:4px}

  .seg{display:flex; gap:6px; background:var(--card2); border:2px solid var(--ink); border-radius:14px 10px 12px 11px/11px 12px 10px 14px; padding:5px}
  .seg button{flex:1; border:none; background:transparent; color:var(--ink-soft); padding:9px 6px; border-radius:9px; font-family:var(--f-hand); font-weight:700; font-size:17px; cursor:pointer}
  .seg button.on{background:var(--teal); color:#fff}
  .cats{display:flex; flex-wrap:wrap; gap:8px}
  .cat{border:2px solid var(--ink); background:var(--card); color:var(--ink); border-radius:12px 8px 11px 9px/9px 11px 8px 12px; padding:6px 13px; font-family:var(--f-hand); font-weight:700; font-size:17px; cursor:pointer}
  .cat.on{background:var(--coral); color:#fff}
  .cat:active{transform:translateY(1px)}
  .opt-row{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 0 2px}
  .opt-row .nm{font-family:var(--f-hand); font-weight:700; font-size:19px; color:var(--ink)}
  .opt-row .nm small{display:block; color:var(--ink-soft); font-size:13px; font-family:var(--f-hand); font-weight:400}
  .stepper{display:flex; align-items:center; gap:12px}
  .stepper button{width:40px; height:40px; border-radius:12px 8px 11px 9px/9px 11px 8px 12px; border:2.5px solid var(--ink); background:var(--card); color:var(--ink); font-size:24px; font-family:var(--f-hand); font-weight:700; cursor:pointer; line-height:1}
  .stepper button:active{transform:translateY(1px)}
  .stepper .val{font-family:var(--f-hand); font-weight:700; font-size:30px; min-width:38px; text-align:center; color:var(--coral)}

  .big-emoji{font-size:56px}
  .fore-t{font-family:var(--f-hand); font-weight:700; font-size:clamp(30px,9vw,44px); color:var(--ink); line-height:1.08}
  .word-input{width:100%; border-radius:14px 10px 12px 11px/11px 12px 10px 14px; border:2.5px solid var(--ink); background:#fff; color:var(--ink); font-family:var(--f-hand); font-weight:700; font-size:26px; padding:12px; text-align:center}
  .word-input:focus{outline:none; box-shadow:0 0 0 3px rgba(31,167,154,.3)}
  .word-input::placeholder{color:var(--ink-soft); font-weight:400}

  .step-badge{display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:8px}
  .step-badge .pill{font-family:var(--f-hand); font-weight:700; font-size:16px; color:#fff; background:var(--teal); border:2px solid var(--ink); border-radius:16px 12px 14px 13px/13px 14px 12px 16px; padding:4px 13px}
  .step-badge .pill.alt{background:var(--coral)}
  .draw-prompt{background:#fff6cf; border:2.5px solid var(--ink); border-radius:var(--sk2); padding:13px; text-align:center; font-family:var(--f-hand); font-weight:400; font-size:17px; color:var(--ink); margin-bottom:10px; box-shadow:3px 4px 0 rgba(58,53,80,.14); transform:rotate(-.6deg)}
  .draw-prompt b{font-family:var(--f-hand); font-weight:700; font-size:clamp(28px,7.5vw,38px); color:var(--ink); display:block; margin-top:2px; letter-spacing:.5px; word-break:keep-all; line-height:1.15}
  .guess-q{text-align:center; font-family:var(--f-hand); font-weight:700; font-size:28px; color:var(--ink); margin-bottom:10px}
  .pad-wrap{display:flex; justify-content:center; margin:0 auto}
  .pad{width:100%; max-width:360px; aspect-ratio:1/1; border-radius:16px 12px 18px 14px/14px 18px 12px 16px; border:3px solid var(--ink); background:#fff; display:block; touch-action:none; box-shadow:4px 5px 0 rgba(58,53,80,.16)}
  img.pad{object-fit:contain}

  .tools{margin-top:12px; background:var(--card2); border:2px solid var(--ink); border-radius:16px 12px 14px 13px/13px 14px 12px 16px; padding:12px 10px}
  .swatches{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; align-items:center}
  .swatch{width:31px; height:31px; border-radius:50%; border:2.5px solid var(--ink); cursor:pointer; padding:0}
  .swatch.on{box-shadow:0 0 0 3px var(--mustard); transform:scale(1.12)}
  .tool-row{display:flex; gap:8px; justify-content:center; align-items:center; margin-top:10px; flex-wrap:wrap}
  .sizes{display:flex; gap:6px; align-items:center; background:var(--card); border:2px solid var(--ink); border-radius:11px; padding:5px 8px}
  .size-btn{width:32px; height:28px; border:none; background:transparent; cursor:pointer; display:flex; align-items:center; justify-content:center; border-radius:7px}
  .size-btn span{display:block; background:var(--ink); border-radius:50%; opacity:.5}
  .size-btn.on{background:rgba(233,166,60,.35)} .size-btn.on span{opacity:1}
  .tool-btn{border:2px solid var(--ink); background:var(--card); color:var(--ink); border-radius:11px 8px 10px 9px/9px 10px 8px 11px; padding:8px 11px; font-size:16px; font-family:var(--f-hand); font-weight:700; cursor:pointer}
  .tool-btn.on{background:var(--purple); color:#fff}
  .tool-btn:active{transform:translateY(1px)}

  .reveal-item{display:flex; flex-direction:column; align-items:center; gap:5px; padding:12px 0; position:relative}
  .reveal-item:not(:last-child)::after{content:"↓"; color:var(--coral); font-size:24px; font-weight:bold; margin-top:6px; font-family:var(--f-hand)}
  .ri-tag{font-family:var(--f-hand); font-weight:700; font-size:16px; color:var(--teal)}
  .ri-word{font-family:var(--f-hand); font-weight:700; font-size:clamp(28px,8vw,40px); color:var(--ink); word-break:keep-all; text-align:center; line-height:1.1}
  .ri-guess{font-family:var(--f-hand); font-weight:700; font-size:clamp(24px,7vw,34px); color:var(--ink); word-break:keep-all; text-align:center; line-height:1.15}
  .ri-img{width:220px; max-width:70vw; aspect-ratio:1/1; object-fit:contain; background:#fff; border-radius:14px 10px 16px 12px/12px 16px 10px 14px; border:2.5px solid var(--ink)}
  .drift{background:#fff6cf; border:2.5px solid var(--ink); border-radius:var(--sk1); padding:14px; text-align:center; margin:12px 0; box-shadow:3px 4px 0 rgba(58,53,80,.14)}
  .drift .dl{font-family:var(--f-hand); font-weight:700; font-size:15px; color:var(--ink-soft)}
  .drift .dd{font-family:var(--f-hand); font-weight:700; font-size:24px; margin-top:4px; color:var(--ink); word-break:keep-all; line-height:1.25}
  .drift .dd .ar{color:var(--coral); margin:0 6px}

  .hub-a{text-decoration:none}
  .footer-note{font-family:var(--f-hand); font-weight:400; font-size:15px; color:var(--ink-soft); text-align:center; margin-top:14px; line-height:1.6}

  @media (max-width:360px){ .wrap{padding:16px 13px 34px} .swatch{width:28px;height:28px} }
  @media (prefers-reduced-motion:reduce){ *{animation-duration:.001s !important; transition-duration:.05s !important} }
</style>
</head>

</div>

  }

    var cv=document.getElementById("padCanvas"); if(!cv) return;
    var ctx=null; try{ ctx=cv.getContext("2d"); }catch(e){}
    if(!ctx){ padCtx=null; return; }
    var box=cv.parentElement; var size=Math.min((box&&box.clientWidth)||320, 360); if(size<60) size=320;
    var DPR=Math.min(window.devicePixelRatio||1,2);
    cv.style.width=size+"px"; cv.style.height=size+"px";
    cv.width=Math.round(size*DPR); cv.height=Math.round(size*DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0); ctx.lineCap="round"; ctx.lineJoin="round";
    ctx.fillStyle="#ffffff"; ctx.fillRect(0,0,size,size);
    padCtx=ctx; padSize=size; padStack=[];
    var drawing=false;
    function pos(e){ var r=cv.getBoundingClientRect(); return { x:(e.clientX-r.left)*(size/r.width), y:(e.clientY-r.top)*(size/r.height) }; }
    cv.onpointerdown=function(e){ e.preventDefault(); drawing=true; try{ cv.setPointerCapture(e.pointerId); }catch(_){}
      try{ padStack.push(cv.toDataURL()); if(padStack.length>24) padStack.shift(); }catch(_){}

      ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x+0.01,p.y+0.01); ctx.stroke();
    };
    cv.onpointermove=function(e){ if(!drawing) return; e.preventDefault(); var p=pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); };
    var end=function(){ drawing=false; };
    cv.onpointerup=end; cv.onpointerleave=end; cv.onpointercancel=end;

  }
  function highlightTools(){
    var sw=document.querySelectorAll("[data-swatch]");

    var t=S.tel;
    var isDraw = (t.step%2===1);
    t.chain.push({ type: isDraw?"drawing":"guess", value:value });
    t.step++;
    if(t.step > t.players){ SFX.reveal(); go("reveal"); return; }
    t.stage="handoff"; SFX.pass(); render();
  }
  function submitDrawing(){
    var cv=document.getElementById("padCanvas"); var data="[그림]";
    if(cv){ try{ data=cv.toDataURL("image/png"); }catch(e){ data="[그림]"; } }
    storeStep(data);
  }
  function doGuess(){
    var inp=document.getElementById("guessInput");
    var g=inp? inp.value.trim() : "";
    if(!g){ if(inp){ inp.focus(); } return; }
    storeStep(g);
  }

  /* =========================================================
     ACTIONS
  ========================================================= */
  function handle(action, el){
    switch(action){
      case "sound-toggle": S.sound=!S.sound; saveCfg(); { var sb=document.getElementById("soundBtn"); if(sb) sb.textContent=S.sound?"🔊":"🔇"; } if(S.sound) SFX.tap(); break;
      case "start": SFX.tap(); go("setup"); break;
      case "rules": SFX.tap(); go("rules"); break;
      case "rules-back": SFX.tap(); go("home"); break;
      case "to-home": SFX.tap(); go("home"); break;
      case "to-setup": SFX.tap(); go("setup"); break;

      case "players-up": if(S.players<10){ S.players++; SFX.tap(); saveCfg(); render(); } break;
      case "players-dn": if(S.players>3){ S.players--; SFX.tap(); saveCfg(); render(); } break;
      case "set-wordmode": S.wordMode=el.dataset.v; SFX.tap(); saveCfg(); render(); break;
      case "set-cat": S.cat=el.dataset.v; SFX.tap(); saveCfg(); render(); break;
      case "begin": begin(); break;
      case "start-word": doStartWord(); break;

      case "tel-go": telGo(); break;
      case "submit-draw": submitDrawing(); break;
      case "submit-guess": doGuess(); break;

      case "color": curColor=el.dataset.swatch; curEraser=false; highlightTools(); SFX.tap(); break;
      case "eraser": curEraser=true; highlightTools(); SFX.tap(); break;
      case "size": curSize=parseInt(el.dataset.size,10); highlightTools(); SFX.tap(); break;
      case "undo": padUndo(); break;
      case "clear": padClear(); break;

      case "quit-confirm": if(confirm("지금 그만하면 지금까지 그린 게 사라져요. 그만할까요?")){ SFX.tap(); go("home"); } break;
      case "again": SFX.tap(); go("setup"); break;
    }
  }
  app.addEventListener("click", function(e){ var el=e.target.closest("[data-action]"); if(!el) return; handle(el.dataset.action, el); });

  /* =========================================================
     EXPOSE FOR TESTS
  ========================================================= */
  window.App={
    S:S, go:go, handle:handle, render:render, begin:begin,
    startChain:startChain, telGo:telGo, storeStep:storeStep, doGuess:doGuess, doStartWord:doStartWord,
    pickWord:pickWord, WORDS:WORDS, LEVELS:LEVELS
  };

  render();
})();
</script>
<!-- ⏱ CGW 선생님 타이머 위젯 (자유 카운트다운) -->
<div id="cgwt" data-open="0">
  <button id="cgwt-fab" title="타이머">⏱<span id="cgwt-mini"></span></button>
  <div id="cgwt-panel">
    <div id="cgwt-time">01:00</div>
    <div class="cgwt-row cgwt-presets">
      <button data-s="30">30초</button><button data-s="60">1분</button><button data-s="120">2분</button><button data-s="180">3분</button><button data-s="300">5분</button>
    </div>
    <div class="cgwt-row">
      <button data-a="-10">−10초</button><button data-a="10">+10초</button><button data-a="60">+1분</button>
    </div>
    <div class="cgwt-row cgwt-ctrl">
      <button id="cgwt-go">▶ 시작</button><button id="cgwt-reset" title="리셋">↺</button><button id="cgwt-x" title="닫기">✕</button>
    </div>
  </div>
</div>
<style>
#cgwt{position:fixed;right:14px;bottom:14px;z-index:2147483000;font-family:system-ui,'Do Hyeon','Jua',sans-serif}
#cgwt-fab{width:56px;height:56px;border-radius:50%;border:none;cursor:pointer;font-size:24px;color:#fff;
  background:linear-gradient(135deg,#7c5cff,#ff5ea8);box-shadow:0 6px 20px rgba(0,0,0,.45);position:relative;line-height:1}
#cgwt-mini{position:absolute;left:0;right:0;bottom:6px;font-size:10px;font-weight:700;letter-spacing:.5px}
#cgwt-panel{position:absolute;right:0;bottom:66px;width:236px;background:#1c1630;color:#fff;border:1px solid #443a6e;
  border-radius:16px;padding:14px;box-shadow:0 16px 40px rgba(0,0,0,.55);display:none}
#cgwt[data-open="1"] #cgwt-panel{display:block}
#cgwt-time{font-family:ui-monospace,'Courier New',monospace;font-size:46px;text-align:center;font-weight:700;letter-spacing:2px;margin-bottom:12px}
#cgwt.alarm #cgwt-time{color:#ff5e6c;animation:cgwtBlink .5s steps(1) infinite}
@keyframes cgwtBlink{50%{opacity:.2}}
.cgwt-row{display:flex;gap:6px;justify-content:center;margin-bottom:8px;flex-wrap:wrap}
.cgwt-row button{flex:1;min-width:0;padding:9px 4px;border-radius:10px;border:1px solid #443a6e;background:#2a2145;color:#dcd4ff;font-size:13px;cursor:pointer}
.cgwt-row button:active{transform:scale(.95)}
.cgwt-ctrl #cgwt-go{flex:2.4;background:linear-gradient(135deg,#3ddc84,#1fb866);color:#052a1c;font-weight:700;border:none}
.cgwt-ctrl #cgwt-go.pause{background:linear-gradient(135deg,#ffb23f,#ff8a3d);color:#2a1500}
</style>
<script>
(function(){
  var root=document.getElementById('cgwt'), timeEl=document.getElementById('cgwt-time'),
      mini=document.getElementById('cgwt-mini'), go=document.getElementById('cgwt-go');
  var total=60, left=60, running=false, tid=null, ac=null;
  function fmt(s){s=Math.max(0,s|0);var m=(s/60)|0,x=s%60;return (m<10?'0':'')+m+':'+(x<10?'0':'')+x;}
  function paint(){timeEl.textContent=fmt(left);mini.textContent=running?fmt(left):'';}
  function beep(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();var o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=880;g.gain.value=.16;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.4);}catch(e){}}
  function alarm(){root.classList.add('alarm');var n=0,iv=setInterval(function(){beep();if(++n>=5)clearInterval(iv);},560);setTimeout(function(){root.classList.remove('alarm');},4200);}
  function tick(){left--;paint();if(left<=0){stopTimer();alarm();}}
  function start(){if(running){pause();return;}if(left<=0)left=total;running=true;go.textContent='⏸ 정지';go.classList.add('pause');try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();}catch(e){}tid=setInterval(tick,1000);paint();}
  function pause(){running=false;go.textContent='▶ 시작';go.classList.remove('pause');clearInterval(tid);paint();}
  function stopTimer(){running=false;go.textContent='▶ 시작';go.classList.remove('pause');clearInterval(tid);mini.textContent='';}
  function setT(s){total=left=s;pause();root.classList.remove('alarm');paint();}
  document.getElementById('cgwt-fab').onclick=function(){root.dataset.open=root.dataset.open==='1'?'0':'1';};
  document.getElementById('cgwt-x').onclick=function(){root.dataset.open='0';};
  document.getElementById('cgwt-reset').onclick=function(){setT(total);};
  go.onclick=start;
  root.querySelectorAll('[data-s]').forEach(function(b){b.onclick=function(){setT(+b.dataset.s);};});
  root.querySelectorAll('[data-a]').forEach(function(b){b.onclick=function(){setT(Math.max(0,left+(+b.dataset.a)));};});
  setT(60);
})();
</script>
